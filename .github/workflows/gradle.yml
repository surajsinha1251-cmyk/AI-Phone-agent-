                  dragBtn.setOnTouchListener(dragListener)

                  statusTv = TextView(this).apply {
                      text = "👑 AI 15.0 Ready: बोलें या लिखें!"
                      setTextColor(Color.parseColor("#00F5D4"))
                      textSize = 11.5f
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(6, 0, 4, 0)
