              private fun setTouchPassThrough(passThrough: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (passThrough) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              private fun setWindowGhostMode(ghost: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (ghost) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  view.alpha = if (ghost) 0.0f else 1.0f
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              // True Mini-Bubble Mode: Jab idle state mein minimize karenge toh chhota bubble ban jayega!
              private fun autoCollapseBar(collapse: Boolean) {
                  val dm = resources.displayMetrics
                  isMinimized = collapse
                  inputRow.visibility = if (collapse) View.GONE else View.VISIBLE
                  planPreviewTv.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  vaultOpenBtn.visibility = if (collapse) View.GONE else View.VISIBLE
                  missionBtn.visibility = if (collapse) View.GONE else View.VISIBLE
                  ttsToggleBtn.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  pauseResumeBtn.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  minBtn.text = if (collapse) "➕" else "➖"
                  params.width = if (collapse && !isRunning) WindowManager.LayoutParams.WRAP_CONTENT else (dm.widthPixels * 0.96).toInt()
                  setTouchPassThrough(true)
              }

              private fun showVisualTouchDot(x: Float, y: Float) {
                  scope.launch {
                      try {
                          val dotSize = 44
                          val dot = View(this@AgentService).apply {
                              background = GradientDrawable().apply {
                                  shape = GradientDrawable.OVAL
                                  setColor(Color.parseColor("#88EF4444"))
                                  setStroke(4, Color.parseColor("#38BDF8"))
                              }
                          }
                          val dp = WindowManager.LayoutParams(
                              dotSize, dotSize,
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                              PixelFormat.TRANSLUCENT
                          ).apply {
                              gravity = Gravity.TOP or Gravity.START
                              this.x = (x - dotSize / 2).toInt().coerceAtLeast(0)
                              this.y = (y - dotSize / 2).toInt().coerceAtLeast(0)
                          }
                          windowManager.addView(dot, dp)
                          delay(300)
                          windowManager.removeView(dot)
                      } catch (_: Exception) {}
                  }
              }

              private fun getPersonalVaultSummary(): String {
                  val p = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  return "Name:${p.getString("vaultName", "")} | Contact:${p.getString("vaultContact", "")} | UPI:${p.getString("vaultUpi", "")} | Skills:${p.getString("vaultSkills", "")} | Rules:${p.getString("userMemory", "")} | Mission:${p.getString("activeMission", "")} | Learned:${p.getString("learnedPaths", "")}"
              }

              private fun getLiveDeviceContext(): String {
                  val nowStr = SimpleDateFormat("EEE, dd MMM yyyy hh:mm a", Locale.ENGLISH).format(Date())
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  return "Time:$nowStr | Bat:$bat% | Clip:'${getClipboardText().take(100)}' | LastNotif/OTP:'${latestNotificationText.take(100)}'"
              }

              private fun saveBrainLog(entry: String) {
                  val p = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val updated = ((p.getString("brainLogs", "") ?: "").lines().takeLast(12) + entry).joinToString("\n")
                  p.edit().putString("brainLogs", updated).apply()
              }

              private fun recordLearnedSuccess(goal: String) {
                  if (history.isEmpty()) return
                  val p = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val old = p.getString("learnedPaths", "") ?: ""
                  val summary = "${goal.take(25)}->${history.takeLast(3).joinToString(",")}"
                  if (!old.contains(goal.take(15), true)) {
                      p.edit().putString("learnedPaths", "$old | $summary".takeLast(500)).apply()
                  }
              }

              private suspend fun tryInstantOfflineReflex(cmd: String): Boolean {
                  val c = cmd.trim().lowercase()
                  return when {
                      c in listOf("torch on", "flashlight on", "टॉर्च जलाओ", "टॉर्च ऑन") -> { executeSystemControl("torch_on"); stopAgent("⚡ Torch ON!"); true }
                      c in listOf("torch off", "flashlight off", "टॉर्च बंद", "टॉर्च बंद करो") -> { executeSystemControl("torch_off"); stopAgent("⚡ Torch OFF!"); true }
                      c in listOf("back", "पीछे जाओ", "बैक") -> { performGlobalAction(GLOBAL_ACTION_BACK); stopAgent("⚡ Back!"); true }
                      c in listOf("home", "होम स्क्रीन") -> { performGlobalAction(GLOBAL_ACTION_HOME); stopAgent("⚡ Home!"); true }
                      c in listOf("volume up", "आवाज़ बढ़ाओ") -> { executeSystemControl("volume_up"); stopAgent("⚡ Volume Up!"); true }
                      c in listOf("volume down", "आवाज़ कम करो") -> { executeSystemControl("volume_down"); stopAgent("⚡ Volume Down!"); true }
                      c in listOf("scroll down", "नीचे स्क्रॉल करो") -> { performSwipe("up", 300); stopAgent("⚡ Scrolled!"); true }
                      else -> false
                  }
              }

              private fun needsDeepWebResearch(cmd: String): Boolean {
                  val l = cmd.lowercase()
                  return listOf("episode", "एपिसोड", "latest", "naya", "नया", "last", "aakhiri", "kamao", "कमाओ", "earning", "paisa", "पैसा", "challenge", "चैलेंज", "price", "news", "kaun", "kab", "research").any { l.contains(it) }
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  agentJob?.cancel()
                  isRunning = true
                  isPaused = false
                  pauseResumeBtn.text = "⏸"
                  if (!isResumeWithCorrection) {
                      history.clear(); recentActionSignatures.clear(); failedTargets.clear(); researchedContext = ""
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      if (!isResumeWithCorrection && tryInstantOfflineReflex(currentGoal)) return@launch

                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()
                      val stepQueue = mutableListOf<JSONObject>()

                      if (!isResumeWithCorrection && needsDeepWebResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "🔍 Google se satik jankari nikal raha hoon..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val masterPlan = researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, currentPkg)
                          if (!isRunning) return@launch

                          researchedContext = masterPlan.optString("researched_info", "")
                          val savedMission = masterPlan.optString("save_mission_plan", "")
                          if (savedMission.isNotBlank()) {
                              getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE).edit().putString("activeMission", savedMission).apply()
                          }
                          val clipText = masterPlan.optString("copy_to_clipboard", "")
                          if (clipText.isNotBlank()) copyToClipboard(clipText)
                          val speakMsg = masterPlan.optString("speak", "")
                          if (speakMsg.isNotEmpty()) speakOut(speakMsg)

                          val initialSteps = masterPlan.optJSONArray("steps")
                          if (initialSteps != null) {
                              for (i in 0 until initialSteps.length()) stepQueue.add(initialSteps.getJSONObject(i))
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("Theek hai, aapki baat maankar rasta badal raha hoon")
                      } else {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "⚡ Genius Fast-Track: Seedha action..."
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastStructuralHash = ""

                      while (isRunning) {
                          while (isPaused && isRunning) delay(400)

                          var stepIdx = 0
                          while (stepQueue.isNotEmpty() && isRunning) {
                              while (isPaused && isRunning) delay(400)
                              if (stepIdx > 0) readScreenElements()
                              stepIdx++

                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")
                              if (act == "done") {
                                  val doneMsg = step.optString("message", "Kaam poora ho gaya!")
                                  recordLearnedSuccess(currentGoal)
                                  speakOut(doneMsg)
                                  vibratePhone()
                                  stopAgent("✅ $doneMsg")
                                  return@launch
                              }
                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "Yahan aapki madad chahiye")
                                  val note = step.optString("capability_note", "")
                                  val full = if (note.isNotEmpty()) "$askMsg ($note)" else askMsg
                                  speakOut(full); vibratePhone(); pauseForUser("🤝 $full")
                                  return@launch
                              }
                              if (!executeLocalStepWithVerification(step)) {
                                  stepQueue.clear()
                                  break
                              }
                          }

                          if (!isRunning) break
                          aiConsultCount++
                          if (aiConsultCount > 60) {
                              stopAgent("✅ Kaam poora ho gaya!")
                              break
                          }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "🧠 Genius Brain: Agla kadam soch raha hoon..."
                          delay(380)

                          val screenSnapshot = readScreenElements()
                          val structuralSnapshot = screenSnapshot.replace(Regex("\\d+:\\d+"), "").replace(Regex("\\d+%"), "")
                          val currentHash = structuralSnapshot.hashCode().toString()
                          if (currentHash == lastStructuralHash) stuckCount++ else { stuckCount = 0; lastStructuralHash = currentHash }

                          if (recentActionSignatures.size >= 4) {
                              val s = recentActionSignatures.takeLast(4)
                              if (s[0] == s[2] && s[1] == s[3]) {
                                  stuckCount += 2
                                  failedTargets.add(s[0])
                              }
                          }

                          val needVision = stuckCount >= 1 || screenSnapshot.lines().size < 6
                          val screenshotB64 = if (needVision) captureScreenBase64WithGrid() else null
                          val appsForPrompt = if (aiConsultCount <= 2 || screenSnapshot.contains("launcher") || screenSnapshot.contains("home")) installedApps else "Use open_app if needed"

                          val nextDecision = thinkLikeGeniusHuman(
                              goal = currentGoal,
                              userCorrection = liveUserCorrection,
                              researchedInfo = researchedContext,
                              vaultSummary = vaultSummary,
                              deviceContext = getLiveDeviceContext(),
                              installedApps = appsForPrompt,
                              screen = screenSnapshot,
                              screenshotB64 = screenshotB64,
                              stuckCount = stuckCount
                          )
                          if (!isRunning) break
                          liveUserCorrection = ""

                          val chosenBtn = nextDecision.optString("chosen_button_info", "")
                          val nextPlan = nextDecision.optString("next_step_plan", "")
                          val capNote = nextDecision.optString("capability_note", "")
                          if (chosenBtn.isNotEmpty() || nextPlan.isNotEmpty()) {
                              planPreviewTv.text = "🎯 Button: $chosenBtn | Aage: $nextPlan"
                              saveBrainLog("Btn:$chosenBtn -> Next:$nextPlan")
                          }

                          val newClip = nextDecision.optString("copy_to_clipboard", "")
                          if (newClip.isNotBlank()) copyToClipboard(newClip)

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ Switching Key/Model (4s)..."
                              delay(4000)
                              continue
                          } else if (topAct == "done") {
                              val m = nextDecision.optString("message", "Kaam poora ho gaya!")
                              recordLearnedSuccess(currentGoal)
                              speakOut("$m Kya iske aage kuch aur karna hai?")
                              vibratePhone()
                              stopAgent("✅ $m")
                              break
                          } else if (topAct == "ask_user") {
                              val m = nextDecision.optString("message", "Yahan aapki madad chahiye")
                              val full = if (capNote.isNotEmpty()) "$m — $capNote" else m
                              speakOut(full); vibratePhone(); pauseForUser("🤝 $full")
                              break
                          }

                          val batchSpeak = nextDecision.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) stepQueue.add(arr.getJSONObject(i))
                          } else if (topAct.isNotEmpty()) {
                              stepQueue.add(nextDecision)
                          } else {
                              stopAgent("✅ Kaam poora ho gaya!")
                              break
                          }
                      }
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val nextHint = step.optString("next_step", "")
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "app"
                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  if (nextHint.isNotEmpty()) planPreviewTv.text = "🎯 Iske baad: $nextHint"

                  val sig = "[$currentPkg]$action(#$targetId '$target' $x,$y)"
                  history.add("$sig -> $reason")
                  if (history.size > 18) history.removeAt(0)
                  recentActionSignatures.add(sig)
                  if (recentActionSignatures.size > 8) recentActionSignatures.removeAt(0)

                  if (action == "click" || action == "long_press") {
                      val lbl = nodeMap[targetId]?.let { (it.text ?: it.contentDescription ?: "").toString().lowercase() } ?: target.lowercase()
                      val danger = listOf("delete forever", "uninstall", "pay ₹", "send money", "confirm payment", "factory reset")
                      val goalL = currentGoal.lowercase()
                      if (danger.any { lbl.contains(it) && !goalL.contains(it.split(" ").first()) }) {
                          pauseForUser("🛡️ Safety Lock: '$lbl' khatarnak button hai. Kya dabana hai? (▶ dabayein)")
                          return false
                      }
                  }

                  return when (action) {
                      "open_app" -> { val ok = openAppByName(step.optString("app_name", target)); delay(2100); ok }
                      "direct_intent" -> { val ok = fireDirectIntent(step.optString("intent_type", ""), step.optString("data", text)); delay(2200); ok }
                      "write_content" -> { copyToClipboard(text); val ok = performSmartType(targetId, target, x, y, text, step.optBoolean("press_enter", false)); delay(1400); ok }
                      "scroll_loop" -> {
                          val dir = step.optString("direction", "up")
                          val sec = step.optInt("interval_sec", 4).coerceIn(2, 20)
                          val cnt = step.optInt("count", 250)
                          for (i in 1..cnt) {
                              if (!isRunning) break
                              while (isPaused && isRunning) delay(400)
                              statusTv.setTextColor(Color.parseColor("#4ADE80"))
                              statusTv.text = "🔄 Auto-Scroll (#$i) — Rokne ke liye ⏹ ya Vol-Down dabayein"
                              performSwipe(dir, 320)
                              delay(sec * 1000L)
                          }
                          true
                      }
                      "scroll_down" -> {
                          for (i in 1..step.optInt("times", 1).coerceIn(1, 8)) {
                              if (!isRunning) break
                              performSwipe("up", 320); delay(1100)
                          }
                          true
                      }
                      "scroll_up" -> { performSwipe("down", 320); delay(1100); true }
                      "fast_scroll" -> { performSwipe(step.optString("direction", "up"), 130); delay(900); true }
                      "swipe_left" -> { performSwipe("left", 280); delay(1000); true }
                      "swipe_right" -> { performSwipe("right", 280); delay(1000); true }
                      "double_tap" -> { val c = getCoordsForTarget(targetId, target, x, y); performDoubleTap(c.first.toFloat(), c.second.toFloat()); delay(1200); true }
                      "long_press" -> { val c = getCoordsForTarget(targetId, target, x, y); performLongPress(c.first.toFloat(), c.second.toFloat()); delay(1300); true }
                      "pinch_zoom" -> { performPinchZoom(step.optBoolean("zoom_in", true)); delay(1100); true }
                      "drag_and_drop" -> {
                          val c = getCoordsForTarget(targetId, target, x, y)
                          performDragGesture(c.first.toFloat(), c.second.toFloat(), step.optInt("to_x", 540).toFloat(), step.optInt("to_y", 500).toFloat())
                          delay(1200); true
                      }
                      "set_slider" -> {
                          val node = nodeMap[targetId]
                          if (node != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              val args = Bundle().apply { putFloat(AccessibilityNodeInfo.ACTION_ARGUMENT_PROGRESS_VALUE, step.optDouble("progress", 50.0).toFloat()) }
                              node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_SET_PROGRESS.id, args)
                          }
                          delay(900); true
                      }
                      "hide_keyboard" -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              softKeyboardController.showMode = SHOW_MODE_HIDDEN; delay(400); softKeyboardController.showMode = SHOW_MODE_AUTO
                          } else performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(700); true
                      }
                      "click" -> {
                          val beforePkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          val clicked = performSmartClick(targetId, target, x, y)
                          delay(1500)
                          val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          if (beforePkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                              failedTargets.add("#$targetId($x,$y)")
                              performGlobalAction(GLOBAL_ACTION_BACK); delay(1000)
                              false
                          } else clicked
                      }
                      "click_best_video" -> {
                          delay(1200)
                          val kw = step.optString("match_keywords", target)
                          val p1 = findNonAdVideoResult(kw)
                          if (p1 != null) { performTap(p1.first.toFloat(), p1.second.toFloat()); delay(1800); true }
                          else {
                              performSwipe("up", 300); delay(1200)
                              val p2 = findNonAdVideoResult(kw)
                              if (p2 != null) { performTap(p2.first.toFloat(), p2.second.toFloat()); delay(1800); true } else false
                          }
                      }
                      "type" -> { val ok = performSmartType(targetId, target, x, y, text, step.optBoolean("press_enter", true)); delay(1600); ok }
                      "system_control" -> { executeSystemControl(step.optString("command", target)); delay(1000); true }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK); delay(1000); true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME); delay(1000); true }
                      "wait" -> { delay(step.optInt("seconds", 2).coerceIn(1, 12) * 1000L); true }
                      else -> false
                  }
              }

              private suspend fun thinkLikeGeniusHuman(
                  goal: String, userCorrection: String, researchedInfo: String, vaultSummary: String,
                  deviceContext: String, installedApps: String, screen: String, screenshotB64: String?, stuckCount: Int
              ): JSONObject = withContext(Dispatchers.IO) {
                  val dm = resources.displayMetrics
                  val corr = if (userCorrection.isNotBlank()) "🚨 URGENT LIVE USER INTERRUPTION: \"$userCorrection\" -> OBEY IMMEDIATELY!" else "None"
                  val prompt = """
                      You are AI Phone Commander 10.0 (Flawless Superhuman Android Brain).
                      SCREEN: ${dm.widthPixels}x${dm.heightPixels} | CONTEXT: $deviceContext
