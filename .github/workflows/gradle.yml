              private suspend fun callGeminiAPI(
                  prompt: String,
                  useGoogleSearch: Boolean,
                  base64Image: String?
              ): JSONObject = withContext(Dispatchers.IO) {
                  if (!isInternetAvailable()) {
                      return@withContext JSONObject().put("action", "ask_user").put("message", "इंटरनेट बंद है! कृपया डेटा या Wi-Fi चालू करें।")
                  }
                  val rawSaved = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE).getString("apiKey", "") ?: ""
                  val regexKeys = Regex("AIza[0-9A-Za-z_-]{30,45}").findAll(rawSaved).map { it.value }.distinct().toList()
                  val apiKeys = if (regexKeys.isNotEmpty()) regexKeys else rawSaved.replace("\\s".toRegex(), "").split(",").filter { it.length > 15 }

                  if (apiKeys.isEmpty()) {
                      return@withContext JSONObject().put("action", "ask_user").put("message", "⚠️ पहले ⚙️ दबाकर ऐप में अपनी Gemini API Key (AIza...) सेव करें!")
                  }

                  var sawInvalidKey = false
                  var lastError = "Timeout"

                  for (kIdx in apiKeys.indices) {
                      val activeKey = apiKeys[(currentApiKeyIndex + kIdx) % apiKeys.size]
                      var keyIsInvalid = false

                      for (mIdx in realFastFlashModels.indices) {
                          if (keyIsInvalid) break
                          val idx = (currentModelIndex + mIdx) % realFastFlashModels.size
                          val modelName = realFastFlashModels[idx]

                          val modes = if (useGoogleSearch && base64Image == null) listOf("SEARCH", "JSON") else listOf("JSON", "PLAIN")

                          for (mode in modes) {
                              val resObj = withTimeoutOrNull(16000L) {
                                  var conn: HttpURLConnection? = null
                                  try {
                                      conn = (URL("https://generativelanguage.googleapis.com/v1beta/models/$modelName:generateContent?key=$activeKey").openConnection() as HttpURLConnection).apply {
                                          requestMethod = "POST"
                                          setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                                          connectTimeout = 7000; readTimeout = 13000; doOutput = true
                                      }
                                      val partsArr = JSONArray().apply {
                                          put(JSONObject().put("text", prompt))
                                          if (!base64Image.isNullOrEmpty()) {
                                              put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", base64Image)))
                                          }
                                      }
                                      val body = JSONObject().apply {
                                          put("contents", JSONArray().put(JSONObject().put("parts", partsArr)))
                                          when (mode) {
                                              "SEARCH" -> put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                                              "JSON" -> put("generationConfig", JSONObject().put("responseMimeType", "application/json").put("temperature", 0.1))
                                              else -> put("generationConfig", JSONObject().put("temperature", 0.1))
                                          }
                                      }
                                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                                      val code = conn.responseCode
                                      if (code == 200) {
                                          currentModelIndex = idx
                                          currentApiKeyIndex = (currentApiKeyIndex + kIdx) % apiKeys.size
                                          val resStr = conn.inputStream.bufferedReader(Charsets.UTF_8).readText()
                                          val jsonRes = JSONObject(resStr)
                                          val candidates = jsonRes.optJSONArray("candidates")
                                          if (candidates != null && candidates.length() > 0) {
                                              val parts = candidates.getJSONObject(0).optJSONObject("content")?.optJSONArray("parts")
                                              var full = ""
                                              if (parts != null) {
                                                  for (p in 0 until parts.length()) full += parts.getJSONObject(p).optString("text", "")
                                              }
                                              if (full.isNotBlank()) extractValidJsonObject(full) else null
                                          } else null
                                      } else if (code == 400 && mode == "SEARCH") {
                                          null
                                      } else if (code == 429) {
                                          lastError = "Rate Limit (429)"
                                          null
                                      } else if (code == 404) {
                                          lastError = "$modelName (404)"
                                          null
                                      } else {
                                          val err = conn.errorStream?.bufferedReader()?.readText() ?: "HTTP $code"
                                          if (err.contains("API_KEY_INVALID", true) || err.contains("key not valid", true) || code == 403) {
                                              sawInvalidKey = true; keyIsInvalid = true; null
                                          } else {
                                              lastError = "$modelName ($code)"
                                              null
                                          }
                                      }
                                  } catch (e: Exception) {
                                      lastError = e.javaClass.simpleName
                                      null
                                  } finally {
                                      try { conn?.disconnect() } catch (_: Exception) {}
                                  }
                              }
                              if (resObj != null) return@withContext resObj
                              if (keyIsInvalid || lastError.contains("429") || lastError.contains("404")) break
                          }
                      }
                      delay(200)
                  }

                  if (sawInvalidKey) {
                      return@withContext JSONObject().put("action", "ask_user").put("message", "⚠️ आपकी Gemini API Key गलत है! कृपया ⚙️ दबाकर सही Key सेव करें।")
                  }
                  JSONObject().put("action", "ask_user").put("message", "⚠️ नेटवर्क या API लिमिट ($lastError) — 5 सेकंड रुककर 🔄 दबाएँ।")
              }

              private fun extractValidJsonObject(raw: String): JSONObject {
                  val t = raw.trim()
                  try {
                      if (t.startsWith("[")) return JSONObject().put("steps", JSONArray(t))
                      return JSONObject(t)
                  } catch (_: Exception) {}
                  var depth = 0; var start = -1; var inQ = false; var esc = false
                  for (i in t.indices) {
                      val c = t[i]
                      if (esc) { esc = false; continue }
                      if (c == '\\') { esc = true; continue }
                      if (c == '"') { inQ = !inQ; continue }
                      if (!inQ) {
                          if (c == '{') { if (depth == 0) start = i; depth++ }
                          else if (c == '}') {
                              depth--
                              if (depth == 0 && start != -1) {
                                  try { return JSONObject(t.substring(start, i + 1)) } catch (_: Exception) { start = -1 }
                              }
                          }
                      }
                  }
                  if (t.isNotEmpty()) {
                      return JSONObject().put("action", "chat_reply").put("message", t.take(240)).put("speak", t.take(180))
                  }
                  return JSONObject().put("action", "wait")
              }

              // AppAgent Set-of-Mark (SoM) Visual Tagger: Draws red bounding boxes & [#ID] badges directly onto the screenshot!
              private suspend fun captureScreenBase64WithSoM(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val now = System.currentTimeMillis()
                  if (now - lastScreenshotTime < 1500L) return null
                  lastScreenshotTime = now
                  val dm = resources.displayMetrics
                  val scaleX = 480f / dm.widthPixels.toFloat()
                  val scaleY = 960f / dm.heightPixels.toFloat()
                  val boundsSnapshot = HashMap(nodeBoundsMap)

                  val deferred = CompletableDeferred<String?>()
                  try {
                      setWindowGhostMode(true); delay(50)
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              try {
                                  val buffer: HardwareBuffer = screenshot.hardwareBuffer
                                  val bmp = Bitmap.wrapHardwareBuffer(buffer, screenshot.colorSpace)
                                  val soft = bmp?.copy(Bitmap.Config.ARGB_8888, true)
                                  buffer.close(); bmp?.recycle()
                                  if (soft != null) {
                                      val scaled = Bitmap.createScaledBitmap(soft, 480, 960, true)
                                      soft.recycle()
                                      val canvas = Canvas(scaled)
                                      val boxPaint = Paint().apply {
                                          color = Color.argb(200, 239, 68, 68)
                                          style = Paint.Style.STROKE
                                          strokeWidth = 2f
                                          isAntiAlias = true
                                      }
                                      val bgPaint = Paint().apply {
                                          color = Color.argb(220, 15, 23, 42)
                                          style = Paint.Style.FILL
                                      }
                                      val txtPaint = Paint().apply {
                                          color = Color.parseColor("#00F5D4")
                                          textSize = 15f
                                          typeface = Typeface.DEFAULT_BOLD
                                          isAntiAlias = true
                                      }
                                      for ((id, r) in boundsSnapshot) {
                                          val left = r.left * scaleX
                                          val top = r.top * scaleY
                                          val right = r.right * scaleX
                                          val bottom = r.bottom * scaleY
                                          canvas.drawRect(left, top, right, bottom, boxPaint)
                                          val tag = "#$id"
                                          val tw = txtPaint.measureText(tag)
                                          val bx = left.coerceIn(2f, 475f - tw)
                                          val by = (top - 3f).coerceIn(16f, 955f)
                                          canvas.drawRect(bx - 2f, by - 14f, bx + tw + 4f, by + 3f, bgPaint)
                                          canvas.drawText(tag, bx, by, txtPaint)
                                      }
                                      val out = ByteArrayOutputStream()
                                      scaled.compress(Bitmap.CompressFormat.JPEG, 58, out)
                                      scaled.recycle()
                                      deferred.complete(Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP))
                                  } else deferred.complete(null)
                              } catch (_: Exception) { deferred.complete(null) }
                          }
                          override fun onFailure(errorCode: Int) { deferred.complete(null) }
                      })
                  } catch (_: Exception) { setWindowGhostMode(false); return null }
                  val res = withTimeoutOrNull(3000L) { deferred.await() }
                  setWindowGhostMode(false)
                  return res
              }

              private fun collectSubtreeText(node: AccessibilityNodeInfo?, depth: Int = 0): String {
                  if (node == null || depth > 4) return ""
                  val sb = StringBuilder()
                  val t = (node.text ?: "").toString().trim()
                  val d = (node.contentDescription ?: "").toString().trim()
                  if (t.isNotEmpty()) sb.append(t).append(" ")
                  else if (d.isNotEmpty()) sb.append(d).append(" ")
                  for (i in 0 until node.childCount) {
                      val sub = collectSubtreeText(node.getChild(i), depth + 1)
                      if (sub.isNotEmpty()) sb.append(sub).append(" ")
                  }
                  return sb.toString().trim()
              }

              private fun isAdElement(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val adWords = listOf("sponsored", "विज्ञापन", "प्रायोजित", "ad ·", "ad •")
                  val all = "${collectSubtreeText(node, 2)} ${(node.viewIdResourceName ?: "").substringAfterLast("/")}".lowercase()
                  if (adWords.any { all.contains(it) } || all.contains("ad_badge") || all.contains("promoted_video")) return true
                  return false
              }

              private suspend fun waitForKeywordOnScreen(keywordsPipe: String, timeoutMs: Long): Pair<Int, Int>? {
                  val keys = keywordsPipe.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < timeoutMs && isRunning) {
                      for ((_, root) in getAllActiveWindowsSorted()) {
                          val found = searchKeywordInTree(root, keys)
                          if (found != null) return found
                      }
                      delay(220)
                  }
                  return null
              }

              private fun searchKeywordInTree(node: AccessibilityNodeInfo?, keys: List<String>): Pair<Int, Int>? {
                  if (node == null || !node.isVisibleToUser) return null
                  val r = Rect(); node.getBoundsInScreen(r)
                  val dm = resources.displayMetrics
                  if (r.width() > 10 && r.height() > 10 && r.centerY() in 60..(dm.heightPixels - 10)) {
                      val h = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (node.hintText ?: "").toString() else ""
                      val all = "${collectSubtreeText(node, 2)} $h ${(node.viewIdResourceName ?: "").substringAfterLast("/")}".lowercase()
                      if (keys.any { all.contains(it) }) return Pair(r.centerX(), r.centerY())
                  }
                  for (i in 0 until node.childCount) {
                      val sub = searchKeywordInTree(node.getChild(i), keys)
                      if (sub != null) return sub
                  }
                  return null
              }

              private fun fireDirectIntent(intentType: String, data: String): Boolean {
                  return try {
                      val intent = when (intentType.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply { setPackage("com.google.android.youtube"); putExtra("query", data) }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${Uri.encode(data)}"))
                          "open_url" -> Intent(Intent.ACTION_VIEW, Uri.parse(if (data.startsWith("http")) data else "https://$data"))
                          "dial" -> Intent(Intent.ACTION_DIAL, Uri.parse("tel:${data.filter { it.isDigit() || it == '+' }}"))
                          "call_contact" -> {
                              val num = lookupContactNumber(data) ?: data.filter { it.isDigit() || it == '+' }
                              if (num.isNotEmpty()) Intent(Intent.ACTION_DIAL, Uri.parse("tel:$num")) else null
                          }
                          "whatsapp_direct" -> {
                              val p = data.split("|", limit = 2)
                              val rawTarget = p[0].trim()
                              val resolvedPhone = if (rawTarget.any { it.isLetter() }) lookupContactNumber(rawTarget) ?: rawTarget else rawTarget
                              Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/${resolvedPhone.filter { it.isDigit() }}?text=${Uri.encode(if (p.size > 1) p[1] else "")}"))
                          }
                          "play_store_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=${Uri.encode(data)}")).apply {
                              setPackage("com.android.vending")
                          }
                          "maps_nav" -> Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=${Uri.encode(data)}"))
                          "set_alarm" -> {
                              val p = data.split("|")
                              val hm = p[0].split(":")
                              val hr = hm.getOrNull(0)?.trim()?.toIntOrNull() ?: 7
                              val mn = hm.getOrNull(1)?.trim()?.toIntOrNull() ?: 0
                              Intent(AlarmClock.ACTION_SET_ALARM).apply {
                                  putExtra(AlarmClock.EXTRA_HOUR, hr)
                                  putExtra(AlarmClock.EXTRA_MINUTES, mn)
                                  putExtra(AlarmClock.EXTRA_MESSAGE, p.getOrNull(1) ?: "AI Alarm")
                                  putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              }
                          }
                          "upi_pay" -> {
                              val p = data.split("|")
                              val pa = p.getOrNull(0) ?: ""
                              val pn = p.getOrNull(1) ?: "Payee"
                              val am = p.getOrNull(2) ?: ""
                              Intent(Intent.ACTION_VIEW, Uri.parse("upi://pay?pa=$pa&pn=${Uri.encode(pn)}&am=$am&cu=INR"))
                          }
                          "share_text" -> Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, data) }, "Share")
                          else -> null
                      }
                      if (intent != null) { intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(intent); true } else false
                  } catch (_: Exception) { false }
              }

              private fun isInternetAvailable(): Boolean {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      cm.getNetworkCapabilities(cm.activeNetwork ?: return false)?.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) == true
                  } catch (_: Exception) { true }
              }

              private suspend fun getCoordsForTarget(id: Int, targetKw: String, x: Int, y: Int): Pair<Int, Int> {
                  nodeMap[id]?.let { n ->
                      val r = Rect(); n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) return Pair(r.centerX(), r.centerY())
                  }
                  if (targetKw.isNotEmpty()) waitForKeywordOnScreen(targetKw, 1500L)?.let { return it }
                  val dm = resources.displayMetrics
                  return Pair(if (x > 0) x else dm.widthPixels / 2, if (y > 0) y else dm.heightPixels / 2)
              }

              // Universal Self-Healing Click: Triggers Native Click/Check on node, parent, OR child radio button AND Physical Gesture Tap!
              private suspend fun performSmartClick(id: Int, targetKw: String, x: Int, y: Int): Boolean {
                  nodeMap[id]?.let { n ->
                      var clickedNative = false
                      var cur: AccessibilityNodeInfo? = n
                      while (cur != null) {
                          if (cur.isClickable || cur.isCheckable) {
                              vibrateTick(15)
                              clickedNative = cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                              if (clickedNative) break
                          }
                          cur = cur.parent
                      }
                      if (!clickedNative) {
                          for (i in 0 until n.childCount) {
                              val ch = n.getChild(i)
                              if (ch != null && (ch.isCheckable || ch.isClickable)) {
                                  clickedNative = ch.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                  if (clickedNative) break
                              }
                          }
                      }
                      val r = Rect(); n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) {
                          delay(120)
                          performTap(r.centerX().toFloat(), r.centerY().toFloat())
                          return true
                      }
                      if (clickedNative) return true
                  }
                  if (targetKw.isNotEmpty()) {
                      waitForKeywordOnScreen(targetKw, 2000L)?.let { return performTap(it.first.toFloat(), it.second.toFloat()) }
                  }
                  return if (x > 0 && y > 0) performTap(x.toFloat(), y.toFloat()) else false
              }

              private suspend fun performSmartType(id: Int, targetKw: String, x: Int, y: Int, text: String, pressEnter: Boolean): Boolean {
                  var targetNode = nodeMap[id]?.takeIf { it.isEditable }
                  if (targetNode == null && (id > 0 || targetKw.isNotEmpty() || (x > 0 && y > 0))) {
                      val c = getCoordsForTarget(id, targetKw, x, y)
                      performTap(c.first.toFloat(), c.second.toFloat())
                      delay(550)
                  }
                  val root = rootInActiveWindow ?: return false
                  if (targetNode == null) targetNode = findBestEditableNode(root, targetKw, x, y)
                  if (targetNode != null) {
                      targetNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                      var typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                      if (!typed) {
                          val empty = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, "") }
                          targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, empty)
                          copyToClipboard(text)
                          typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                      }
                      if (pressEnter) {
                          delay(350)
                          var sent = false
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              sent = targetNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                          }
                          if (!sent && isKeyboardVisibleOnScreen()) {
                              val dm = resources.displayMetrics
                              performTap((dm.widthPixels - 85).toFloat(), (dm.heightPixels - 105).toFloat())
                          }
                      }
                      return typed
                  }
                  return false
              }

              private fun isKeyboardVisibleOnScreen(): Boolean {
                  return try { windows.any { it.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD } } catch (_: Exception) { false }
              }

              private fun findBestEditableNode(root: AccessibilityNodeInfo, targetKw: String, targetX: Int, targetY: Int): AccessibilityNodeInfo? {
                  val list = mutableListOf<AccessibilityNodeInfo>()
                  fun collect(n: AccessibilityNodeInfo?) {
                      if (n == null || !n.isVisibleToUser) return
                      if (n.isEditable && n.isEnabled) list.add(n)
                      for (i in 0 until n.childCount) collect(n.getChild(i))
                  }
                  collect(root)
                  if (list.isEmpty()) return null
                  list.firstOrNull { it.isFocused || it.isAccessibilityFocused }?.let { return it }
                  if (targetKw.isNotBlank()) {
                      val keys = targetKw.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                      list.firstOrNull { n ->
                          val h = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (n.hintText ?: "").toString() else ""
                          val all = "${n.text ?: ""} ${n.contentDescription ?: ""} $h ${(n.viewIdResourceName ?: "").substringAfterLast("/")}".lowercase()
                          keys.any { all.contains(it) }
                      }?.let { return it }
                  }
                  if (targetX > 0 && targetY > 0) {
                      return list.minByOrNull { n ->
                          val r = Rect(); n.getBoundsInScreen(r)
                          val dx = r.centerX() - targetX; val dy = r.centerY() - targetY
                          dx * dx + dy * dy
                      }
                  }
                  return list.first()
              }

              // Returns pairs of (isDialogPopup, rootNode) sorted so smaller popup dialogs come FIRST!
              private fun getAllActiveWindowsSorted(): List<Pair<Boolean, AccessibilityNodeInfo>> {
                  val dm = resources.displayMetrics
                  val fullScreenArea = dm.widthPixels * dm.heightPixels
                  val items = mutableListOf<Triple<Int, Boolean, AccessibilityNodeInfo>>()
                  try {
                      for (w in windows) {
                          if (w.type == AccessibilityWindowInfo.TYPE_APPLICATION || w.type == AccessibilityWindowInfo.TYPE_SYSTEM) {
                              val r = w.root
                              val pkg = r?.packageName?.toString() ?: ""
                              if (r != null && pkg != packageName && pkg != "com.android.systemui") {
                                  val rect = Rect()
                                  w.getBoundsInScreen(rect)
                                  val area = rect.width() * rect.height()
                                  val isDialog = area < (fullScreenArea * 0.78)
                                  items.add(Triple(area, isDialog, r))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  val sorted = items.sortedBy { it.first }.map { Pair(it.second, it.third) }.toMutableList()
                  if (sorted.isEmpty()) {
                      rootInActiveWindow?.let { sorted.add(Pair(false, it)) }
                  }
                  return sorted
              }

              // AutoDroid HTML/DOM Screen Serializer: Converts Android UI & Dialog Popups into clean HTML tags!
              private fun readScreenAsHtmlDom(): String {
                  nodeMap.clear()
                  nodeBoundsMap.clear()
                  val winList = getAllActiveWindowsSorted()
                  if (winList.isEmpty()) return "<screen empty=\"true\" />"

                  val dm = resources.displayMetrics
                  val lines = mutableListOf<String>()
                  val mainPkg = winList.last().second.packageName?.toString() ?: "unknown"
                  lines.add("<!-- App:$mainPkg | Windows:${winList.size} | KB:${if (isKeyboardVisibleOnScreen()) "OPEN" else "CLOSED"} -->")
                  var nextId = 1

                  fun traverse(node: AccessibilityNodeInfo?, parentCtx: String) {
                      if (node == null || !node.isVisibleToUser || nextId > 140) return
                      val rect = Rect(); node.getBoundsInScreen(rect)
                      val rawText = (node.text ?: "").toString().trim()
                      val desc = (node.contentDescription ?: "").toString().trim()
                      val hint = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (node.hintText ?: "").toString().trim() else ""
                      val idName = (node.viewIdResourceName ?: "").substringAfterLast("/")

                      val isClick = node.isClickable || (node.parent?.isClickable == true)
                      val isEdit = node.isEditable
                      val isCheck = node.isCheckable || (node.className?.toString()?.contains("RadioButton", true) == true)
                      val isScroll = node.isScrollable

                      var label = when {
                          rawText.isNotEmpty() -> rawText
                          desc.isNotEmpty() -> desc
                          hint.isNotEmpty() -> hint
                          isClick || isCheck -> collectSubtreeText(node, 2)
                          else -> ""
                      }

                      // Grab sibling label inside radio/checkbox row
                      if (label.isEmpty() && isCheck && node.parent != null) {
                          val p = node.parent
                          for (i in 0 until p.childCount) {
                              val sib = p.getChild(i)
                              val st = collectSubtreeText(sib, 1)
                              if (st.isNotEmpty()) { label = st; break }
                          }
                      }

                      val cx = rect.centerX(); val cy = rect.centerY()
                      if (cx in 2..(dm.widthPixels - 2) && cy in 70..(dm.heightPixels - 10) && rect.width() > 10 && rect.height() > 10) {
                          if (label.isNotEmpty() || isEdit || isCheck || (isClick && idName.isNotEmpty())) {
                              val tag = when {
                                  isAdElement(node) -> "ad_skip"
                                  isEdit -> "input"
                                  isCheck -> "radio"
                                  isClick -> "button"
                                  else -> "text"
                              }
                              val attrs = buildString {
                                  if (isCheck) append(" checked=\"${node.isChecked}\"")
                                  if (isEdit && hint.isNotEmpty()) append(" hint=\"${hint.replace("\"", "'").take(30)}\"")
                                  if (!node.isEnabled) append(" disabled=\"true\"")
                                  if (isScroll) append(" scrollable=\"true\"")
                                  if (idName.isNotEmpty()) append(" res=\"$idName\"")
                                  append(" xy=\"$cx,$cy\"")
                              }
                              val clean = label.replace("\n", " ").replace("<", "").replace(">", "").take(95)
                              val id = nextId++
                              nodeMap[id] = node
                              if (isClick || isEdit || isCheck) {
                                  nodeBoundsMap[id] = Rect(rect)
                              }
                              lines.add("  <$tag id=\"$id\"$attrs>$clean</$tag>")
                          }
                      }
                      val nextCtx = if (label.length in 4..38) label else parentCtx
                      for (i in 0 until node.childCount) traverse(node.getChild(i), nextCtx)
                  }

                  for ((idx, pair) in winList.withIndex()) {
                      val isDialog = pair.first
                      val rootNode = pair.second
                      val wTag = if (isDialog) "dialog_popup" else "main_screen"
                      lines.add("<$wTag index=\"${idx + 1}\">")
                      traverse(rootNode, "")
                      lines.add("</$wTag>")
                  }
                  return lines.joinToString("\n")
              }

              private fun pauseForUser(alertText: String) {
                  isRunning = false
                  setWindowGhostMode(false)
                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                  statusTv.text = alertText
                  planPreviewTv.text = alertText
                  autoCollapseBar(false)
              }

              private fun stopAgent(finalText: String) {
                  isRunning = false
                  agentJob?.cancel(); nodeMap.clear(); nodeBoundsMap.clear()
                  setWindowGhostMode(false)
                  statusTv.setTextColor(Color.parseColor("#00F5D4"))
                  statusTv.text = finalText
                  history.clear(); liveUserCorrection = ""
                  autoCollapseBar(false)
              }

              private suspend fun performTap(x: Float, y: Float): Boolean {
                  vibrateTick(15)
                  setWindowGhostMode(true)
                  delay(60)
                  val deferred = CompletableDeferred<Boolean>()
                  val stroke = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, 110)
                  val sent = dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { deferred.complete(true) }
                      override fun onCancelled(g: GestureDescription?) { deferred.complete(false) }
                  }, null)
                  if (!sent) deferred.complete(false)
                  val ok = withTimeoutOrNull(1000L) { deferred.await() } ?: false
                  delay(130)
                  setWindowGhostMode(false)
                  return ok
              }

              private suspend fun performDoubleTap(x: Float, y: Float) {
                  vibrateTick(20); setWindowGhostMode(true); delay(55)
                  val p1 = Path().apply { moveTo(x, y) }; val p2 = Path().apply { moveTo(x, y) }
                  val s1 = GestureDescription.StrokeDescription(p1, 0, 55)
                  val s2 = GestureDescription.StrokeDescription(p2, 125, 55)
                  dispatchGesture(GestureDescription.Builder().addStroke(s1).addStroke(s2).build(), null, null)
                  delay(240); setWindowGhostMode(false)
              }

              private suspend fun performLongPress(x: Float, y: Float) {
                  vibrateTick(35); setWindowGhostMode(true); delay(55)
                  val s = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, 820)
                  dispatchGesture(GestureDescription.Builder().addStroke(s).build(), null, null)
                  delay(900); setWindowGhostMode(false)
              }

              private suspend fun performSwipe(direction: String, durationMs: Long) {
                  setWindowGhostMode(true); delay(55)
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f
                  val topY = dm.heightPixels * 0.24f
                  val safeScrollUpStartY = dm.heightPixels * 0.38f
                  val botY = dm.heightPixels * 0.76f
                  val path = Path().apply {
                      when (direction.lowercase()) {
                          "down" -> { moveTo(cx, safeScrollUpStartY); lineTo(cx, botY) }
                          "left" -> { moveTo(dm.widthPixels * 0.86f, dm.heightPixels / 2f); lineTo(dm.widthPixels * 0.14f, dm.heightPixels / 2f) }
                          "right" -> { moveTo(dm.widthPixels * 0.14f, dm.heightPixels / 2f); lineTo(dm.widthPixels * 0.86f, dm.heightPixels / 2f) }
                          else -> { moveTo(cx, botY); lineTo(cx, topY) }
                      }
                  }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, durationMs)).build(), null, null)
                  delay(durationMs + 130); setWindowGhostMode(false)
              }

              private suspend fun performPinchZoom(zoomIn: Boolean) {
                  setWindowGhostMode(true); delay(55)
                  val dm = resources.displayMetrics; val cx = dm.widthPixels / 2f; val cy = dm.heightPixels / 2f
                  val p1 = Path(); val p2 = Path()
                  if (zoomIn) {
                      p1.moveTo(cx - 80f, cy - 80f); p1.lineTo(cx - 320f, cy - 320f)
                      p2.moveTo(cx + 80f, cy + 80f); p2.lineTo(cx + 320f, cy + 320f)
                  } else {
                      p1.moveTo(cx - 320f, cy - 320f); p1.lineTo(cx - 80f, cy - 80f)
                      p2.moveTo(cx + 320f, cy + 320f); p2.lineTo(cx + 80f, cy + 80f)
                  }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p1, 0, 350))
                      .addStroke(GestureDescription.StrokeDescription(p2, 0, 350)).build()
                  dispatchGesture(g, null, null)
                  delay(420); setWindowGhostMode(false)
              }

              private suspend fun performDragGesture(sx: Float, sy: Float, ex: Float, ey: Float) {
                  setWindowGhostMode(true); delay(55)
                  val p = Path().apply { moveTo(sx, sy); lineTo(ex, ey) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 650)).build(), null, null)
                  delay(720); setWindowGhostMode(false)
              }

              private fun executeSystemControl(cmd: String): Boolean {
                  return try {
                      val c = cmd.lowercase()
                      when {
                          c.contains("torch_on") || c.contains("flash_on") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, true) }; true
                          }
                          c.contains("torch_off") || c.contains("flash_off") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, false) }; true
                          }
                          c.contains("volume_up") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI); true }
                          c.contains("volume_down") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI); true }
                          c.contains("mute") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI); true }
                          c.contains("media_play_pause") -> {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                              am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)); true
                          }
                          c.contains("wifi_settings") -> { startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); true }
                          c.contains("bluetooth_settings") -> { startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); true }
                          c.contains("location_settings") -> { startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); true }
                          c.contains("notification") -> performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)
                          c.contains("quick_settings") -> performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)
                          c.contains("recents") -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                          c.contains("screenshot") -> if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT) else false
                          else -> false
                      }
                  } catch (_: Exception) { false }
              }

              private fun copyToClipboard(text: String) {
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIClip", text))
              }

              private fun getInstalledAppNames(): String {
                  return try {
                      val pm = packageManager
                      pm.getInstalledApplications(0).mapNotNull {
                          if (pm.getLaunchIntentForPackage(it.packageName) != null) pm.getApplicationLabel(it).toString() else null
                      }.distinct().take(50).joinToString(", ")
                  } catch (_: Exception) { "YouTube, WhatsApp, Chrome, Settings, Instagram, Phone" }
              }

              private fun openAppByName(appName: String): Boolean {
                  val pm = packageManager
                  val clean = appName.trim().lowercase()
                  if (clean.isEmpty()) return false
                  val known = mapOf(
                      "youtube" to "com.google.android.youtube",
                      "whatsapp" to "com.whatsapp",
                      "whatsapp business" to "com.whatsapp.w4b",
                      "chrome" to "com.android.chrome",
                      "settings" to "com.android.settings",
                      "play store" to "com.android.vending",
                      "instagram" to "com.instagram.android",
                      "flipkart" to "com.flipkart.android",
                      "amazon" to "in.amazon.mshop.android.shopping"
                  )
                  for ((k, pkg) in known) {
                      if (clean == k || clean.contains(k)) {
                          pm.getLaunchIntentForPackage(pkg)?.let {
                              it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(it); return true
                          }
                      }
                  }
                  val apps = pm.getInstalledApplications(0)
                  val exact = apps.firstOrNull { pm.getApplicationLabel(it).toString().trim().lowercase() == clean }
                  val match = exact ?: apps.firstOrNull {
                      val l = pm.getApplicationLabel(it).toString().trim().lowercase()
                      l.length > 2 && (l.contains(clean) || clean.contains(l))
                  }
                  if (match != null) {
                      pm.getLaunchIntentForPackage(match.packageName)?.let {
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(it); return true
                      }
                  }
                  return false
              }

              private fun vibrateTick(ms: Long) {
                  try { (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (_: Exception) {}
              }

              private fun vibratePhone() = vibrateTick(280)

              override fun onInterrupt() {}

              override fun onDestroy() {
                  if (instance == this) instance = null
                  agentJob?.cancel(); nodeMap.clear(); nodeBoundsMap.clear()
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Install Gradle 8.5 Directly and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
