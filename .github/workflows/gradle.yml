              private fun getRedmiPhoneStatus(speakHindi: Boolean = false): String {
                  return try {
                      val stat = StatFs(Environment.getDataDirectory().path)
                      val totalGb = (stat.totalBytes / (1024.0 * 1024.0 * 1024.0)).toInt()
                      val freeGb = String.format(Locale.US, "%.1f", stat.availableBytes / (1024.0 * 1024.0 * 1024.0))
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo() ; am.getMemoryInfo(mem)
                      val totalRam = String.format(Locale.US, "%.1f", mem.totalMem / (1024.0 * 1024.0 * 1024.0))
                      val freeRam = String.format(Locale.US, "%.1f", mem.availMem / (1024.0 * 1024.0 * 1024.0))
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val curVol = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
                      val maxVol = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      val dm = resources.displayMetrics
                      if (speakHindi) {
                          "Aapke Redmi Note 10S mein $bat percent battery hai, $totalGb GB mein se $freeGb GB storage khali hai, aur $totalRam GB mein se $freeRam GB RAM free hai."
                      } else {
                          "Device: Xiaomi Redmi Note 10S (${Build.MODEL}, ${dm.widthPixels}x${dm.heightPixels}) | Battery: $bat% | Storage: $freeGb/$totalGb GB free | RAM: $freeRam/$totalRam GB free | MediaVol: $curVol/$maxVol"
                      }
                  } catch (e: Exception) { "Xiaomi Redmi Note 10S" }
              }

              private fun extractOpenTarget(rawCmd: String): String {
                  var s = rawCmd.lowercase().trim()
                  val fillerWords = listOf(
                      "please", "bhai", "ai", "zara", "jara", "turant", "jaldi", "abhi",
                      "open karo", "open kar do", "open kariye", "open kar", "open",
                      "kholo", "khol do", "kholiye", "khol de", "khol",
                      "खोलो", "खोल दो", "खोलिए", "खोल",
                      "chalu karo", "chalu kar do", "चालू करो", "चालू कर दो",
                      "start karo", "start", "launch karo", "launch",
                      "चलाओ", "chalao", "app", "ऐप", "application", "ko", "को", "ka", "ki", "ke", "का", "की", "के"
                  )
                  for (w in fillerWords) {
                      s = Regex("\\b${Regex.escape(w)}\\b").replace(s, " ")
                      s = s.replace(w, " ")
                  }
                  return s.replace("\\s+".toRegex(), " ").trim()
              }

              private suspend fun waitForUiReady(previousPkg: String = "", maxWaitMs: Long = 550L) {
                  val start = System.currentTimeMillis()
                  delay(70)
                  while (System.currentTimeMillis() - start < maxWaitMs && isRunning) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          val curPkg = root.packageName?.toString() ?: ""
                          if (previousPkg.isNotEmpty() && curPkg.isNotEmpty() && curPkg != previousPkg) {
                              delay(90) ; return
                          }
                          if (previousPkg.isEmpty() && root.childCount > 0) return
                      }
                      delay(40)
                  }
              }

              private fun tryOfflineInstantReflex(goal: String): Boolean {
                  val g = goal.trim().lowercase()
                  val isMultiAppOrResearchTask = listOf(
                      " और ", " and ", " फिर ", " ke baad ", " phir ",
                      "ek ek karke", "एक एक करके", "sabhi", "सभी", "saare", "सारे",
                      "research", "रिसर्च", "reserch", "reasearch", "compare", "तुलना",
                      "best phone", "sabse best", "kaun sa", "कौन सा", "batao", "बताओ",
                      "under ", "mein sabse", "में सबसे"
                  ).any { g.contains(it) }
                  if (isMultiAppOrResearchTask) return false

                  if (g.contains("torch") || g.contains("toch") || g.contains("torc") || g.contains("टॉर्च") || g.contains("flash") || g.contains("फ्लैश") || g.contains("light")) {
                      if (g.contains("off") || g.contains("of") || g.contains("band") || g.contains("बंद") || g.contains("buja")) {
                          executeSystemControl("torch_off") ; speakOut("Torch band") ; stopAgent("🔦 Torch OFF!") ; return true
                      } else if (g.contains("on") || g.contains("jala") || g.contains("जला") || g.contains("chalu") || g.contains("चालू") || g.contains("khol") || g.contains("open")) {
                          executeSystemControl("torch_on") ; speakOut("Torch chalu") ; stopAgent("🔦 Torch ON!") ; return true
                      }
                  }

                  val isHardwareQuery = listOf(
                      "storage", "stronge", "storge", "storeg", "स्टोरेज",
                      "kitni ram", "ram kitn", "कितनी रैम", "रैम कित",
                      "battery", "betery", "batry", "बैटरी", "phone status", "kundali"
                  ).any { g.contains(it) }
                  if (isHardwareQuery && !g.contains("setting") && !g.contains("khol") && !g.contains("open")) {
                      val report = getRedmiPhoneStatus(true)
                      speakOut(report) ; stopAgent("📲 $report") ; return true
                  }

                  if (g.contains("scroll") || g.contains("स्क्रॉल") || g.contains("scrol") || g.contains("swipe") || g.contains("स्वाइप") || g == "niche karo" || g == "upar karo" || g == "नीचे करो" || g == "ऊपर करो") {
                      if (g.contains("lagataar") || g.contains("लगातार") || g.contains("loop") || g.contains("reels") || g.contains("shorts") || g.contains("रील्स")) {
                          agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                          agentJob = scope.launch {
                              for (i in 1..150) {
                                  if (!isRunning) break
                                  statusTv.text = "🔄 Lagataar Scroll (#$i) — rokne ke liye ✋ ya ⏹ dabayein"
                                  performSwipe("up") ; delay(3500L)
                              }
                              stopAgent("✅ Scroll poora hua!")
                          }
                          return true
                      }
                      val dir = when {
                          g.contains("up") || g.contains("upar") || g.contains("ऊपर") -> "down"
                          g.contains("left") || g.contains("baaye") || g.contains("बाएं") -> "left"
                          g.contains("right") || g.contains("daaye") || g.contains("दाएं") -> "right"
                          else -> "up"
                      }
                      scope.launch { performSwipe(dir) ; stopAgent("✅ Screen Scroll Kar Diya!") }
                      return true
                  }

                  when {
                      g == "back" || g == "go back" || g.contains("पीछे जाओ") || g.contains("बैक करो") -> { performGlobalAction(GLOBAL_ACTION_BACK) ; stopAgent("🔙 Back!") ; return true }
                      g == "home" || g == "go home" || g.contains("होम स्क्रीन") -> { performGlobalAction(GLOBAL_ACTION_HOME) ; stopAgent("🏠 Home!") ; return true }
                      g.contains("control center") || g.contains("कंट्रोल सेंटर") -> { executeSystemControl("miui_control_center") ; stopAgent("🎛️ MIUI Control Center!") ; return true }
                      g.contains("notification") && !g.contains("setting") -> { executeSystemControl("notification") ; stopAgent("🔔 Notifications!") ; return true }
                      g.contains("आवाज़ बढ़ा") || g.contains("volume up") || g.contains("aawaz badha") -> { executeSystemControl("volume_up") ; executeSystemControl("volume_up") ; stopAgent("🔊 Volume Up!") ; return true }
                      g.contains("आवाज़ कम") || g.contains("volume down") || g.contains("aawaz kam") -> { executeSystemControl("volume_down") ; executeSystemControl("volume_down") ; stopAgent("🔉 Volume Down!") ; return true }
                      g.contains("mute") || g.contains("silent karo") -> { executeSystemControl("mute") ; stopAgent("🔇 Muted!") ; return true }
                  }

                  val hasOpenWord = listOf("open", "khol", "खोल", "chalu", "चालू", "start", "launch", "chalao", "चलाओ", "setting", "सेटिंग", "website", "site").any { g.contains(it) }
                  val hasSearchOrPlayQuery = listOf("gaana", "गाना", "song", "video", "वीडियो", "search", "सर्च", "episode", "एपिसोड", "message", "मैसेज", "call", "कॉल", "likho", "लिखो", "pucho", "पूछो").any { g.contains(it) }

                  if (!hasSearchOrPlayQuery) {
                      val cleanTarget = extractOpenTarget(g)
                      val webDomains = mapOf(
                          "google" to "https://www.google.com", "youtube.com" to "https://m.youtube.com",
                          "facebook.com" to "https://m.facebook.com", "instagram.com" to "https://www.instagram.com",
                          "irctc" to "https://www.irctc.co.in", "sarkari result" to "https://www.sarkariresult.com",
                          "sarkariresult" to "https://www.sarkariresult.com", "flipkart.com" to "https://www.flipkart.com",
                          "amazon.in" to "https://www.amazon.in", "amazon.com" to "https://www.amazon.com",
                          "github" to "https://github.com", "wikipedia" to "https://www.wikipedia.org",
                          "cricbuzz" to "https://m.cricbuzz.com", "chatgpt.com" to "https://chatgpt.com",
                          "uidai" to "https://uidai.gov.in", "aadhar" to "https://myaadhaar.uidai.gov.in", "parivahan" to "https://parivahan.gov.in"
                      )
                      if (g.contains(".com") || g.contains(".in") || g.contains(".org") || g.contains(".net") || g.contains(".gov") || g.contains("website") || g.contains("वेबसाइट") || webDomains.keys.any { cleanTarget == it }) {
                          val rawUrl = webDomains[cleanTarget] ?: run {
                              val token = g.split(" ").firstOrNull { it.contains(".") } ?: "${cleanTarget.replace("website", "").replace("वेबसाइट", "").trim().replace(" ", "")}.com"
                              if (token.startsWith("http")) token else "https://$token"
                          }
                          if (fireDirectIntent("open_url", rawUrl)) {
                              speakOut("Website khol di hai") ; stopAgent("🌐 '$rawUrl' (<0.01s) khul gayi!") ; return true
                          }
                      }

                      if ((g.contains("setting") || g.contains("सेटिंग") || g.contains("seting") || g.contains("app info") || g.contains("permission")) && cleanTarget.isNotEmpty()) {
                          val appOnlyName = cleanTarget.replace("setting", "").replace("settings", "").replace("seting", "").replace("सेटिंग्स", "").replace("सेटिंग", "").replace("app info", "").replace("permission", "").trim()
                          if (appOnlyName.isNotEmpty() && !isPhoneSystemSettingWord(appOnlyName)) {
                              val pkg = findPackageInstant(appOnlyName)
                              if (pkg != null) {
                                  try {
                                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$pkg")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP))
                                      speakOut("$appOnlyName ki setting khol di hai") ; stopAgent("⚙️ '$appOnlyName' App Setting (<0.01s) khul gayi!") ; return true
                                  } catch (e: Exception) {}
                              }
                          }
                      }

                      if (g.contains("setting") || g.contains("seting") || g.contains("सेटिंग") || isPhoneSystemSettingWord(cleanTarget)) {
                          if (hasOpenWord || g.contains("setting") || g.contains("सेटिंग")) {
                              if (openRedmiSetting(g)) {
                                  speakOut("Setting khol di hai") ; stopAgent("⚙️ Setting (<0.01s) khul gayi!") ; return true
                              }
                          }
                      }

                      val candidateApp = if (cleanTarget.isNotEmpty()) cleanTarget else g
                      if (candidateApp.isNotEmpty() && (hasOpenWord || appCacheMap.containsKey(candidateApp))) {
                          if (openAppByName(candidateApp)) {
                              speakOut("$candidateApp khol diya hai") ; stopAgent("🚀 '$candidateApp' (<0.01s) khul gaya!") ; return true
                          }
                      }
                  }

                  if ((g.contains("youtube") || g.contains("यूट्यूब")) && !needsDeepWebResearch(g) && hasSearchOrPlayQuery) {
                      val query = g.replace("youtube", "").replace("यूट्यूब", "")
                          .replace("par", "").replace("per", "").replace("pe", "").replace("पर", "")
                          .replace("chalao", "").replace("chala do", "").replace("chala", "").replace("चलाओ", "")
                          .replace("open karo", "").replace("search karo", "").replace("search", "").replace("play", "").trim()
                      if (query.length >= 2) {
                          agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                          agentJob = scope.launch {
                              statusTv.text = "▶️ YouTube par '$query' chala raha hoon..."
                              speakOut("YouTube par $query chala raha hoon")
                              val prevPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                              fireDirectIntent("youtube_search", query)
                              waitForUiReady(prevPkg, 900L) ; delay(900)
                              val pos = findNonAdVideoResult(query) ?: run { performSwipe("up") ; delay(550) ; findNonAdVideoResult(query) }
                              if (pos != null) {
                                  performTap(pos.first.toFloat(), pos.second.toFloat()) ; delay(600)
                                  stopAgent("✅ '$query' (Non-Ad Video) Play Kar Diya!")
                              } else stopAgent("✅ YouTube par '$query' khol diya!")
                          }
                          return true
                      }
                  }
                  return false
              }

              private fun isPhoneSystemSettingWord(w: String): Boolean {
                  val sysWords = listOf(
                      "wifi", "wi-fi", "वाईफाई", "bluetooth", "blutooth", "ब्लूटूथ",
                      "hotspot", "hotpot", "tether", "हॉटस्पॉट", "storage", "स्टोरेज",
                      "battery", "बैटरी", "display", "brightness", "डिस्प्ले", "dark mode",
                      "sound", "volume", "vibration", "ringtone", "आवाज़", "location", "gps", "लोकेशन",
                      "security", "fingerprint", "lock", "password", "cast", "screen cast",
                      "date", "time", "language", "keyboard", "input", "developer", "accessibility",
                      "sim", "mobile network", "data roaming", "apn", "vpn", "nfc", "airplane", "flight mode",
                      "account", "sync", "privacy", "notification", "dnd", "do not disturb", "about phone", "about", "update"
                  )
                  return sysWords.any { w.contains(it) }
              }

              private fun findPackageInstant(appName: String): String? {
                  val clean = appName.trim().lowercase()
                  if (clean.isEmpty()) return null
                  if (appCacheMap.isEmpty()) refreshInstalledAppsCache()
                  synchronized(appCacheMap) {
                      appCacheMap[clean]?.let { return it }
                      for ((label, pkg) in appCacheMap) {
                          if (label == clean || label.contains(clean) || clean.contains(label)) return pkg
                      }
                  }
                  return null
              }

              private suspend fun tryLocalScreenClickOrType(goal: String): Boolean {
                  readScreenElementsWithSignature()
                  val g = goal.trim().lowercase()
                  val cleanWords = g.replace("par click karo", "").replace("click karo", "").replace("dabayein", "")
                      .replace("dabao", "").replace("kholo", "").replace("open karo", "").replace("खोलो", "").replace("दबाओ", "")
                      .split(" ", ",").map { it.trim() }.filter { it.length >= 2 }

                  for ((id, node) in nodeMap) {
                      val label = "${node.text ?: ""} ${node.contentDescription ?: ""}".lowercase()
                      if (label.isNotEmpty() && cleanWords.any { label.contains(it) }) {
                          val r = Rect() ; node.getBoundsInScreen(r)
                          performSmartClick(id, r.centerX(), r.centerY()) ; delay(400) ; return true
                      }
                  }
                  return false
              }

