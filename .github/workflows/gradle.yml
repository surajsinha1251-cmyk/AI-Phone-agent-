                              setColor(Color.parseColor(bgColor))
                              cornerRadius = 20f
                          }
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 8, 0, 8) }
                          layoutParams = lp
                          setOnClickListener { onClick() }
                      })
                  }

                  addLabel("👑 AI Phone Commander 20.0\n(AutoDroid DOM + AppAgent SoM + Mobile-Agent-v2 Reflector)", 18.5f, "#00F5D4")

                  val apiInput = makeInput("Gemini API Key (AIzaSy... comma se multiple jodein)", "apiKey")
                  addBtn("💾 Save & Verify Gemini API Key", "#16A34A") {
                      val raw = apiInput.text.toString()
                      val extracted = Regex("AIza[0-9A-Za-z_-]{30,45}").findAll(raw).map { it.value }.distinct().toList()
                      val finalKey = if (extracted.isNotEmpty()) extracted.joinToString(",") else raw.replace("\\s".toRegex(), "")
                      prefs.edit().putString("apiKey", finalKey).apply()
                      apiInput.setText(finalKey)
                      if (finalKey.startsWith("AIza")) {
                          Toast.makeText(this, "✅ API Key Saved!", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "⚠️ Key 'AIza' se shuru honi chahiye!", Toast.LENGTH_LONG).show()
                      }
                  }

                  addBtn("🎤 1. Enable Mic & Contacts Permission", "#1E40AF") {
                      val perms = mutableListOf<String>()
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.RECORD_AUDIO)
                      }
                      if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.READ_CONTACTS)
                      }
                      if (perms.isNotEmpty()) {
                          requestPermissions(perms.toTypedArray(), 101)
                      } else {
                          Toast.makeText(this, "Mic & Contacts Permission ON hai!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  addBtn("🪟 2. Enable Floating Window Permission", "#1E40AF") {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else Toast.makeText(this, "Floating ON hai!", Toast.LENGTH_SHORT).show()
                  }

                  addBtn("🔋 3. Disable Battery Restriction (MIUI Fix)", "#1E40AF") {
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                              startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                          } else Toast.makeText(this, "Battery Unrestricted ON hai!", Toast.LENGTH_SHORT).show()
                      } catch (_: Exception) {}
                  }

                  addBtn("🤖 4. Enable Accessibility Service (Main Haath)", "#7C3AED") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  addLabel("🔐 Personal Data Vault (For Forms & UPI):", 15f, "#4ADE80")
                  val vName = makeInput("Full Name", "vaultName")
                  val vPhone = makeInput("10-Digit Mobile Number", "vaultPhone")
                  val vEmail = makeInput("Email Address", "vaultContact")
                  val vUpi = makeInput("UPI ID (name@upi)", "vaultUpi")

                  addBtn("🔐 Save Personal Vault", "#0D9488") {
                      val cleanPhone = vPhone.text.toString().filter { it.isDigit() }.takeLast(10)
                      vPhone.setText(cleanPhone)
                      prefs.edit()
                          .putString("vaultName", vName.text.toString().trim())
                          .putString("vaultPhone", cleanPhone)
                          .putString("vaultContact", vEmail.text.toString().trim())
                          .putString("vaultUpi", vUpi.text.toString().replace("\\s".toRegex(), ""))
                          .apply()
                      Toast.makeText(this, "✅ Vault Saved!", Toast.LENGTH_SHORT).show()
                  }

                  val backupRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  backupRow.addView(Button(this).apply {
                      text = "📤 Copy Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          val obj = JSONObject().apply {
                              listOf("apiKey", "vaultName", "vaultPhone", "vaultContact", "vaultUpi").forEach {
                                  put(it, prefs.getString(it, ""))
                              }
                          }
                          val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cb.setPrimaryClip(ClipData.newPlainText("AIBackup", obj.toString()))
                          Toast.makeText(this@MainActivity, "Backup Copied!", Toast.LENGTH_LONG).show()
                      }
                  })
                  backupRow.addView(Button(this).apply {
                      text = "📥 Restore Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          try {
                              val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val txt = cb.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                              val obj = JSONObject(txt)
                              val ed = prefs.edit()
                              listOf("apiKey", "vaultName", "vaultPhone", "vaultContact", "vaultUpi").forEach {
                                  ed.putString(it, obj.optString(it, ""))
                              }
                              ed.apply()
                              recreate()
                              Toast.makeText(this@MainActivity, "Backup Restored!", Toast.LENGTH_SHORT).show()
                          } catch (_: Exception) {
                              Toast.makeText(this@MainActivity, "Pehle Backup JSON copy karein!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  })
                  layout.addView(backupRow)

                  scroll.addView(layout)
                  setContentView(scroll)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/VoiceActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.view.WindowManager
          import android.widget.Toast

          class VoiceActivity : Activity() {
              private var isInterruptMode = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL)
                  isInterruptMode = intent.getBooleanExtra("INTERRUPT_MODE", false)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 201)
                  } else launchVoice()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 201 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      launchVoice()
                  } else {
                      Toast.makeText(this, "Mic permission zaroori hai!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              private fun launchVoice() {
                  try {
                      val promptText = if (isInterruptMode) "✋ AI ruk gaya hai! Bataiye ab kya karna hai?" else "👑 Boliye, kya baat ya kaam karna hai?"
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf("en-IN", "hi-IN"))
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2200L)
                          putExtra(RecognizerIntent.EXTRA_PROMPT, promptText)
                      }
                      startActivityForResult(intent, 200)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Google Voice app nahi mila!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              private fun cleanSpokenNoise(raw: String): String {
                  val noiseTailWords = listOf(" एलएलबी", " llb", " हम्म", " अरे")
                  var cleaned = raw.trim()
                  for (nw in noiseTailWords) {
                      if (cleaned.lowercase().endsWith(nw)) {
                          cleaned = cleaned.dropLast(nw.length).trim()
                      }
                  }
                  return cleaned
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val rawSpoken = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull() ?: ""
                      val spoken = cleanSpokenNoise(rawSpoken)
                      if (spoken.isNotEmpty()) {
                          AgentService.instance?.onVoiceCommandReceived(spoken, isInterruptMode)
                      }
                  }
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/AgentService.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.NotificationManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.HardwareBuffer
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.*
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.text.TextUtils
          import android.util.Base64
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.accessibility.AccessibilityWindowInfo
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AgentService : AccessibilityService() {

              companion object {
                  var instance: AgentService? = null
              }

              private lateinit var windowManager: WindowManager
              private var floatingLayout: LinearLayout? = null
              private lateinit var topRow: LinearLayout
              private lateinit var planPreviewTv: TextView
              private lateinit var inputRow: LinearLayout
              private lateinit var dragBtn: TextView
              private lateinit var statusTv: TextView
              private lateinit var cmdInput: EditText
              private lateinit var clearInputBtn: TextView
              private lateinit var retryBtn: TextView
              private lateinit var interruptBtn: TextView
              private lateinit var ttsToggleBtn: TextView
              private lateinit var vaultOpenBtn: TextView
              private lateinit var micBtn: TextView
              private lateinit var actionBtn: TextView
              private lateinit var stopBtn: TextView
              private lateinit var minBtn: TextView
              private lateinit var params: WindowManager.LayoutParams

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var agentJob: Job? = null
              private var isRunning = false
              private var isMinimized = false
              private var isVoiceEnabled = true
              private var currentGoal = ""
              private var liveUserCorrection = ""
              private var researchedContext = ""
              private var latestNotificationText = ""
              private var lastSpokenText = ""
              private var lastScreenshotTime = 0L
              private var lastVolDownTime = 0L

              private val history = mutableListOf<String>()
              private val failedTargets = mutableSetOf<String>()
              private val nodeMap = mutableMapOf<Int, AccessibilityNodeInfo>()
              private val nodeBoundsMap = mutableMapOf<Int, Rect>()
              private var tts: TextToSpeech? = null

              // 100% Real, High-Quota, Fast Working Free Gemini Flash Models
              private val realFastFlashModels = listOf(
                  "gemini-2.5-flash",
                  "gemini-2.5-flash-lite",
                  "gemini-2.0-flash",
                  "gemini-2.0-flash-lite",
                  "gemini-1.5-flash"
              )

              private var currentModelIndex = 0
              private var currentApiKeyIndex = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("hi", "IN"))
                          tts?.setSpeechRate(1.16f)
                          tts?.setPitch(1.0f)
                      }
                  }
                  createMovableFloatingBar()
              }

              private fun speakOut(text: String, forceSpeak: Boolean = false) {
                  val clean = text.trim()
                  if (!isVoiceEnabled || clean.isEmpty()) return
                  if (!forceSpeak && clean.equals(lastSpokenText, ignoreCase = true)) return
                  lastSpokenText = clean
                  try {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_ALL &&
                          nm.currentInterruptionFilter != NotificationManager.INTERRUPTION_FILTER_UNKNOWN) {
                          return
                      }
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      if (am.isMusicActive && !clean.contains("रोक") && !clean.contains("मदद")) return
                  } catch (_: Exception) {}
                  tts?.speak(clean, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN && isRunning) {
                      val now = System.currentTimeMillis()
                      if (now - lastVolDownTime < 600L) {
                          vibrateTick(120)
                          triggerImmediateInterruptAndListen(openVoice = true)
                          return true
                      }
                      lastVolDownTime = now
                  }
                  return super.onKeyEvent(event)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val view = floatingLayout ?: return
                  val dm = resources.displayMetrics
                  params.width = if (isMinimized) WindowManager.LayoutParams.WRAP_CONTENT else (dm.widthPixels * 0.96).toInt()
                  params.x = params.x.coerceIn(0, dm.widthPixels - 120)
                  params.y = params.y.coerceIn(20, dm.heightPixels - 160)
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: ""
                      val txt = event.text.joinToString(" ").trim()
                      if (txt.isNotEmpty() && pkg != packageName) {
                          latestNotificationText = "[$pkg] $txt"
                      }
                  }
              }

              fun onVoiceCommandReceived(spoken: String, wasInterrupted: Boolean) {
                  scope.launch {
                      tts?.stop()
                      agentJob?.cancel()
                      isRunning = false
                      cmdInput.setText(spoken)
                      if (wasInterrupted && currentGoal.isNotBlank()) {
                          liveUserCorrection = spoken
                          history.add("USER_CORRECTION: \"$spoken\"")
                          statusTv.setTextColor(Color.parseColor("#FBBF24"))
                          statusTv.text = "✋ सुधार: '$spoken'"
                          startOpenSourceCoreAgent(isResumeWithCorrection = true)
                      } else {
                          currentGoal = spoken
                          liveUserCorrection = ""
                          startOpenSourceCoreAgent(isResumeWithCorrection = false)
                      }
                  }
              }

              private fun triggerImmediateInterruptAndListen(openVoice: Boolean) {
                  tts?.stop()
                  agentJob?.cancel()
                  isRunning = false
                  setWindowGhostMode(false)
                  autoCollapseBar(false)
                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                  statusTv.text = "✋ AI रुक गया! बोलें या लिखें क्या सुधार करना है..."
                  planPreviewTv.text = "💡 आपने काम के बीच में टोका है (पुराना काम याद है)"
                  setTouchPassThrough(false)
                  if (openVoice) {
                      startActivity(Intent(this, VoiceActivity::class.java).apply {
                          putExtra("INTERRUPT_MODE", true)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                  } else cmdInput.requestFocus()
              }

              private fun makePillButton(label: String, bgColor: String): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(14, 7, 14, 7)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgColor))
                          cornerRadius = 16f
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(4, 0, 0, 0) }
                  }
              }

              private fun createMovableFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }

                  val dm = resources.displayMetrics
                  params = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.96).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (dm.widthPixels * 0.02).toInt()
