                         - {"action": "double_tap", "target": "like|video", "x": 540, "y": 900, "reason": "Double tapping"}
                         - {"action": "long_press", "target": "message", "x": 540, "y": 900, "reason": "Long pressing"}
                         - {"action": "type_and_enter", "target": "Search|Edit", "text": "query", "reason": "..."}
                         - {"action": "type", "target": "message|Edit", "text": "hello", "reason": "..."}
                         - {"action": "click_first_result", "reason": "Clicking first result"}
