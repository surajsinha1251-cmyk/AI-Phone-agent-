                  layout.addView(title)
                  layout.addView(apiInput)
                  layout.addView(saveBtn)
                  layout.addView(micPermBtn)
                  layout.addView(overlayBtn)
                  layout.addView(accBtn)
                  layout.addView(vaultHeader)
                  layout.addView(vaultName)
                  layout.addView(vaultContact)
                  layout.addView(vaultUpi)
                  layout.addView(vaultSkills)
                  layout.addView(vaultDocs)
                  layout.addView(saveVaultBtn)
