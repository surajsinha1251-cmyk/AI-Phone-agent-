              private fun fireDirectIntent(intentType: String, data: String): Boolean {
                  return try {
                      val intent = when (intentType.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply { setPackage("com.google.android.youtube") ; putExtra("query", data) }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${Uri.encode(data)}"))
                          "open_url" -> Intent(Intent.ACTION_VIEW, Uri.parse(if (data.startsWith("http")) data else "https://$data"))
                          "dial" -> Intent(Intent.ACTION_DIAL, Uri.parse("tel:${data.filter { it.isDigit() || it == '+' }}"))
                          "whatsapp_num" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/${data.filter { it.isDigit() }}"))
                          "play_store" -> Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=${Uri.encode(data)}"))
                          else -> null
                      }
                      if (intent != null) { intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP) ; startActivity(intent) ; true } else false
                  } catch (e: Exception) { false }
              }

              private fun isNetworkAvailable(): Boolean {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork ?: return false) ?: return false
                      caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } catch (e: Exception) { true }
              }

              private fun syncServerFlashModelsOnce(apiKey: String) {
                  if (hasSyncedServerModels && serverVerifiedModels.isNotEmpty()) return
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val cached = prefs.getString("verifiedModels", "") ?: ""
                  if (cached.isNotEmpty() && serverVerifiedModels.isEmpty()) {
                      serverVerifiedModels.addAll(cached.split(",").filter { it.isNotEmpty() })
                  }
                  hasSyncedServerModels = true
                  var conn: HttpURLConnection? = null
                  try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models?key=$apiKey")
                      conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET" ; conn.connectTimeout = 5000 ; conn.readTimeout = 5000
                      if (conn.responseCode == 200) {
                          val arr = JSONObject(conn.inputStream.bufferedReader().readText()).optJSONArray("models") ?: return
                          serverVerifiedModels.clear()
                          for (i in 0 until arr.length()) {
                              val m = arr.getJSONObject(i)
                              val rawName = m.optString("name", "").removePrefix("models/")
                              val methods = m.optJSONArray("supportedGenerationMethods")?.toString() ?: ""
                              val isBanned = rawName.contains("1.5-flash") || rawName.contains("2.0-flash") || rawName.contains("tts") || rawName.contains("image") || rawName.contains("embedding") || rawName.contains("aqa")
                              if (methods.contains("generateContent") && !isBanned && (rawName.contains("flash") || rawName.contains("live"))) {
                                  if (rawName.contains("2.5-flash") || rawName.contains("3-flash") || rawName.contains("3.1-flash")) serverVerifiedModels.add(0, rawName) else serverVerifiedModels.add(rawName)
                              }
                          }
                          if (serverVerifiedModels.isNotEmpty()) prefs.edit().putString("verifiedModels", serverVerifiedModels.joinToString(",")).apply()
                      }
                  } catch (e: Exception) {} finally { try { conn?.disconnect() } catch (e: Exception) {} }
              }

              private fun buildTaskRoutedModelList(taskCategory: String): List<String> {
                  val basePool = when (taskCategory) {
                      "LIVE_VOICE" -> liveVoiceModels
                      "DEEP_RESEARCH" -> deepResearchModels
                      else -> fastActionModels
                  }
                  val combined = mutableListOf<String>()
                  if (lastWorkingModel.isNotEmpty() && !invalidModelNames.contains(lastWorkingModel)) combined.add(lastWorkingModel)
                  for (m in serverVerifiedModels) if (!combined.contains(m) && !invalidModelNames.contains(m)) combined.add(m)
                  for (m in basePool) if (!combined.contains(m) && !invalidModelNames.contains(m)) combined.add(m)
                  if (combined.isEmpty()) { invalidModelNames.clear() ; combined.addAll(basePool) }
                  return combined
              }

              private suspend fun callGeminiAPI(
                  prompt: String, useGoogleSearch: Boolean, base64Image: String?, taskCategory: String = "FAST_ACTION"
              ): JSONObject = withContext(Dispatchers.IO) {
                  if (!isNetworkAvailable()) return@withContext JSONObject().put("action", "ask_user").put("message", "Internet band hai! Kripya Data ya Wi-Fi chalu karein.")
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val keyList = (prefs.getString("apiKey", "") ?: "").split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  if (keyList.isEmpty()) return@withContext JSONObject().put("action", "ask_user").put("message", "Pehle ⚙️ mein jakar nayi Gemini API Key save karein!")

                  syncServerFlashModelsOnce(keyList[0])
                  val routedModels = buildTaskRoutedModelList(taskCategory)
                  var hitRateLimit = false
                  var firstPrimaryError = ""

                  for (keyAttempt in keyList.indices) {
                      val activeKey = keyList[(currentApiKeyIndex + keyAttempt) % keyList.size]
                      var isThisKeyLeakedOrInvalid = false
                      for (modelName in routedModels) {
                          if (invalidModelNames.contains(modelName) || isThisKeyLeakedOrInvalid) continue
                          val modes = if (useGoogleSearch && base64Image == null) listOf("SEARCH", "JSON", "PLAIN") else listOf("JSON", "PLAIN")
                          for (mode in modes) {
                              var conn: HttpURLConnection? = null
                              try {
                                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$modelName:generateContent?key=$activeKey")
                                  conn = url.openConnection() as HttpURLConnection
                                  conn.requestMethod = "POST"
                                  conn.setRequestProperty("Content-Type", "application/json")
                                  conn.connectTimeout = 6500 ; conn.readTimeout = 11000 ; conn.doOutput = true

                                  val partsArray = JSONArray().apply {
                                      put(JSONObject().put("text", prompt))
                                      if (!base64Image.isNullOrEmpty()) put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", base64Image)))
                                  }
                                  val body = JSONObject().apply {
                                      put("contents", JSONArray().put(JSONObject().put("parts", partsArray)))
                                      when (mode) {
                                          "SEARCH" -> put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                                          "JSON" -> put("generationConfig", JSONObject().put("responseMimeType", "application/json").put("temperature", 0.1))
                                          "PLAIN" -> put("generationConfig", JSONObject().put("temperature", 0.1))
                                      }
                                  }

                                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                                  val code = conn.responseCode
                                  if (code == 200) {
                                      lastWorkingModel = modelName
                                      currentApiKeyIndex = (currentApiKeyIndex + keyAttempt) % keyList.size
                                      val resText = conn.inputStream.bufferedReader().readText()
                                      val parts = JSONObject(resText).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                                      var fullReply = ""
                                      for (p in 0 until parts.length()) fullReply += parts.getJSONObject(p).optString("text", "")
                                      saveBrainLog("OK [$modelName | $taskCategory]")
                                      return@withContext extractJsonObject(fullReply)
                                  } else {
                                      val errBody = conn.errorStream?.bufferedReader()?.readText() ?: "HTTP $code"
                                      if (errBody.contains("API_KEY_INVALID", true) || errBody.contains("key not valid", true)) {
                                          firstPrimaryError = "Aapki API Key galat hai! ⚙️ mein jakar sahi Key daalein."
                                          isThisKeyLeakedOrInvalid = true ; break
                                      }
                                      if (errBody.contains("leaked", true)) {
                                          firstPrimaryError = "Google ne aapki purani API Key ko 'Leaked' maan kar block kar diya hai! ⚙️ mein jakar 'Get New Free API Key' se nayi Key banakar daalein."
                                          isThisKeyLeakedOrInvalid = true ; break
                                      }
                                      if (code == 400) continue
                                      else if (code == 429) { hitRateLimit = true ; if (firstPrimaryError.isEmpty()) firstPrimaryError = "$modelName (Quota Limit 429)" ; break }
                                      else if (code == 404) { invalidModelNames.add(modelName) ; break }
                                      else { if (firstPrimaryError.isEmpty()) firstPrimaryError = "$modelName ($code)" ; break }
                                  }
                              } catch (e: Exception) {
                                  if (firstPrimaryError.isEmpty()) firstPrimaryError = e.message ?: "Network Timeout" ; break
                              } finally { try { conn?.disconnect() } catch (e: Exception) {} }
                          }
                      }
                  }
                  if (hitRateLimit) return@withContext JSONObject().put("action", "rate_limit")
                  val finalReason = if (firstPrimaryError.isNotEmpty()) firstPrimaryError else "Server Busy"
                  saveBrainLog("ERR: $finalReason")
                  return@withContext JSONObject().put("action", "ask_user").put("message", "⚠️ $finalReason")
              }

              private fun extractJsonObject(raw: String): JSONObject {
                  val clean = raw.replace("```json", "").replace("```", "").trim()
                  val objStart = clean.indexOf('{') ; val objEnd = clean.lastIndexOf('}')
                  if (objStart != -1 && objEnd != -1 && objEnd > objStart) {
                      try { return JSONObject(clean.substring(objStart, objEnd + 1)) } catch (e: Exception) {}
                  }
                  val arrStart = clean.indexOf('[') ; val arrEnd = clean.lastIndexOf(']')
                  if (arrStart != -1 && arrEnd != -1 && arrEnd > arrStart) {
                      try { return JSONObject().put("steps", JSONArray(clean.substring(arrStart, arrEnd + 1))) } catch (e: Exception) {}
                  }
                  return JSONObject().put("action", "wait")
              }

              private fun getCoordsForTarget(id: Int, x: Int, y: Int): Pair<Int, Int> {
                  nodeMap[id]?.let { n ->
                      val r = Rect() ; n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) return Pair(r.centerX(), r.centerY())
                  }
                  val dm = resources.displayMetrics
                  return Pair(if (x > 0) x else dm.widthPixels / 2, if (y > 0) y else dm.heightPixels / 2)
              }

              private suspend fun performSmartClick(id: Int, x: Int, y: Int) {
                  nodeMap[id]?.let { n ->
                      val r = Rect() ; n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) { performTap(r.centerX().toFloat(), r.centerY().toFloat()) ; return }
                      var curr: AccessibilityNodeInfo? = n
                      while (curr != null) {
                          if (curr.isClickable) { curr.performAction(AccessibilityNodeInfo.ACTION_CLICK) ; return }
                          curr = curr.parent
                      }
                  }
                  if (x > 0 && y > 0) performTap(x.toFloat(), y.toFloat())
              }

              private suspend fun performSmartType(id: Int, x: Int, y: Int, text: String, pressEnter: Boolean): Boolean {
                  val explicitNode = nodeMap[id]
                  if (id > 0 || (x > 0 && y > 0)) {
                      val c = getCoordsForTarget(id, x, y)
                      performTap(c.first.toFloat(), c.second.toFloat()) ; delay(240)
                  }
                  var targetNode: AccessibilityNodeInfo? = if (explicitNode != null && explicitNode.isEditable) explicitNode else null
                  val startWait = System.currentTimeMillis()
                  while (targetNode == null && System.currentTimeMillis() - startWait < 900L && isRunning) {
                      rootInActiveWindow?.let { targetNode = findEditableNode(it) }
                      if (targetNode == null) delay(60)
                  }
                  val node = targetNode ?: return false
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                  var typed = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                  if (!typed) { copyToClipboard(text) ; typed = node.performAction(AccessibilityNodeInfo.ACTION_PASTE) }
                  if (pressEnter) {
                      delay(160)
                      var sent = false
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          sent = node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                      if (!sent) {
                          waitForKeywordOnScreen("send|search|submit|ask|arrow|भेजें", 350L)?.let { performTap(it.first.toFloat(), it.second.toFloat()) }
                      }
                  }
                  return typed
              }

              private fun findEditableNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var focused: AccessibilityNodeInfo? = null ; var any: AccessibilityNodeInfo? = null
                  fun search(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      if (node.isEditable) {
                          if (node.isFocused || node.isAccessibilityFocused) { focused = node ; return }
                          if (any == null) any = node
                      }
                      for (i in 0 until node.childCount) { search(node.getChild(i)) ; if (focused != null) return }
                  }
                  search(root)
                  return focused ?: any
              }

              private fun readScreenElementsWithSignature(): Pair<String, String> {
                  nodeMap.clear()
                  val root = rootInActiveWindow ?: return Pair("Screen khali hai", "empty")
                  val dm = resources.displayMetrics
                  val list = mutableListOf<String>()
                  val sig = StringBuilder()
                  val pkg = root.packageName?.toString() ?: "unknown"
                  list.add("Current App Package: $pkg") ; sig.append(pkg)
                  var nextId = 1

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || nextId > 145) return
                      if (pkg == "com.google.android.youtube" && isAdElement(node)) return

                      val rect = Rect() ; node.getBoundsInScreen(rect)
                      val text = (node.text ?: node.contentDescription ?: "").toString().trim()
                      val hint = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (node.hintText ?: "").toString().trim() else ""
                      val idName = (node.viewIdResourceName ?: "").substringAfterLast("/")
                      val isClick = node.isClickable || (node.parent?.isClickable == true)
                      val isEdit = node.isEditable ; val isPass = node.isPassword ; val isCheck = node.isCheckable

                      if (text.isNotEmpty() || hint.isNotEmpty() || isEdit || isPass || isCheck || (isClick && idName.isNotEmpty())) {
                          val cx = rect.centerX() ; val cy = rect.centerY()
                          if (cx in 5..(dm.widthPixels - 5) && cy in 75..(dm.heightPixels - 15) && rect.width() > 10 && rect.height() > 10) {
                              if (!isAdElement(node)) {
                                  val tag = when {
                                      isPass -> "[PASSWORD_BOX]"
                                      isEdit -> "[INPUT_BOX]"
                                      isCheck -> if (node.isChecked) "[SWITCH_ON]" else "[SWITCH_OFF]"
                                      isClick -> "[BUTTON]"
                                      else -> "[TEXT]"
                                  }
                                  val rawLabel = if (text.isNotEmpty()) text else hint
                                  val cleanText = rawLabel.replace("\n", " ").replace("\"", "'").take(110)
                                  val idHint = if (idName.isNotEmpty()) " ($idName)" else ""
                                  val id = nextId++
                                  nodeMap[id] = node
                                  list.add("#$id$tag '$cleanText'$idHint at (x=$cx, y=$cy)")
                                  sig.append("|").append(tag).append(idName).append(cx / 40).append(cy / 40)
                              }
                          }
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }
                  traverse(root)
                  return Pair(list.joinToString("\n"), sig.toString())
              }

              private fun pauseForUser(alertText: String) {
                  isRunning = false ; setWindowGhostMode(false)
                  statusTv.setTextColor(Color.parseColor("#FBBF24")) ; statusTv.text = alertText
                  autoCollapseBar(false)
              }

              private fun stopAgent(finalText: String) {
                  isRunning = false ; agentJob?.cancel() ; nodeMap.clear()
                  setWindowGhostMode(false)
                  statusTv.setTextColor(Color.parseColor("#4ADE80")) ; statusTv.text = finalText
                  planPreviewTv.text = "🎯 Agla kadam: Aapke naye aadesh ka intezaar hai..."
                  history.clear() ; recentActionSignatures.clear() ; liveUserCorrection = "" ; autoCollapseBar(false)
              }

              private suspend fun performTap(x: Float, y: Float) {
                  vibrateTick(12) ; setWindowGhostMode(true) ; delay(30)
                  val path = Path().apply { moveTo(x, y) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 55)).build(), null, null)
                  delay(65) ; setWindowGhostMode(false)
              }

              private suspend fun performDoubleTap(x: Float, y: Float) {
                  vibrateTick(18) ; setWindowGhostMode(true) ; delay(30)
                  val p1 = Path().apply { moveTo(x, y) } ; val p2 = Path().apply { moveTo(x, y) }
                  val s1 = GestureDescription.StrokeDescription(p1, 0, 45)
                  val s2 = GestureDescription.StrokeDescription(p2, 105, 45)
                  dispatchGesture(GestureDescription.Builder().addStroke(s1).addStroke(s2).build(), null, null)
                  delay(85) ; setWindowGhostMode(false)
              }

              private suspend fun performLongPress(x: Float, y: Float) {
                  vibrateTick(30) ; setWindowGhostMode(true) ; delay(30)
                  val path = Path().apply { moveTo(x, y) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 720)).build(), null, null)
                  delay(90) ; setWindowGhostMode(false)
              }

              private suspend fun performSwipe(direction: String) {
                  setWindowGhostMode(true) ; delay(30)
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f ; val topY = dm.heightPixels * 0.22f ; val botY = dm.heightPixels * 0.76f
                  val path = Path().apply {
                      when (direction.lowercase()) {
                          "down" -> { moveTo(cx, topY) ; lineTo(cx, botY) }
                          "left" -> { moveTo(dm.widthPixels * 0.86f, dm.heightPixels / 2f) ; lineTo(dm.widthPixels * 0.14f, dm.heightPixels / 2f) }
                          "right" -> { moveTo(dm.widthPixels * 0.14f, dm.heightPixels / 2f) ; lineTo(dm.widthPixels * 0.86f, dm.heightPixels / 2f) }
                          "miui_right_pull" -> { moveTo(dm.widthPixels * 0.85f, 15f) ; lineTo(dm.widthPixels * 0.85f, dm.heightPixels * 0.55f) }
                          "miui_left_pull" -> { moveTo(dm.widthPixels * 0.18f, 15f) ; lineTo(dm.widthPixels * 0.18f, dm.heightPixels * 0.55f) }
                          else -> { moveTo(cx, botY) ; lineTo(cx, topY) }
                      }
                  }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 210)).build(), null, null)
                  delay(80) ; setWindowGhostMode(false)
              }

              private fun executeSystemControl(cmd: String): Boolean {
                  return try {
                      val c = cmd.lowercase()
                      when {
                          c.contains("torch_on") || c.contains("flash_on") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, true) } ; true
                          }
                          c.contains("torch_off") || c.contains("flash_off") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, false) } ; true
                          }
                          c.contains("volume_up") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI) ; true }
                          c.contains("volume_down") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI) ; true }
                          c.contains("mute") -> { (getSystemService(Context.AUDIO_SERVICE) as AudioManager).adjustVolume(AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI) ; true }
                          c.contains("miui_control_center") || c.contains("quick_settings") -> {
                              val ok = performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)
                              if (!ok) scope.launch { performSwipe("miui_right_pull") }
                              true
                          }
                          c.contains("notification") -> {
                              val ok = performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)
                              if (!ok) scope.launch { performSwipe("miui_left_pull") }
                              true
                          }
                          else -> false
                      }
                  } catch (e: Exception) { false }
              }

              private fun copyToClipboard(text: String) {
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIClip", text))
              }

              private fun getInstalledAppNames(): String {
                  if (cachedAppNamesSummary.isNotEmpty()) return cachedAppNamesSummary
                  refreshInstalledAppsCache()
                  return if (cachedAppNamesSummary.isNotEmpty()) cachedAppNamesSummary else "YouTube, WhatsApp, Chrome, Settings, Instagram, ChatGPT, Phone"
              }

              private fun openAppByName(appName: String): Boolean {
                  val pm = packageManager
                  val clean = extractOpenTarget(appName)
                  if (clean.isEmpty()) return false
                  if (clean == "setting" || clean == "settings" || clean == "सेटिंग" || clean == "सेटिंग्स") return openRedmiSetting("settings")

                  val pkg = findPackageInstant(clean)
                  if (pkg != null) {
                      pm.getLaunchIntentForPackage(pkg)?.let {
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          startActivity(it)
                          return true
                      }
                  }
                  return false
              }

              private fun vibrateTick(ms: Long) {
                  try { (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }

              override fun onInterrupt() {}
              override fun onDestroy() {
                  if (instance == this) instance = null
                  agentJob?.cancel()
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (e: Exception) {} }
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Install Gradle 8.5 Directly and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
