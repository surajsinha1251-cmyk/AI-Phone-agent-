name: Build AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Fix Folders and Missing Files
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml
          if [ -f "app/src/main/build.gradle" ]; then mv app/src/main/build.gradle app/build.gradle; fi
          if [ -f "appbuild.gradle" ]; then mv appbuild.gradle app/build.gradle; fi
          for f in $(find . -name "MainActivity.kt"); do
            if [ "$f" != "./app/src/main/java/com/ai/phoneagent/MainActivity.kt" ]; then
              mv "$f" app/src/main/java/com/ai/phoneagent/MainActivity.kt
            fi
          done
          for f in $(find . -name "AgentService.kt"); do
            if [ "$f" != "./app/src/main/java/com/ai/phoneagent/AgentService.kt" ]; then
              mv "$f" app/src/main/java/com/ai/phoneagent/AgentService.kt
            fi
          done
          for f in $(find . -name "accessibility_config.xml"); do
            if [ "$f" != "./app/src/main/res/xml/accessibility_config.xml" ]; then
              mv "$f" app/src/main/res/xml/accessibility_config.xml
            fi
          done
          for f in $(find . -name "AndroidManifest.xml"); do
            if [ "$f" != "./app/src/main/AndroidManifest.xml" ]; then
              mv "$f" app/src/main/AndroidManifest.xml
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
