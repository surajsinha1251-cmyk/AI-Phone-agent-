name: Build Yantra Twin AI APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create or Reuse Permanent Signing Keystore (No Uninstall Needed)
        run: |
          if [ ! -f yantra.keystore ]; then
            keytool -genkey -v -keystore yantra.keystore -alias yantra -keyalg RSA -keysize 2048 -validity 10000 -storepass yantra123 -keypass yantra123 -dname "CN=YantraAI, OU=DevLab, O=Yantra, L=Patna, S=Bihar, C=IN"
            git config user.name "Yantra-Auto-Updater"
            git config user.email "yantra-bot@users.noreply.github.com"
            git add yantra.keystore
            git commit -m "Lock permanent Yantra signing keystore for direct updates" || true
            git push || true
          fi

      - name: Generate Twin Yantra Android Project (Alpha & Beta v23.0)
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "YantraAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.yantra"
                  minSdk 26
                  targetSdk 34
                  versionCode 31
                  versionName "23.0-AUTONOMOUS-PRO"
              }
              signingConfigs {
                  yantraSign {
                      storeFile file("../yantra.keystore")
                      storePassword "yantra123"
                      keyAlias "yantra"
                      keyPassword "yantra123"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.yantraSign
                  }
                  release {
                      signingConfig signingConfigs.yantraSign
                      minifyEnabled false
                  }
              }
              flavorDimensions "tier"
              productFlavors {
                  alpha {
                      dimension "tier"
                      applicationId "com.ai.yantra.alpha"
                      resValue "string", "app_name", "Yantra Alpha (यंत्र A)"
                  }
                  beta {
                      dimension "tier"
                      applicationId "com.ai.yantra.beta"
                      resValue "string", "app_name", "Yantra Beta (यंत्र B)"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceActivity" android:exported="false" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service android:name=".AgentService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="15" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.ActivityManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.PowerManager
          import android.os.StatFs
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class MainActivity : AppCompatActivity() {
              private val uiScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private val backupKeys = listOf("apiKey", "githubToken", "vaultName", "vaultContact", "vaultUpi", "vaultSkills", "userMemory", "activeMission", "learnedPaths", "dynamicRules", "verifiedModels")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)

                  // AUTO-RECEIVE DATA TRANSFER & HANDOVER FROM TWIN APP (Alpha <-> Beta)
                  val incomingJson = intent?.getStringExtra("EXTRA_TWIN_SYNC_JSON")
                  if (!incomingJson.isNullOrEmpty()) {
                      try {
                          val obj = JSONObject(incomingJson)
                          val ed = prefs.edit()
                          backupKeys.forEach { k ->
                              val v = obj.optString(k, "")
                              if (v.isNotEmpty()) ed.putString(k, v)
                          }
                          ed.apply()
                          Toast.makeText(this, "✅ Twin App se saara Data Auto-Transfer ho gaya!", Toast.LENGTH_LONG).show()
                          AgentService.instance?.activateAfterTwinHandover()
                          if (intent?.getBooleanExtra("EXTRA_AUTO_RUN_TEST", false) == true) {
                              uiScope.launch {
                                  delay(700)
                                  AgentService.instance?.runSelfDiagnosticAndImprove(openGeminiChat = false)
                              }
                          }
                      } catch (e: Exception) {}
                  }

                  val isAlpha = packageName.contains("alpha")
                  val twinPkg = if (isAlpha) "com.ai.yantra.beta" else "com.ai.yantra.alpha"
                  val myTitle = if (isAlpha) "🔱 YANTRA ALPHA (Master Dev A)" else "🔱 YANTRA BETA (Twin Tester B)"

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0F172A")) }
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL ; setPadding(42, 50, 42, 50) }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#38BDF8") {
                      layout.addView(TextView(this@MainActivity).apply { text = txt ; textSize = size ; setTextColor(Color.parseColor(color)) ; setPadding(0, 16, 0, 8) })
                  }
                  fun makeInput(hintTxt: String, key: String, isSecret: Boolean = false): EditText {
                      val et = EditText(this@MainActivity).apply {
                          hint = hintTxt ; setHintTextColor(Color.GRAY) ; setTextColor(Color.WHITE)
                          setText(prefs.getString(key, ""))
                          if (isSecret) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      }
                      layout.addView(et)
                      return et
                  }
                  fun addBtn(txt: String, onClick: () -> Unit) {
                      layout.addView(Button(this@MainActivity).apply { text = txt ; setOnClickListener { onClick() } })
                  }

                  addLabel("$myTitle — v23.0 AUTONOMOUS\n(Zero-Touch Gemini Code Copy + Direct GitHub API Commit)", 18.5f, "#38BDF8")
                  val apiInput = makeInput("Yahan Gemini API Key daalein (AIzaSy...)", "apiKey", isSecret = true)
                  val ghTokenInput = makeInput("Optional: GitHub Token (ghp_...) براہِ راست Auto-Commit ke liye", "githubToken", isSecret = true)
                  val keyStatusTv = TextView(this).apply {
                      text = "⚡ v23.0 Upgrade: Auto-Waits for Gemini Reply ➔ Auto-Clicks Copy Code ➔ Auto-Commits to GitHub!"
                      setTextColor(Color.parseColor("#4ADE80")) ; textSize = 12f ; setPadding(0, 4, 0, 8)
                  }
                  layout.addView(keyStatusTv)

                  addBtn("🔑 Get New Free API Key (Google AI Studio)") {
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://aistudio.google.com/app/apikey")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (e: Exception) {}
                  }

                  addBtn("💾 Save Keys & Live Test Speed") {
                      val raw = apiInput.text.toString()
                      val extracted = Regex("AIza[0-9A-Za-z_-]{30,45}").findAll(raw).map { it.value }.distinct().toList()
                      val finalKey = if (extracted.isNotEmpty()) extracted.joinToString(",") else raw.replace("\\s".toRegex(), "")
                      val ghTok = ghTokenInput.text.toString().trim()
                      prefs.edit().putString("apiKey", finalKey).putString("githubToken", ghTok).apply()
                      apiInput.setText(finalKey)
                      if (!finalKey.startsWith("AIza")) {
                          keyStatusTv.setTextColor(Color.parseColor("#F87171"))
                          keyStatusTv.text = "⚠️ Dhyan dein: Key 'AIza' se shuru honi chahiye!"
                          return@addBtn
                      }
                      keyStatusTv.setTextColor(Color.parseColor("#38BDF8"))
                      keyStatusTv.text = "⏳ Google Server se aapki API Key check ho rahi hai..."
                      val allKeys = finalKey.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                      uiScope.launch {
                          val (okColor, resultMsg) = testAllKeysAndDiscoverModels(allKeys, prefs)
                          keyStatusTv.setTextColor(Color.parseColor(okColor))
                          keyStatusTv.text = resultMsg
                      }
                  }

                  addLabel("🧬 Zero-Touch Self-Evolution & Twin Bridge:", 15f, "#A855F7")

                  addBtn("🧬 1. Full Auto-Evolve (Test ➔ Ask Gemini ➔ Auto-Copy ➔ GitHub)") {
                      if (AgentService.instance == null) {
                          Toast.makeText(this@MainActivity, "Pehle Accessibility Service (Yantra AI) ON karein!", Toast.LENGTH_LONG).show()
                      } else {
                          AgentService.instance?.runSelfDiagnosticAndImprove(openGeminiChat = true)
                      }
                  }

                  addBtn("🚀 2. Commit Copied Code to GitHub Now (API / Browser)") {
                      if (AgentService.instance == null) {
                          Toast.makeText(this@MainActivity, "Pehle Accessibility Service ON karein!", Toast.LENGTH_LONG).show()
                      } else {
                          AgentService.instance?.pasteCodeToGitHubAndOpenActions()
                      }
                  }

                  addBtn("🔄 3. Auto-Transfer Data to Twin App & Handover ($twinPkg)") {
                      val obj = JSONObject().apply { backupKeys.forEach { k -> put(k, prefs.getString(k, "")) } }
                      (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIBackup", obj.toString()))
                      val launchTwin = packageManager.getLaunchIntentForPackage(twinPkg)
                      if (launchTwin != null) {
                          AgentService.instance?.sleepForTwinHandover()
                          launchTwin.putExtra("EXTRA_TWIN_SYNC_JSON", obj.toString())
                          launchTwin.putExtra("EXTRA_AUTO_RUN_TEST", true)
                          launchTwin.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          startActivity(launchTwin)
                      } else {
                          Toast.makeText(this@MainActivity, "Backup Copy ho gaya! Twin App ($twinPkg) GitHub Actions se download karein.", Toast.LENGTH_LONG).show()
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://github.com/surajsinha1251-cmyk/AI-Phone-agent-/actions")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          } catch (e: Exception) {}
                      }
                  }

                  addLabel("🛡️ Permissions Setup:", 15f, "#38BDF8")
                  addBtn("🎤 Enable Voice Mic Permission ('Hey Yantra' ke liye)") {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101) else Toast.makeText(this@MainActivity, "Mic ON hai!", Toast.LENGTH_SHORT).show()
                  }
                  addBtn("🪟 Enable Floating Window Permission") {
                      if (!Settings.canDrawOverlays(this@MainActivity)) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) else Toast.makeText(this@MainActivity, "Floating ON hai!", Toast.LENGTH_SHORT).show()
                  }
                  addBtn("🔋 Disable MIUI Battery Restriction") {
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))) else Toast.makeText(this@MainActivity, "Battery Unrestricted ON hai!", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {}
                  }
                  addBtn("🤖 Enable Accessibility Service (Yantra AI)") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }

                  addLabel("📲 Live Redmi Note 10S Hardware Scanner:", 15f, "#FBBF24")
                  layout.addView(TextView(this@MainActivity).apply { text = getLiveHardwareInfo() ; setTextColor(Color.WHITE) ; textSize = 12.5f })

                  addLabel("🔐 Personal Data Vault (Auto Form & UPI Fill):", 15f, "#4ADE80")
                  val vName = makeInput("Full Name (Aapka Naam)", "vaultName")
                  val vContact = makeInput("Phone & Email", "vaultContact")
                  val vUpi = makeInput("UPI ID (name@upi)", "vaultUpi")
                  val vSkills = makeInput("Skills / Work", "vaultSkills")
                  val vDocs = makeInput("Address / Docs / Extra Rules", "userMemory")

                  addBtn("🔐 Save Personal Vault") {
                      prefs.edit().putString("vaultName", vName.text.toString().trim()).putString("vaultContact", vContact.text.toString().trim()).putString("vaultUpi", vUpi.text.toString().trim()).putString("vaultSkills", vSkills.text.toString().trim()).putString("userMemory", vDocs.text.toString().trim()).apply()
                      Toast.makeText(this@MainActivity, "Vault Saved!", Toast.LENGTH_SHORT).show()
                  }

                  val backupRow = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL }
                  backupRow.addView(Button(this@MainActivity).apply {
                      text = "📤 Copy Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          val obj = JSONObject().apply { backupKeys.forEach { k -> put(k, prefs.getString(k, "")) } }
                          (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIBackup", obj.toString()))
                          Toast.makeText(this@MainActivity, "Backup Copied!", Toast.LENGTH_LONG).show()
                      }
                  })
                  backupRow.addView(Button(this@MainActivity).apply {
                      text = "📥 Restore Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          try {
                              val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val obj = JSONObject(cb.primaryClip?.getItemAt(0)?.text?.toString() ?: "")
                              val ed = prefs.edit()
                              backupKeys.forEach { k -> ed.putString(k, obj.optString(k, "")) }
                              ed.apply() ; recreate()
                              Toast.makeText(this@MainActivity, "Backup Restored!", Toast.LENGTH_SHORT).show()
                          } catch (e: Exception) { Toast.makeText(this@MainActivity, "Pehle Backup JSON copy karein!", Toast.LENGTH_SHORT).show() }
                      }
                  })
                  layout.addView(backupRow)

                  addLabel("⚡ Self-Diagnostic Report & Brain Logs:", 14f, "#FBBF24")
                  layout.addView(TextView(this@MainActivity).apply {
                      val diag = prefs.getString("lastDiagnosticReport", "No self-test run yet.")
                      val dr = prefs.getString("dynamicRules", "Auto-optimizing...")
                      val l = prefs.getString("brainLogs", "No logs yet.")
                      text = "🧪 Last Self-Test: $diag\n🧠 Learned Self-Healing Rules: $dr\n📜 Recent Brain Logs:\n$l"
                      setTextColor(Color.LTGRAY) ; textSize = 11.5f
                  })

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              private suspend fun testAllKeysAndDiscoverModels(keys: List<String>, prefs: android.content.SharedPreferences): Pair<String, String> = withContext(Dispatchers.IO) {
                  val workingKeys = mutableListOf<String>()
                  val discoveredModels = mutableListOf<String>()
                  var lastErr = ""
                  for (k in keys) {
                      var conn: HttpURLConnection? = null
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=$k")
                          conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.connectTimeout = 5000 ; conn.readTimeout = 5000 ; conn.doOutput = true
                          conn.outputStream.use { it.write("""{"contents":[{"parts":[{"text":"hi"}]}]}""".toByteArray()) }
                          val code = conn.responseCode
                          if (code == 200) workingKeys.add(k) else {
                              val err = conn.errorStream?.bufferedReader()?.readText() ?: "HTTP $code"
                              lastErr = if (err.contains("leaked", true)) "Google ne aapki purani API Key ko 'Leaked' maan kar block kar diya hai! Upar '🔑 Get New Free API Key' button dabakar nayi key banayein." else "Key Error ($code): Nayi API Key banayein."
                          }
                      } catch (e: Exception) { lastErr = "Network Error: ${e.message}" } finally { try { conn?.disconnect() } catch (e: Exception) {} }
                  }
                  if (workingKeys.isNotEmpty()) {
                      prefs.edit().putString("apiKey", workingKeys.joinToString(",")).apply()
                      var listConn: HttpURLConnection? = null
                      try {
                          listConn = URL("https://generativelanguage.googleapis.com/v1beta/models?key=${workingKeys[0]}").openConnection() as HttpURLConnection
                          if (listConn.responseCode == 200) {
                              val arr = JSONObject(listConn.inputStream.bufferedReader().readText()).optJSONArray("models")
                              if (arr != null) {
                                  for (i in 0 until arr.length()) {
                                      val m = arr.getJSONObject(i)
                                      val name = m.optString("name", "").removePrefix("models/")
                                      val methods = m.optJSONArray("supportedGenerationMethods")?.toString() ?: ""
                                      val isBanned = name.contains("1.5-flash") || name.contains("2.0-flash") || name.contains("tts") || name.contains("image") || name.contains("embedding") || name.contains("aqa")
                                      if (methods.contains("generateContent") && !isBanned && (name.contains("flash") || name.contains("live"))) discoveredModels.add(name)
                                  }
                              }
                          }
                      } catch (e: Exception) {} finally { try { listConn?.disconnect() } catch (e: Exception) {} }
                      if (discoveredModels.isNotEmpty()) prefs.edit().putString("verifiedModels", discoveredModels.joinToString(",")).apply()
                      return@withContext Pair("#4ADE80", "✅ Sahi aur Working API Key Save Ho Gayi! (${workingKeys.size} Key Active)")
                  }
                  return@withContext Pair("#F87171", "❌ $lastErr")
              }

              private fun getLiveHardwareInfo(): String {
                  return try {
                      val stat = StatFs(Environment.getDataDirectory().path)
                      val totalGb = (stat.totalBytes / (1024.0 * 1024.0 * 1024.0)).toInt()
                      val freeGb = String.format(Locale.US, "%.1f", stat.availableBytes / (1024.0 * 1024.0 * 1024.0))
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val memInfo = ActivityManager.MemoryInfo() ; am.getMemoryInfo(memInfo)
                      val totalRam = String.format(Locale.US, "%.1f", memInfo.totalMem / (1024.0 * 1024.0 * 1024.0))
                      val freeRam = String.format(Locale.US, "%.1f", memInfo.availMem / (1024.0 * 1024.0 * 1024.0))
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      val dm = resources.displayMetrics
                      "• App ID: $packageName\n• Model: ${Build.MANUFACTURER} ${Build.MODEL} (Android ${Build.VERSION.RELEASE})\n• Storage: $freeGb GB Free / $totalGb GB Total\n• RAM: $freeRam GB Free / $totalRam GB Total\n• Battery: $bat% | Screen: ${dm.widthPixels}x${dm.heightPixels} px"
                  } catch (e: Exception) { "Hardware info ready" }
              }

              override fun onDestroy() { uiScope.cancel() ; super.onDestroy() }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/VoiceActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.view.WindowManager
          import android.widget.Toast

          class VoiceActivity : Activity() {
              private var isInterruptMode = false
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL)
                  isInterruptMode = intent.getBooleanExtra("INTERRUPT_MODE", false)
                  AgentService.instance?.pauseWakeWordForManualMic()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 201)
                  } else launchVoice()
              }
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 201 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) launchVoice() else finish()
              }
              private fun launchVoice() {
                  try {
                      val promptText = if (isInterruptMode) "✋ Yantra ruk gaya hai! Bataiye ab kya karna hai?" else "🔱 Yantra AI सुन रहा है: बोलिए क्या करना है?"
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf("en-IN", "hi-IN"))
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_PROMPT, promptText)
                      }
                      startActivityForResult(intent, 200)
                  } catch (e: Exception) { Toast.makeText(this, "Google Voice app nahi mila!", Toast.LENGTH_SHORT).show() ; finish() }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val spoken = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()?.trim() ?: ""
