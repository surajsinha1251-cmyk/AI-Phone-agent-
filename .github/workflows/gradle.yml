name: Build AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.caching=true
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "AIPhoneAgent"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.phoneagent"
                  minSdk 26
                  targetSdk 34
                  versionCode 21
                  versionName "20.0-OPENSOURCE-CORE"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="AI Commander 20.0"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VoiceActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".AgentService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestEnhancedWebAccessibility|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="40" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  prefs.edit().remove("learnedPaths").remove("deadModels").apply()

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0B1120")) }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 48)
                  }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#00F5D4") {
                      layout.addView(TextView(this).apply {
                          text = txt
                          textSize = size
                          setTextColor(Color.parseColor(color))
                          setPadding(0, 18, 0, 8)
                      })
                  }

                  fun makeInput(hintTxt: String, key: String): EditText {
                      return EditText(this).apply {
                          hint = hintTxt
                          setHintTextColor(Color.GRAY)
                          setTextColor(Color.WHITE)
                          setPadding(24, 18, 24, 18)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#1E293B"))
                              cornerRadius = 18f
                              setStroke(2, Color.parseColor("#334155"))
                          }
                          val lp = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
