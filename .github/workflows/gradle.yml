                      setText(prefs.getString("vaultSkills", ""))
                  }
                  val vaultDocs = EditText(this).apply {
                      hint = "अन्य जानकारी / डॉक्यूमेंट नंबर / पता / मेमोरी"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setText(prefs.getString("userMemory", ""))
                  }

                  val saveVaultBtn = Button(this).apply {
                      text = "🔐 Save Personal Vault & Details"
                      setOnClickListener {
                          prefs.edit()
                              .putString("vaultName", vaultName.text.toString().trim())
                              .putString("vaultContact", vaultContact.text.toString().trim())
                              .putString("vaultUpi", vaultUpi.text.toString().trim())
                              .putString("vaultSkills", vaultSkills.text.toString().trim())
                              .putString("userMemory", vaultDocs.text.toString().trim())
                              .apply()
                          Toast.makeText(this@MainActivity, "आपकी तिजोरी (Vault) सेव हो गई!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val missionHeader = TextView(this).apply {
                      text = "\n🎯 Active CEO Mission / Challenge Plan:"
                      textSize = 15f
                      setTextColor(Color.parseColor("#FBBF24"))
