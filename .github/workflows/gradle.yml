                  return try {
                      val s = settingName.trim().lowercase()
                      val action = when {
                          s.contains("wifi") || s.contains("wi-fi") || s.contains("वाईफाई") -> Settings.ACTION_WIFI_SETTINGS
                          s.contains("bluetooth") || s.contains("blutooth") || s.contains("ब्लूटूथ") -> Settings.ACTION_BLUETOOTH_SETTINGS
                          s.contains("hotspot") || s.contains("hotpot") || s.contains("tether") || s.contains("हॉटस्पॉट") -> "android.settings.TETHER_SETTINGS"
                          s.contains("storage") || s.contains("stronge") || s.contains("स्टोरेज") -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                          s.contains("battery") || s.contains("बैटरी") -> Intent.ACTION_POWER_USAGE_SUMMARY
                          s.contains("display") || s.contains("brightness") || s.contains("dark") || s.contains("डिस्प्ले") -> Settings.ACTION_DISPLAY_SETTINGS
                          s.contains("sound") || s.contains("volume") || s.contains("ringtone") || s.contains("vibration") || s.contains("आवाज़") -> Settings.ACTION_SOUND_SETTINGS
                          s.contains("app") || s.contains("ऐप") -> Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS
                          s.contains("about") || s.contains("device") || s.contains("update") || s.contains("अबाउट") -> Settings.ACTION_DEVICE_INFO_SETTINGS
                          s.contains("location") || s.contains("gps") || s.contains("लोकेशन") -> Settings.ACTION_LOCATION_SOURCE_SETTINGS
                          s.contains("security") || s.contains("fingerprint") || s.contains("lock") || s.contains("password") -> Settings.ACTION_SECURITY_SETTINGS
                          s.contains("cast") || s.contains("screen cast") -> Settings.ACTION_CAST_SETTINGS
                          s.contains("date") || s.contains("time") -> Settings.ACTION_DATE_SETTINGS
                          s.contains("language") || s.contains("keyboard") || s.contains("input") -> Settings.ACTION_INPUT_METHOD_SETTINGS
                          s.contains("developer") -> Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                          s.contains("accessibility") -> Settings.ACTION_ACCESSIBILITY_SETTINGS
                          s.contains("sim") || s.contains("roaming") || s.contains("mobile network") -> Settings.ACTION_DATA_ROAMING_SETTINGS
                          s.contains("apn") -> Settings.ACTION_APN_SETTINGS
                          s.contains("vpn") -> Settings.ACTION_VPN_SETTINGS
                          s.contains("nfc") -> Settings.ACTION_NFC_SETTINGS
                          s.contains("airplane") || s.contains("flight") -> Settings.ACTION_AIRPLANE_MODE_SETTINGS
                          s.contains("account") || s.contains("sync") -> Settings.ACTION_SYNC_SETTINGS
                          s.contains("privacy") -> Settings.ACTION_PRIVACY_SETTINGS
