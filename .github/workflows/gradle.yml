                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.connectTimeout = 6000 ; conn.readTimeout = 14000 ; conn.doOutput = true
                      val prompt = """
                          Generate ONLY valid Kotlin code for `YantraBrain.kt` starting with `package com.ai.phoneagent` and `object YantraBrain`.
                          Audit Report: $auditReport
                          User Request: "$customReq"
