                      val t = (node.text ?: node.contentDescription ?: "").toString()
                      if (t.contains("package com.ai.phoneagent") && t.contains("object YantraBrain")) {
                          YantraBrain.extractPureBrainKotlin(t)?.let {
                              foundCode = it
                              return
                          }
                      }
                      for (i in 0 until node.childCount) scan(node.getChild(i))
                  }
                  scan(root)
                  return foundCode
