                      hint = "यहाँ लिखें या 'Hey Yantra' बोलें..."
                      setHintTextColor(Color.LTGRAY) ; setTextColor(Color.WHITE) ; textSize = 12.5f ; setSingleLine(true)
                      setPadding(18, 9, 18, 9)
