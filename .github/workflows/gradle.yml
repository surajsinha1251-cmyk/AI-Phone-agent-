              private fun recordLearnedSuccess(goal: String) {
                  if (history.isEmpty()) return
                  val p = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val old = p.getString("learnedPaths", "") ?: ""
                  val summary = "${goal.take(22)}->${history.takeLast(2).joinToString(",")}"
                  if (!old.contains(goal.take(14), true)) {
                      p.edit().putString("learnedPaths", "$old | $summary".takeLast(450)).apply()
                  }
              }

              // Fix #81: Lookup Contact Number by Name from Phonebook
              private fun lookupContactNumber(nameQuery: String): String? {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  val clean = nameQuery.trim().lowercase()
                  if (clean.isEmpty()) return null
                  try {
                      contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null, null
                      )?.use { cursor ->
                          val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (cursor.moveToNext()) {
                              val dName = (cursor.getString(nameIdx) ?: "").lowercase()
                              val dNum = (cursor.getString(numIdx) ?: "").filter { it.isDigit() || it == '+' }
                              if (dName.contains(clean) || clean.contains(dName)) {
                                  if (dNum.length >= 10) return dNum
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return null
              }

              private suspend fun tryInstantOfflineReflex(cmd: String): Boolean {
                  val c = cmd.trim().lowercase()
                  return when {
                      c in listOf("kaisa hai", "kaise ho", "kya haal hai", "hello", "hi", "hey", "कैसा है", "कैसे हो", "हेलो", "नमस्ते") -> {
                          val reply = "मैं एकदम बढ़िया और सुपरफास्ट तैयार हूँ भाई! बताइए आज फोन में क्या काम करना है?"
                          speakOut(reply); planPreviewTv.text = "💬 $reply"; stopAgent("😊 $reply"); true
                      }
                      c in listOf("torch on", "flashlight on", "टॉर्च जलाओ", "टॉर्च ऑन") -> { executeSystemControl("torch_on"); stopAgent("⚡ टॉर्च चालू कर दी!"); true }
                      c in listOf("torch off", "flashlight off", "टॉर्च बंद", "टॉर्च बंद करो") -> { executeSystemControl("torch_off"); stopAgent("⚡ टॉर्च बंद कर दी!"); true }
                      c in listOf("back", "पीछे जाओ", "बैक") -> { performGlobalAction(GLOBAL_ACTION_BACK); stopAgent("⚡ पीछे आ गए!"); true }
                      c in listOf("home", "होम स्क्रीन") -> { performGlobalAction(GLOBAL_ACTION_HOME); stopAgent("⚡ होम स्क्रीन!"); true }
                      c in listOf("recent apps", "recents", "रीसेंट ऐप्स") -> { performGlobalAction(GLOBAL_ACTION_RECENTS); stopAgent("⚡ रीसेंट ऐप्स!"); true }
                      c in listOf("take screenshot", "स्क्रीनशॉट लो") -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT)
                          stopAgent("📸 स्क्रीनशॉट ले लिया!"); true
                      }
                      c in listOf("volume up", "आवाज़ बढ़ाओ") -> { executeSystemControl("volume_up"); stopAgent("⚡ आवाज़ बढ़ा दी!"); true }
                      c in listOf("volume down", "आवाज़ कम करो") -> { executeSystemControl("volume_down"); stopAgent("⚡ आवाज़ कम कर दी!"); true }
                      c in listOf("scroll down", "नीचे स्क्रॉल करो") -> { performSwipe("up", 300); stopAgent("⚡ नीचे स्क्रॉल कर दिया!"); true }
                      else -> false
                  }
              }

              private fun needsDeepWebResearch(cmd: String): Boolean {
                  val l = cmd.lowercase()
                  return listOf(
                      "episode", "एपिसोड", "latest", "naya", "नया", "last", "aakhiri",
                      "kamao", "कमाओ", "earning", "paisa", "पैसा", "challenge", "चैलेंज",
                      "price", "rate", "news", "khabar", "weather", "score", "match", "kaun", "kab"
                  ).any { l.contains(it) }
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  agentJob?.cancel()
                  isRunning = true
                  if (!isResumeWithCorrection) {
                      history.clear(); recentActionSignatures.clear(); failedTargets.clear(); researchedContext = ""
                      cachedClipboard = getClipboardText()
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      if (!isResumeWithCorrection && tryInstantOfflineReflex(currentGoal)) return@launch

                      // Fix #72, #149: Low Battery Alert check
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)

                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()
                      val stepQueue = mutableListOf<JSONObject>()

                      if (!isResumeWithCorrection && needsDeepWebResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#00F5D4"))
                          statusTv.text = "🔍 Google Web Search से सटीक जानकारी निकाल रहा हूँ..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val cacheKey = currentGoal.trim().lowercase()
                          val masterPlan = researchCache[cacheKey] ?: researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, currentPkg).also {
                              if (it.optString("action") != "ask_user") researchCache[cacheKey] = it
                          }
                          if (!isRunning) return@launch

                          if (masterPlan.optString("action") == "ask_user") {
                              val errMsg = masterPlan.optString("message", "API Error")
                              speakOut(errMsg); pauseForUser(errMsg); return@launch
                          }

                          researchedContext = masterPlan.optString("researched_info", "")
                          val savedMission = masterPlan.optString("save_mission_plan", "")
                          if (savedMission.isNotBlank()) {
                              getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE).edit().putString("activeMission", savedMission).apply()
                          }
                          val clipText = masterPlan.optString("copy_to_clipboard", "")
                          if (clipText.isNotBlank()) copyToClipboard(clipText)
                          val speakMsg = masterPlan.optString("speak", "")
                          if (speakMsg.isNotEmpty()) speakOut(speakMsg)

                          val initialSteps = masterPlan.optJSONArray("steps")
                          if (initialSteps != null) {
                              for (i in 0 until initialSteps.length()) stepQueue.add(initialSteps.getJSONObject(i))
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("ठीक है, आपकी बात मानकर रास्ता बदल रहा हूँ")
                      } else {
                          statusTv.setTextColor(Color.parseColor("#00F5D4"))
                          statusTv.text = "⚡ Fast-Track: सीधा एक्शन कर रहा हूँ..."
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastStructuralHash = ""

                      while (isRunning) {
                          var stepIdx = 0
                          while (stepQueue.isNotEmpty() && isRunning) {
                              if (stepIdx > 0) readScreenElements()
                              stepIdx++

                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")
                              if (act == "done" || act == "chat_reply") {
                                  val doneMsg = step.optString("message", step.optString("text", "काम पूरा हो गया!"))
                                  recordLearnedSuccess(currentGoal)
                                  speakOut(doneMsg); vibratePhone(); planPreviewTv.text = "💬 $doneMsg"; stopAgent("✅ $doneMsg")
                                  return@launch
                              }
                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "यहाँ आपकी मदद चाहिए")
                                  val note = step.optString("capability_note", "")
                                  val full = if (note.isNotEmpty()) "$askMsg ($note)" else askMsg
                                  speakOut(full); vibratePhone(); pauseForUser("🤝 $full")
                                  return@launch
                              }
                              if (!executeLocalStepWithVerification(step)) {
                                  stepQueue.clear()
                                  break
                              }
                          }

                          if (!isRunning) break
                          aiConsultCount++
                          if (aiConsultCount > 55) { stopAgent("✅ काम पूरा हो गया!"); break }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "🧠 Step #$aiConsultCount: अगला कदम सोच रहा हूँ..."
                          delay(320)

                          val screenSnapshot = readScreenElements()
                          val structuralSnapshot = screenSnapshot.replace(Regex("\\d+:\\d+"), "").replace(Regex("\\d+%"), "")
                          val currentHash = structuralSnapshot.hashCode().toString()
                          if (currentHash == lastStructuralHash) stuckCount++ else { stuckCount = 0; lastStructuralHash = currentHash }

                          if (recentActionSignatures.size >= 4) {
                              val s = recentActionSignatures.takeLast(4)
                              if (s[0] == s[2] && s[1] == s[3]) { stuckCount += 2; failedTargets.add(s[0]) }
                          }

                          // Fix #15, #72: Take vision screenshot if stuck >= 2 OR if game/canvas screen has < 4 elements (unless battery < 10%)
                          val needVision = (stuckCount >= 2 || screenSnapshot.lines().size < 4) && bat >= 10
                          val screenshotB64 = if (needVision) captureScreenBase64WithGrid() else null
                          val appsForPrompt = if (aiConsultCount <= 2 || screenSnapshot.contains("launcher")) installedApps else "Use open_app if needed"

                          val nextDecision = thinkLikeGeniusHuman(
                              goal = currentGoal, userCorrection = liveUserCorrection, researchedInfo = researchedContext,
                              vaultSummary = vaultSummary, deviceContext = getLiveDeviceContext(), installedApps = appsForPrompt,
                              screen = screenSnapshot, screenshotB64 = screenshotB64, stuckCount = stuckCount
                          )
                          if (!isRunning) break
                          liveUserCorrection = ""

                          val chosenBtn = nextDecision.optString("chosen_button_info", "")
                          val nextPlan = nextDecision.optString("next_step_plan", "")
                          val capNote = nextDecision.optString("capability_note", "")
                          if (chosenBtn.isNotEmpty() || nextPlan.isNotEmpty()) {
                              planPreviewTv.text = "🎯 [Step $aiConsultCount] बटन: $chosenBtn | आगे: $nextPlan"
                              saveBrainLog("S$aiConsultCount: $chosenBtn -> $nextPlan")
                          }

                          val newClip = nextDecision.optString("copy_to_clipboard", "")
                          if (newClip.isNotBlank()) copyToClipboard(newClip)

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ मॉडल स्विच हो रहा है (3s)..."
                              delay(3000); continue
                          } else if (topAct == "done" || topAct == "chat_reply") {
                              val m = nextDecision.optString("message", nextDecision.optString("speak", "काम पूरा हो गया!"))
                              recordLearnedSuccess(currentGoal)
                              speakOut(m); vibratePhone(); planPreviewTv.text = "💬 $m"; stopAgent("✅ $m"); break
                          } else if (topAct == "ask_user") {
                              val m = nextDecision.optString("message", "यहाँ आपकी मदद चाहिए")
                              val full = if (capNote.isNotEmpty()) "$m ($capNote)" else m
                              speakOut(full); vibratePhone(); pauseForUser("🤝 $full"); break
                          }

                          val batchSpeak = nextDecision.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) stepQueue.add(arr.getJSONObject(i))
                          } else if (topAct.isNotEmpty() && topAct != "wait") {
                              stepQueue.add(nextDecision)
                          } else if (batchSpeak.isNotEmpty()) {
                              planPreviewTv.text = "💬 $batchSpeak"; stopAgent("✅ $batchSpeak"); break
                          } else {
                              stopAgent("✅ काम पूरा हो गया!"); break
                          }
                      }
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val nextHint = step.optString("next_step", "")
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  if (nextHint.isNotEmpty()) planPreviewTv.text = "🎯 इसके बाद: $nextHint"

                  val sig = "[$action](#$targetId '$target' $x,$y)"
                  history.add("$sig -> $reason")
                  if (history.size > 14) history.removeAt(0)
                  recentActionSignatures.add(sig)
                  if (recentActionSignatures.size > 8) recentActionSignatures.removeAt(0)

                  // Fix #92: English + Hindi Hard Safety Lock
                  if (action == "click" || action == "long_press") {
                      val lbl = nodeMap[targetId]?.let { (it.text ?: it.contentDescription ?: "").toString().lowercase() } ?: target.lowercase()
                      val danger = listOf(
                          "delete forever", "uninstall", "pay ₹", "send money", "confirm payment", "factory reset",
                          "हमेशा के लिए हटाएं", "अनइंस्टॉल", "भुगतान करें", "पैसे भेजें"
                      )
                      val goalL = currentGoal.lowercase()
                      if (danger.any { lbl.contains(it) && !goalL.contains(it.split(" ").first()) }) {
                          pauseForUser("🛡️ Safety Lock: '$lbl' संवेदनशील बटन है। आगे बढ़ने के लिए ▶ दबाएँ")
                          return false
                      }
                  }

                  return when (action) {
                      "chat_reply" -> {
                          val msg = text.ifEmpty { step.optString("message", reason) }
                          speakOut(msg); planPreviewTv.text = "💬 $msg"; stopAgent("😊 $msg"); true
                      }
                      "open_app" -> { val ok = openAppByName(step.optString("app_name", target)); delay(2000); ok }
                      "direct_intent" -> { val ok = fireDirectIntent(step.optString("intent_type", ""), step.optString("data", text)); delay(2100); ok }
                      "write_content" -> { copyToClipboard(text); val ok = performSmartType(targetId, target, x, y, text, step.optBoolean("press_enter", false)); delay(1300); ok }
                      "scroll_loop" -> {
                          val dir = step.optString("direction", "up")
                          val sec = step.optInt("interval_sec", 4).coerceIn(2, 20)
                          val cnt = step.optInt("count", 250)
                          for (i in 1..cnt) {
                              if (!isRunning) break
                              statusTv.setTextColor(Color.parseColor("#00F5D4"))
                              statusTv.text = "🔄 Auto-Scroll (#$i) — रोकने के लिए ⏹ दबाएँ"
                              performSwipe(dir, 320); delay(sec * 1000L)
                          }
                          true
                      }
                      "scroll_down" -> { for (i in 1..step.optInt("times", 1).coerceIn(1, 8)) { if (!isRunning) break; performSwipe("up", 320); delay(1000) }; true }
                      "scroll_up" -> { performSwipe("down", 320); delay(1000); true }
                      "fast_scroll" -> { performSwipe(step.optString("direction", "up"), 130); delay(850); true }
                      "swipe_left" -> { performSwipe("left", 280); delay(950); true }
                      "swipe_right" -> { performSwipe("right", 280); delay(950); true }
                      "double_tap" -> { val c = getCoordsForTarget(targetId, target, x, y); performDoubleTap(c.first.toFloat(), c.second.toFloat()); delay(1100); true }
                      "long_press" -> { val c = getCoordsForTarget(targetId, target, x, y); performLongPress(c.first.toFloat(), c.second.toFloat()); delay(1200); true }
                      "pinch_zoom" -> { performPinchZoom(step.optBoolean("zoom_in", true)); delay(1000); true }
                      "drag_and_drop" -> {
                          val c = getCoordsForTarget(targetId, target, x, y)
                          performDragGesture(c.first.toFloat(), c.second.toFloat(), step.optInt("to_x", 540).toFloat(), step.optInt("to_y", 500).toFloat())
                          delay(1100); true
                      }
                      "set_slider" -> {
                          val node = nodeMap[targetId]
                          if (node != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              val rInfo = node.rangeInfo
                              val rawPct = step.optDouble("progress", 50.0).toFloat().coerceIn(0f, 100f)
                              val mappedVal = if (rInfo != null) rInfo.min + (rInfo.max - rInfo.min) * (rawPct / 100f) else rawPct
                              val args = Bundle().apply { putFloat(AccessibilityNodeInfo.ACTION_ARGUMENT_PROGRESS_VALUE, mappedVal) }
                              node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_SET_PROGRESS.id, args)
                          }
                          delay(800); true
                      }
                      "hide_keyboard" -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              softKeyboardController.showMode = SHOW_MODE_HIDDEN; delay(350); softKeyboardController.showMode = SHOW_MODE_AUTO
                          } else performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(650); true
                      }
                      "click" -> {
                          val beforePkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          // Fix #104: Wait if button text has MIUI countdown timer like "(8s)"
                          val btnTxt = nodeMap[targetId]?.text?.toString() ?: ""
                          Regex("\\((\\d+)s\\)").find(btnTxt)?.groupValues?.getOrNull(1)?.toLongOrNull()?.let { sec ->
                              if (sec in 1..10) delay(sec * 1000L + 300L)
                          }
                          val clicked = performSmartClick(targetId, target, x, y)
                          delay(1400)
                          val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          if (beforePkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                              failedTargets.add("#$targetId($x,$y)")
                              performGlobalAction(GLOBAL_ACTION_BACK); delay(900)
                              false
                          } else clicked
                      }
                      "click_best_video" -> {
                          delay(1100)
                          val kw = step.optString("match_keywords", target)
                          val p1 = findNonAdVideoResult(kw)
                          if (p1 != null) { performTap(p1.first.toFloat(), p1.second.toFloat()); delay(1700); true }
                          else {
                              performSwipe("up", 300); delay(1100)
                              val p2 = findNonAdVideoResult(kw)
                              if (p2 != null) { performTap(p2.first.toFloat(), p2.second.toFloat()); delay(1700); true } else false
                          }
                      }
                      "type" -> { val ok = performSmartType(targetId, target, x, y, text, step.optBoolean("press_enter", true)); delay(1500); ok }
                      "system_control" -> { executeSystemControl(step.optString("command", target)); delay(900); true }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK); delay(900); true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME); delay(900); true }
                      "wait" -> { delay(step.optInt("seconds", 2).coerceIn(1, 12) * 1000L); true }
                      else -> false
                  }
              }

