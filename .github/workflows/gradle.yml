                         - {"action": "system_control", "command": "torch_on|torch_off|volume_up|volume_down|mute|notifications|quick_settings|recents", "reason": "System control"}
                      4. Output ONLY valid JSON:
                      {
                        "understood_goal": "Corrected goal",
                        "speak": "Short friendly Hindi sentence telling user what you are doing",
                        "remember": "optional new fact about user or empty string",
