                      TRUE GOAL: "$goal"
                      RESEARCHED FACTS / STRATEGY: "$researchedInfo"
                      USER PERSONAL VAULT: "$vaultSummary"
                      RECENT ACTIONS TAKEN: ${history.joinToString(" -> ")}
                      BLACKLISTED/FAILED COORDS: ${failedTargets.joinToString(", ")}
                      LIVE SCREEN ELEMENTS:
                      $screen

                      ZERO-ERROR & HUMAN INTELLIGENCE RULES:
                      1. STRICT ANTI-AD: Never click any `[AD_SKIP]` or any item containing 'Sponsored', 'Ad', 'विज्ञापन', 'प्रायोजित', 'Visit site', 'Install'. If an Ad covers the top results, return `{"steps": [{"action": "scroll_down", "times": 1, "reason": "विज्ञापन के नीचे असली रिज़ल्ट देख रहा हूँ"}]}`.
