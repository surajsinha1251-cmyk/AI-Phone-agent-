                      3. TOP BAR ACCESS: Top icons like Chrome 3-dots (`⋮` / `menu_button` / `More options`) and top Search Bars (`y` between 40 and 220) are completely uncovered and clickable!
                      4. CO-PILOT HANDOFF: Only use `"action": "ask_user"` if the screen strictly requires a secret OTP, UPI PIN, Captcha, or live human phone call.
                      5. COMPLETION VERIFICATION: Only return `{"action": "done", "message": "काम एकदम परफेक्ट तरीके से पूरा हो गया!"}` when you verify on the screen that the video is actually playing or the final goal is achieved.
