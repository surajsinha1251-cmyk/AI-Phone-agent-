                  """.trimIndent()
                  return@withContext callGeminiWithFallback(prompt, useSearchGrounding = true, base64Image = null)
              }

              private suspend fun solveObstacleWithAI(goal: String, screen: String, screenshotB64: String?): JSONObject = withContext(Dispatchers.IO) {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val memory = prefs.getString("userMemory", "None") ?: "None"

                  val prompt = """
                      You are a Human-like Autonomous Android Phone Agent completing a task.
                      TRUE GOAL: "$goal"
                      USER MEMORY: "$memory"
                      ACTIONS ALREADY TAKEN: ${history.joinToString(" -> ")}
                      LIVE SCREEN ELEMENTS (and attached screenshot if provided):
                      $screen

                      CRITICAL RULES:
                      1. THINK LIKE A SMART HUMAN! Bypass any popup, ad, permission dialog ("Allow", "Skip", "Not now", "Close") on your own.
                      2. If a screenshot is attached, look at the visual buttons/icons to estimate (x, y) coordinates (Phone screen is approx 1080x2400).
                      3. DO NOT use "ask_user" unless a secret Password, PIN, or OTP is strictly required.
                      4. If the goal is achieved (e.g. song/video is playing, setting changed, message sent), return {"action": "done", "message": "Kaam ho gaya!", "speak": "Kaam poora ho gaya hai"}.
                      5. Otherwise return a batch of 1 to 4 fast steps in "steps".
                      Output ONLY valid JSON.
                  """.trimIndent()
                  return@withContext callGeminiWithFallback(prompt, useSearchGrounding = false, base64Image = screenshotB64)
              }

              private fun extractJsonObject(raw: String): JSONObject {
                  val start = raw.indexOf('{')
                  val end = raw.lastIndexOf('}')
                  if (start != -1 && end != -1 && end > start) {
                      return JSONObject(raw.substring(start, end + 1))
                  }
                  return JSONObject(raw)
              }

              private suspend fun callGeminiWithFallback(prompt: String, useSearchGrounding: Boolean, base64Image: String?): JSONObject = withContext(Dispatchers.IO) {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("apiKey", "")?.trim() ?: ""
                  if (apiKey.isEmpty()) {
                      return@withContext JSONObject().put("action", "ask_user").put("message", "Pehle App mein Gemini API Key save karein!")
                  }

                  for (attempt in 0 until modelList.size) {
                      val idx = (currentModelIndex + attempt) % modelList.size
                      val modelName = modelList[idx]
                      val searchModes = if (useSearchGrounding && base64Image == null) listOf(true, false) else listOf(false)

                      for (withSearch in searchModes) {
                          try {
                              val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$modelName:generateContent?key=$apiKey")
                              val conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("Content-Type", "application/json")
                              conn.connectTimeout = 10000
                              conn.readTimeout = 16000
                              conn.doOutput = true

                              val partsArray = JSONArray().apply {
                                  put(JSONObject().put("text", prompt))
                                  if (!base64Image.isNullOrEmpty()) {
                                      val inlineData = JSONObject()
                                          .put("mime_type", "image/jpeg")
                                          .put("data", base64Image)
                                      put(JSONObject().put("inline_data", inlineData))
                                  }
                              }

                              val body = JSONObject().apply {
                                  put("contents", JSONArray().put(JSONObject().put("parts", partsArray)))
                                  if (withSearch) {
                                      put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                                  } else {
                                      put("generationConfig", JSONObject().put("responseMimeType", "application/json"))
                                  }
                              }

                              conn.outputStream.use { it.write(body.toString().toByteArray()) }
                              val code = conn.responseCode

                              if (code == 200) {
                                  currentModelIndex = idx
                                  val resText = conn.inputStream.bufferedReader().readText()
                                  val json = JSONObject(resText)
                                  val parts = json.getJSONArray("candidates")
                                      .getJSONObject(0)
                                      .getJSONObject("content")
                                      .getJSONArray("parts")

                                  var fullReply = ""
                                  for (p in 0 until parts.length()) {
                                      fullReply += parts.getJSONObject(p).optString("text", "")
                                  }
                                  val resultObj = extractJsonObject(fullReply)
                                  resultObj.put("used_model", modelName)
                                  return@withContext resultObj
                              } else if (code == 400 && withSearch) {
                                  continue
                              } else if (code == 400 || code == 403) {
                                  val errStr = conn.errorStream?.bufferedReader()?.readText() ?: ""
                                  if (errStr.contains("API_KEY_INVALID", ignoreCase = true) || errStr.contains("key not valid", ignoreCase = true)) {
                                      return@withContext JSONObject().put("action", "ask_user").put("message", "API Key galat hai, kripya sahi key save karein!")
                                  }
                                  break
                              } else {
                                  break
                              }
                          } catch (e: Exception) {
                              if (!withSearch) break
                          }
                      }
                  }

                  currentModelIndex = (currentModelIndex + 1) % modelList.size
                  return@withContext JSONObject().put("action", "all_limits_exhausted")
              }

              private fun pauseForUser(alertText: String) {
                  isRunning = false
                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                  statusTv.text = alertText
                  actionBtn.text = "▶"
              }

              private fun stopAgent(finalText: String) {
                  isRunning = false
                  statusTv.setTextColor(Color.parseColor("#4ADE80"))
                  statusTv.text = finalText
                  actionBtn.text = "▶"
                  history.clear()
                  stepQueue.clear()
                  setTouchPassThrough(false)
              }

              private fun readScreenElements(): String {
                  val root = rootInActiveWindow ?: return "Screen khali hai"
                  val list = mutableListOf<String>()
                  val pkg = root.packageName?.toString() ?: "unknown"
                  list.add("Current App Package: $pkg")

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      val rect = Rect()
                      node.getBoundsInScreen(rect)
                      if (rect.top < 220 && pkg == packageName) return

                      val text = (node.text ?: node.contentDescription ?: "").toString().trim()
                      val idName = (node.viewIdResourceName ?: "").substringAfterLast("/")
                      val isClick = node.isClickable
                      val isEdit = node.isEditable
                      val isPass = node.isPassword

                      if (text.isNotEmpty() || idName.isNotEmpty() || isEdit || isPass || isClick) {
                          val cx = rect.centerX()
                          val cy = rect.centerY()
                          if (cx > 0 && cy > 0 && rect.width() > 10 && rect.height() > 10) {
                              val tag = when {
                                  isPass -> "[PASSWORD_BOX]"
                                  isEdit -> "[INPUT_BOX]"
                                  isClick -> "[BUTTON]"
                                  else -> "[ITEM]"
                              }
                              val cleanText = text.replace("\n", " ").take(45)
                              val idInfo = if (idName.isNotEmpty()) " id:$idName" else ""
                              if (cleanText.isNotEmpty() || isEdit || idName.isNotEmpty()) {
                                  list.add("$tag \"$cleanText\"$idInfo at (x=$cx, y=$cy)")
                              }
                          }
                      }
                      for (i in 0 until node.childCount) {
                          traverse(node.getChild(i))
                      }
                  }
                  traverse(root)
                  return list.take(95).joinToString("\n")
              }

              private fun performTap(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 90)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              private fun performDoubleTap(x: Float, y: Float) {
                  val path1 = Path().apply { moveTo(x, y) }
                  val path2 = Path().apply { moveTo(x, y) }
                  val s1 = GestureDescription.StrokeDescription(path1, 0, 55)
                  val s2 = GestureDescription.StrokeDescription(path2, 130, 55)
                  dispatchGesture(GestureDescription.Builder().addStroke(s1).addStroke(s2).build(), null, null)
              }

              private fun performLongPress(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 850)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              private fun performSwipe(direction: String) {
                  val path = Path().apply {
                      when (direction.lowercase()) {
                          "down" -> { moveTo(540f, 400f); lineTo(540f, 1600f) }
                          "left" -> { moveTo(950f, 1000f); lineTo(120f, 1000f) }
                          "right" -> { moveTo(120f, 1000f); lineTo(950f, 1000f) }
                          else -> { moveTo(540f, 1600f); lineTo(540f, 350f) }
                      }
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 320)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              private fun typeTextAndSubmit(text: String, pressEnter: Boolean): Boolean {
                  val root = rootInActiveWindow ?: return false
                  fun findAndType(node: AccessibilityNodeInfo?): Boolean {
                      if (node == null) return false
                      if (node.isEditable) {
                          node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          val args = Bundle().apply {
                              putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                          }
                          node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                          if (pressEnter && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                          }
                          return true
                      }
                      for (i in 0 until node.childCount) {
                          if (findAndType(node.getChild(i))) return true
                      }
                      return false
                  }
                  return findAndType(root)
              }

              private fun getInstalledAppNames(): String {
                  return try {
                      val pm = packageManager
                      val names = mutableListOf<String>()
                      for (info in pm.getInstalledApplications(0)) {
                          if (pm.getLaunchIntentForPackage(info.packageName) != null) {
                              names.add(pm.getApplicationLabel(info).toString())
                          }
                      }
                      names.distinct().take(55).joinToString(", ")
                  } catch (e: Exception) {
                      "YouTube, WhatsApp, Chrome, Settings, Instagram, Phone, Messages"
                  }
              }

              private fun openAppByName(appName: String): Boolean {
                  val pm = packageManager
                  val apps = pm.getInstalledApplications(0)
                  val cleanTarget = appName.trim().lowercase()

                  val match = apps.firstOrNull {
                      val label = pm.getApplicationLabel(it).toString().lowercase()
                      label == cleanTarget || label.contains(cleanTarget) || cleanTarget.contains(label)
                  }
                  if (match != null) {
                      val intent = pm.getLaunchIntentForPackage(match.packageName)
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                          return true
                      }
                  }
                  return false
              }

              private fun vibratePhone() {
                  val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  v.vibrate(VibrationEffect.createOneShot(300, VibrationEffect.DEFAULT_AMPLITUDE))
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  tts?.shutdown()
                  speechRecognizer?.destroy()
                  super.onDestroy()
              }
          }
