                  var s = stripWakeWordPrefix(rawCmd).lowercase().trim()
                  val fillerWords = listOf(
                      "please", "bhai", "ai", "yantra", "यंत्र", "zara", "jara", "turant", "jaldi", "abhi",
                      "open karo", "open kar do", "open kariye", "open kar", "open",
                      "kholo", "khol do", "kholiye", "khol de", "khol",
                      "खोलो", "खोल दो", "खोलिए", "खोल",
                      "chalu karo", "chalu kar do", "चालू करो", "चालू कर दो",
                      "start karo", "start", "launch karo", "launch",
                      "चलाओ", "chalao", "app", "ऐप", "application", "ko", "को", "ka", "ki", "ke", "का", "की", "के"
                  )
                  for (w in fillerWords) {
                      s = Regex("\\b${Regex.escape(w)}\\b").replace(s, " ")
                      s = s.replace(w, " ")
                  }
                  return s.replace("\\s+".toRegex(), " ").trim()
              }

              private suspend fun waitForUiReady(previousPkg: String = "", maxWaitMs: Long = 450L) {
                  val start = System.currentTimeMillis()
                  delay(50)
                  while (System.currentTimeMillis() - start < maxWaitMs && isRunning) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          val curPkg = root.packageName?.toString() ?: ""
                          if (previousPkg.isNotEmpty() && curPkg.isNotEmpty() && curPkg != previousPkg) {
                              delay(65) ; return
                          }
                          if (previousPkg.isEmpty() && root.childCount > 0) return
                      }
                      delay(30)
                  }
              }

