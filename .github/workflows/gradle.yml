              private fun saveBrainLog(entry: String) {
                  try {
                      val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                      val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      val old = prefs.getString("brainLogs", "") ?: ""
