                              speakOut("YantraBrain update ho gaya hai, Actions page khol raha hoon")
                              fireDirectIntent("open_url", githubActionsUrl)
                              stopAgent("✅ YantraBrain.kt Direct Commit Success! Actions se APK update karein.")
                              return@launch
                          } else saveBrainLog("GH_API_ERR: $msg")
                      }

                      statusTv.setTextColor(Color.parseColor("#38BDF8"))
                      statusTv.text = "🚀 Chrome mein YantraBrain.kt Edit Page kholkar Auto-Paste kar raha hoon..."
                      speakOut("GitHub par YantraBrain file khol raha hoon")
                      fireDirectIntent("open_url", githubBrainEditUrl)
                      delay(3200)

                      if (cleanKotlin.contains("object YantraBrain")) {
                          val root = rootInActiveWindow
                          val editorNode = if (root != null) findEditableNode(root) else null
                          if (editorNode != null) {
                              editorNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                              val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, cleanKotlin) }
                              if (editorNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                                  delay(600)
                                  waitForKeywordOnScreen("commit changes", 1400L)?.let { c1 ->
                                      performTap(c1.first.toFloat(), c1.second.toFloat()) ; delay(950)
                                      waitForKeywordOnScreen("commit changes", 1400L)?.let { c2 ->
                                          performTap(c2.first.toFloat(), c2.second.toFloat()) ; delay(1500)
                                          fireDirectIntent("open_url", githubActionsUrl)
                                          stopAgent("✅ YantraBrain.kt Auto-Committed! Actions se APK update karein.")
                                          return@launch
                                      }
                                  }
                              }
                          }
                      }
                      statusTv.text = "✅ YantraBrain.kt Edit Page khul gaya! Paste karke Commit dabayein."
                      isRunning = false ; autoCollapseBar(false)
                  }
              }

              private fun commitBrainViaGitHubApi(token: String, newKotlinContent: String): Pair<Boolean, String> {
                  var getConn: HttpURLConnection? = null
                  var putConn: HttpURLConnection? = null
                  try {
                      getConn = (URL(githubBrainApiUrl).openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          setRequestProperty("Authorization", "Bearer $token")
                          setRequestProperty("Accept", "application/vnd.github+json")
                          connectTimeout = 6000 ; readTimeout = 6000
                      }
                      val currentSha = if (getConn.responseCode == 200) {
                          JSONObject(getConn.inputStream.bufferedReader().readText()).optString("sha", "")
                      } else ""

                      val b64Content = Base64.encodeToString(newKotlinContent.toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                      val payload = JSONObject().apply {
                          put("message", "Autonomous YantraBrain.kt Modular Upgrade")
                          put("content", b64Content)
                          if (currentSha.isNotEmpty()) put("sha", currentSha)
                          put("branch", "main")
                      }

                      putConn = (URL(githubBrainApiUrl).openConnection() as HttpURLConnection).apply {
                          requestMethod = "PUT"
                          setRequestProperty("Authorization", "Bearer $token")
                          setRequestProperty("Accept", "application/vnd.github+json")
                          setRequestProperty("Content-Type", "application/json")
                          connectTimeout = 8000 ; readTimeout = 8000 ; doOutput = true
                      }
                      putConn.outputStream.use { it.write(payload.toString().toByteArray()) }
                      val putCode = putConn.responseCode
                      return if (putCode == 200 || putCode == 201) Pair(true, "Committed") else Pair(false, "PUT HTTP $putCode")
                  } catch (e: Exception) {
                      return Pair(false, e.message ?: "Error")
                  } finally {
                      try { getConn?.disconnect() ; putConn?.disconnect() } catch (e: Exception) {}
                  }
              }

              private fun initWakeRecognizerIfNeeded() {
                  if (wakeRecognizer != null) return
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) return

                  wakeRecognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) { isListeningWakeNow = true }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() { isListeningWakeNow = false }
                          override fun onError(error: Int) {
                              isListeningWakeNow = false
                              if (isWakeWordEnabled && !isManualMicOpen) {
                                  scope.launch { delay(if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) 1200L else 550L) ; startHeyYantraWakeLoop() }
                              }
                          }
                          override fun onResults(results: Bundle?) {
                              isListeningWakeNow = false
                              val spoken = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.trim() ?: ""
                              if (spoken.isNotEmpty()) handleWakeWordTranscript(spoken, true)
                              if (isWakeWordEnabled && !isManualMicOpen) scope.launch { delay(250L) ; startHeyYantraWakeLoop() }
                          }
                          override fun onPartialResults(partialResults: Bundle?) {
                              val partial = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.trim() ?: ""
                              if (partial.isNotEmpty()) handleWakeWordTranscript(partial, false)
                          }
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                  }
              }

              private fun handleWakeWordTranscript(rawSpoken: String, isFinal: Boolean) {
                  val now = System.currentTimeMillis()
                  val lower = rawSpoken.lowercase().trim()
                  if (lower.isEmpty() || (lower == lastWakeTriggeredText && now - lastWakeTriggeredTime < 2500L)) return

                  if (awaitingCommandAfterWake && now < wakeWindowExpireTime) {
                      if (isFinal) {
                          val cleaned = stripWakeWordPrefix(rawSpoken)
                          if (cleaned.length >= 2) {
                              awaitingCommandAfterWake = false ; lastWakeTriggeredText = lower ; lastWakeTriggeredTime = now
                              vibrateTick(60) ; onVoiceCommandReceived(cleaned, isRunning)
                          }
                      }
                      return
                  } else if (awaitingCommandAfterWake) awaitingCommandAfterWake = false

                  val wakeTriggers = listOf("hey yantra", "hi yantra", "ok yantra", "he yantra", "yantra", "हे यंत्र", "ओके यंत्र", "यंत्र", "हे यन्त्र")
                  val matchedWake = wakeTriggers.firstOrNull { lower.contains(it) } ?: return
                  val afterWake = lower.substringAfter(matchedWake).trim()

                  if (isFinal) {
                      lastWakeTriggeredText = lower ; lastWakeTriggeredTime = now
                      if (afterWake.length >= 2) {
                          awaitingCommandAfterWake = false ; vibrateTick(70)
                          onVoiceCommandReceived(afterWake, isRunning)
                      } else {
                          awaitingCommandAfterWake = true ; wakeWindowExpireTime = now + 9000L
                          vibrateTick(90) ; tts?.stop()
                          if (isRunning) { agentJob?.cancel() ; isRunning = false }
                          autoCollapseBar(false)
                          statusTv.text = "👂 हाँ भाई, बोलिए क्या करना है?"
                          speakOut("हाँ भाई, बोलिए")
                      }
                  }
              }

              private fun stripWakeWordPrefix(raw: String): String {
                  var s = raw.trim()
                  for (p in listOf("hey yantra", "hi yantra", "ok yantra", "he yantra", "yantra", "हे यंत्र", "ओके यंत्र", "यंत्र")) {
                      if (s.lowercase().startsWith(p)) s = s.substring(p.length).trim()
                  }
                  return s.removePrefix(",").removePrefix(".").trim()
              }

              private fun startHeyYantraWakeLoop() {
                  if (!isWakeWordEnabled || isManualMicOpen || isListeningWakeNow) return
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return
                  try {
                      initWakeRecognizerIfNeeded()
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf("en-IN", "hi-IN"))
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      }
                      wakeRecognizer?.startListening(intent)
                  } catch (e: Exception) { isListeningWakeNow = false }
              }

              private fun stopHeyYantraWakeLoop() {
                  try { isListeningWakeNow = false ; wakeRecognizer?.cancel() ; wakeRecognizer?.destroy() ; wakeRecognizer = null } catch (e: Exception) {}
              }

              fun pauseWakeWordForManualMic() { isManualMicOpen = true ; stopHeyYantraWakeLoop() }
              fun resumeWakeWordAfterManualMic() { isManualMicOpen = false ; if (isWakeWordEnabled) scope.launch { delay(350) ; startHeyYantraWakeLoop() } }

              private fun refreshInstalledAppsCache(forceFullScan: Boolean = false) {
                  if (!forceFullScan && appCacheMap.size > 40) return
                  try {
                      val pm = packageManager
                      val tempMap = mutableMapOf<String, String>()
                      val labelList = mutableListOf<String>()
                      val aiList = mutableListOf<String>()

                      val builtInAliases = mapOf(
                          "youtube" to "com.google.android.youtube", "यूट्यूब" to "com.google.android.youtube",
                          "whatsapp" to "com.whatsapp", "व्हाट्सएप" to "com.whatsapp",
                          "instagram" to "com.instagram.android", "chrome" to "com.android.chrome",
                          "play store" to "com.android.vending", "flipkart" to "com.flipkart.android",
                          "amazon" to "in.amazon.mshop.android.shopping", "phonepe" to "com.phonepe.app",
                          "gpay" to "com.google.android.apps.nbu.paisa.user", "paytm" to "net.one97.paytm",
                          "camera" to "com.android.camera", "gallery" to "com.miui.gallery",
                          "calculator" to "com.miui.calculator", "clock" to "com.android.deskclock",
                          "files" to "com.mi.android.globalFileexplorer", "notes" to "com.miui.notes",
                          "gmail" to "com.google.android.gm", "maps" to "com.google.android.apps.maps",
                          "telegram" to "org.telegram.messenger", "chatgpt" to "com.openai.chatgpt",
                          "gemini" to "com.google.android.apps.bard", "claude" to "com.anthropic.claude",
                          "perplexity" to "ai.perplexity.app.android", "grok" to "ai.x.grok",
                          "yantra alpha" to "com.ai.yantra.alpha", "yantra beta" to "com.ai.yantra.beta"
                      )
                      tempMap.putAll(builtInAliases)
                      tempMap.putAll(YantraBrain.extraAppAliases)

                      val aiKeywords = listOf("chatgpt", "openai", "gemini", "bard", "claude", "perplexity", "copilot", "deepseek", "grok", "kimi")
                      for (info in pm.getInstalledApplications(0)) {
                          if (pm.getLaunchIntentForPackage(info.packageName) != null) {
                              val label = pm.getApplicationLabel(info).toString().trim()
                              val lower = label.lowercase()
                              tempMap[lower] = info.packageName
                              labelList.add(label)
                              if (aiKeywords.any { lower.contains(it) || info.packageName.lowercase().contains(it) }) aiList.add(label)
                          }
                      }
                      synchronized(appCacheMap) { appCacheMap.clear() ; appCacheMap.putAll(tempMap) }
                      installedAiAppsList.clear() ; installedAiAppsList.addAll(aiList.distinct())
                      cachedAppNamesSummary = labelList.distinct().take(65).joinToString(", ")

                      val mapJson = JSONObject()
                      for ((k, v) in tempMap) mapJson.put(k, v)
                      val rootJson = JSONObject().put("map", mapJson).put("ai", JSONArray(installedAiAppsList)).put("summary", cachedAppNamesSummary)
                      getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE).edit().putString("persistedAppCacheJson", rootJson.toString()).apply()
                  } catch (e: Exception) {}
              }

              private fun saveBrainLog(entry: String) {
                  try {
                      val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                      val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      val old = prefs.getString("brainLogs", "") ?: ""
                      prefs.edit().putString("brainLogs", ("[$time] $entry\n" + old).take(1200)).apply()
                  } catch (e: Exception) {}
              }

              fun speakOut(text: String) {
                  if (!isVoiceEnabled || text.isBlank()) return
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN && isRunning) {
                      val now = System.currentTimeMillis()
                      if (now - lastVolDownTime < 650L) { vibrateTick(120) ; stopAgent("✋ Stopped by Volume Key") ; return true }
                      lastVolDownTime = now
                  }
                  return super.onKeyEvent(event)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: ""
                      val txt = event.text.joinToString(" ").trim()
                      if (txt.isNotEmpty() && pkg != packageName) latestNotificationText = "[$pkg] $txt"
                  }
              }

              fun onVoiceCommandReceived(spoken: String, wasInterrupted: Boolean) {
                  scope.launch {
                      tts?.stop() ; agentJob?.cancel() ; isRunning = false
                      val finalCmd = stripWakeWordPrefix(spoken).ifEmpty { spoken }
                      cmdInput.setText(finalCmd)
                      if (!wasInterrupted && tryOfflineInstantReflex(finalCmd)) return@launch
                      delay(40)
                      currentGoal = finalCmd
                      startGeniusAgent(wasInterrupted)
                  }
              }

