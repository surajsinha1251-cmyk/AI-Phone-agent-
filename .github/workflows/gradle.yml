                  }
                  val missionTv = TextView(this).apply {
                      val m = prefs.getString("activeMission", "कोई मिशन एक्टिव नहीं है। फ्लोटिंग बार में कोई भी बड़ा चैलेंज बोलें!")
                      text = m
                      setTextColor(Color.LTGRAY)
