              // GUARANTEED BACKGROUND AUTO-CODER FALLBACK: If Gemini UI copy button isn't found, generates YantraBrain.kt directly in background!
              private suspend fun generateUpgradedBrainInBackground(customReq: String): String? = withContext(Dispatchers.IO) {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val key = (prefs.getString("apiKey", "") ?: "").split(",").firstOrNull()?.trim() ?: ""
                  if (key.isEmpty()) return@withContext null
                  var conn: HttpURLConnection? = null
                  try {
                      conn = URL("${httpsPrefix}[generativelanguage.googleapis.com/v1beta/models/$lastWorkingModel:generateContent?key=$key](https://generativelanguage.googleapis.com/v1beta/models/$lastWorkingModel:generateContent?key=$key)").openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.connectTimeout = 6000 ; conn.readTimeout = 12000 ; conn.doOutput = true
                      val prompt = """
                          Generate ONLY valid Kotlin code for `YantraBrain.kt` starting with `package com.ai.phoneagent` and `object YantraBrain`.
                          Keep exact method signatures:
                          - `const val BRAIN_VERSION = "28.2-AUTO-EVOLVED"`
                          - `val extraAppAliases: Map<String, String>`
                          - `fun handleCustomReflex(g: String, service: AgentService): Boolean`
                          - `fun buildMegaAuditPrompt(myVariant: String, targetTwin: String, cacheTimeMs: Long, appCount: Int, aiCount: Int, modelName: String, apiLatencyMs: Long, recentLogs: String, failedList: String, customFeatureRequest: String): String`
                          - `fun extractPureBrainKotlin(raw: String): String?`
                          - `fun buildActionPrompt(dmWidth: Int, dmHeight: Int, redmiStatus: String, nowTime: String, goal: String, corr: String, researchedInfo: String, notesSoFar: String, aiAppsOnPhone: String, installedApps: String, vaultSummary: String, latestNotif: String, historyStr: String, failedStr: String, stuckCount: Int, screen: String): String`
                          User extra feature request: "$customReq"
                      """.trimIndent()
                      val body = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                          put("generationConfig", JSONObject().put("temperature", 0.1).put("maxOutputTokens", 1800))
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      if (conn.responseCode == 200) {
                          val resText = conn.inputStream.bufferedReader().readText()
                          val reply = JSONObject(resText).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).optString("text", "")
                          return@withContext YantraBrain.extractPureBrainKotlin(reply)
                      }
                  } catch (e: Exception) {} finally { try { conn?.disconnect() } catch (e: Exception) {} }
                  return@withContext null
              }

