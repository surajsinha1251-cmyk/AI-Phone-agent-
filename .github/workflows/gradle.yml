                      "best phone", "sabse best", "compare", "ek ek karke", "sabhi ai", "saare ai"
                  ).any { lower.contains(it) }
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  if (!isResumeWithCorrection && tryOfflineInstantReflex(currentGoal)) return
                  agentJob?.cancel() ; isRunning = true
                  if (!isResumeWithCorrection) {
                      history.clear() ; recentActionSignatures.clear() ; failedTargets.clear()
                      researchedContext = "" ; collectedNotes = ""
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      val installedApps = getInstalledAppNames()
                      val aiAppsOnPhone = if (installedAiAppsList.isNotEmpty()) installedAiAppsList.joinToString(", ") else "ChatGPT, Gemini, Chrome, Perplexity"
                      val vaultSummary = getPersonalVaultSummary()
                      val redmiStatus = getRedmiPhoneStatus(false)
                      val stepQueue = mutableListOf<JSONObject>()

                      if (!isResumeWithCorrection && needsDeepWebResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "⚡ Hyper-Planner: Multi-App / Research Macro bana raha hoon..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val masterPlan = researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, aiAppsOnPhone, currentPkg)
                          if (!isRunning) return@launch
                          researchedContext = masterPlan.optString("researched_info", "")
                          val missionPlan = masterPlan.optString("save_mission_plan", "")
                          if (missionPlan.isNotBlank()) {
                              getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE).edit().putString("activeMission", missionPlan).apply()
                          }
                          val speakMsg = masterPlan.optString("speak", "")
                          if (speakMsg.isNotEmpty()) speakOut(speakMsg)
                          val initialSteps = masterPlan.optJSONArray("steps")
                          if (initialSteps != null) {
                              for (i in 0 until initialSteps.length()) stepQueue.add(initialSteps.getJSONObject(i))
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("Theek hai, aapki baat maankar rasta badal raha hoon")
                      } else {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "⚡ Hyper-Speed Brain Active..."
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastScreenSig = ""

                      while (isRunning) {
                          while (stepQueue.isNotEmpty() && isRunning) {
                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")
                              if (act == "done") {
                                  val doneMsg = step.optString("message", "Kaam poora ho gaya!")
                                  val pkgNow = rootInActiveWindow?.packageName?.toString()?.substringAfterLast(".") ?: "app"
                                  saveLearnedPath(currentGoal, pkgNow)
                                  speakOut(doneMsg) ; vibrateTick(280) ; stopAgent("✅ $doneMsg")
                                  return@launch
                              }
                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "Bhai, yeh hissa aap poora karke ▶ dabayein")
                                  val whyCant = step.optString("capability_note", "")
                                  val fullAlert = if (whyCant.isNotEmpty()) "$askMsg ($whyCant)" else askMsg
                                  speakOut(fullAlert) ; vibrateTick(320) ; pauseForUser("🤝 $fullAlert")
                                  return@launch
                              }
                              val ok = executeLocalStepWithVerification(step)
                              if (!ok) { stepQueue.clear() ; break }
                          }
                          if (!isRunning) break

                          aiConsultCount++
                          if (aiConsultCount > 45) { stopAgent("✅ Multi-App Task poora ho gaya! Notes: $collectedNotes") ; break }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "⚡ Brain ($lastWorkingModel): Screen read & macro fire..."
                          delay(110)

                          val (screenSnapshot, structSig) = readScreenElementsWithSignature()
                          if (structSig == lastScreenSig) stuckCount++ else { stuckCount = 0 ; lastScreenSig = structSig }

                          val needVision = stuckCount >= 2 || screenSnapshot.lines().size < 4
                          val screenshotB64 = if (needVision) captureScreenBase64() else null

                          val nextDecision = thinkLikeGeniusHuman(
                              currentGoal, liveUserCorrection, researchedContext, collectedNotes,
                              vaultSummary, redmiStatus, installedApps, aiAppsOnPhone, screenSnapshot, screenshotB64, stuckCount
                          )
                          if (!isRunning) break
                          if (liveUserCorrection.isNotEmpty()) liveUserCorrection = ""

                          val newNote = nextDecision.optString("save_note", "")
                          if (newNote.isNotBlank() && !collectedNotes.contains(newNote)) {
                              collectedNotes = if (collectedNotes.isEmpty()) newNote else "$collectedNotes | $newNote"
                          }

                          val chosenBtnInfo = nextDecision.optString("chosen_button_info", "")
                          val nextStepPlan = nextDecision.optString("next_step_plan", "")
                          val capabilityNote = nextDecision.optString("capability_note", "")
                          if (chosenBtnInfo.isNotEmpty() || nextStepPlan.isNotEmpty()) {
                              planPreviewTv.text = "🎯 [$lastWorkingModel] $chosenBtnInfo ➔ $nextStepPlan"
                          }

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ Flash models busy hain, 2.5 second intezaar..."
                              delay(2500) ; continue
                          } else if (topAct == "done") {
                              val m = nextDecision.optString("message", "Kaam poora ho gaya!")
                              val pkgNow = rootInActiveWindow?.packageName?.toString()?.substringAfterLast(".") ?: "app"
                              saveLearnedPath(currentGoal, pkgNow)
                              speakOut(m) ; vibrateTick(280) ; stopAgent("✅ $m") ; break
                          } else if (topAct == "ask_user") {
                              val m = nextDecision.optString("message", "Yahan aapki madad chahiye")
                              if (m.contains("Key", true) && tryLocalScreenClickOrType(currentGoal)) {
                                  stopAgent("✅ Local Screen Brain ne button click kar diya!") ; break
                              }
                              val fullMsg = if (capabilityNote.isNotEmpty()) "$m — $capabilityNote" else m
                              speakOut(fullMsg) ; vibrateTick(320) ; pauseForUser("🤝 $fullMsg") ; break
                          }

                          val batchSpeak = nextDecision.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) stepQueue.add(arr.getJSONObject(i))
                          } else if (topAct.isNotEmpty()) {
                              stepQueue.add(nextDecision)
                          } else {
                              stopAgent("✅ Kaam poora ho gaya!") ; break
                          }
                      }
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val nextHint = step.optString("next_step", "")
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  val lowerTarget = "$target $reason".lowercase()
                  val goalLower = currentGoal.lowercase()
                  if ((lowerTarget.contains("delete") || lowerTarget.contains("uninstall") || lowerTarget.contains("format")) &&
                      !goalLower.contains("delete") && !goalLower.contains("डिलीट") && !goalLower.contains("हटाओ") && !goalLower.contains("uninstall")) {
                      pauseForUser("🛡️ Safety Lock: '$reason' khatarnaak button hai. Agar dabana hai toh khud dabakar ▶ karein.")
                      return false
                  }

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  if (nextHint.isNotEmpty()) planPreviewTv.text = "🎯 Iske baad: $nextHint"

                  val prevPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                  val pkgShort = prevPkg.substringAfterLast(".").ifEmpty { "app" }
                  recentActionSignatures.add("[$pkgShort]$action(#$targetId '$target')")
                  history.add("[$pkgShort]$action(#$targetId '$target' $reason)")
                  if (history.size > 20) history.removeAt(0)

                  when (action) {
                      "save_note" -> {
                          val note = step.optString("note", text)
                          if (note.isNotBlank()) collectedNotes = if (collectedNotes.isEmpty()) note else "$collectedNotes | $note"
                          return true
                      }
                      "open_app" -> {
                          val opened = openAppByName(step.optString("app_name", target))
                          if (opened) waitForUiReady(prevPkg, 650L)
                          return opened
                      }
                      "open_setting" -> {
                          val ok = openRedmiSetting(step.optString("setting_name", target))
                          if (ok) waitForUiReady(prevPkg, 550L)
                          return ok
                      }
                      "direct_intent" -> {
                          val intentType = step.optString("intent_type", "")
                          val data = step.optString("data", text)
                          val ok = fireDirectIntent(intentType, data)
                          waitForUiReady(prevPkg, 750L)
                          if (ok && intentType.lowercase() == "youtube_search" &&
                              (goalLower.contains("chala") || goalLower.contains("चला") || goalLower.contains("play") || goalLower.contains("song") || goalLower.contains("गाना") || goalLower.contains("video") || goalLower.contains("episode") || goalLower.contains("एपिसोड"))) {
                              delay(950)
                              val pos = findNonAdVideoResult(data) ?: run { performSwipe("up") ; delay(550) ; findNonAdVideoResult(data) }
                              if (pos != null) {
                                  performTap(pos.first.toFloat(), pos.second.toFloat()) ; delay(600)
                                  stopAgent("✅ Ad chhodkar asli video chala diya!")
                              }
                          }
                          return ok
                      }
                      "write_content" -> {
                          copyToClipboard(text)
                          val ok = performSmartType(targetId, x, y, text, step.optBoolean("press_enter", false))
                          delay(350) ; return ok
                      }
                      "scroll_loop" -> {
                          val dir = step.optString("direction", "up")
                          val sec = step.optInt("interval_sec", 4).coerceIn(2, 15)
                          for (i in 1..step.optInt("count", 150)) {
                              if (!isRunning) break
                              statusTv.text = "🔄 Lagataar Scroll (#$i) — rokne ke liye ✋ ya ⏹ dabayein"
                              performSwipe(dir) ; delay(sec * 1000L)
                          }
                          return true
                      }
                      "scroll_down" -> {
                          for (i in 1..step.optInt("times", 1).coerceIn(1, 5)) { if (!isRunning) break ; performSwipe("up") ; delay(320) }
                          return true
                      }
                      "scroll_up" -> { performSwipe("down") ; delay(320) ; return true }
                      "swipe_left" -> { performSwipe("left") ; delay(280) ; return true }
                      "swipe_right" -> { performSwipe("right") ; delay(280) ; return true }
                      "double_tap" -> { val c = getCoordsForTarget(targetId, x, y) ; performDoubleTap(c.first.toFloat(), c.second.toFloat()) ; delay(350) ; return true }
                      "long_press" -> { val c = getCoordsForTarget(targetId, x, y) ; performLongPress(c.first.toFloat(), c.second.toFloat()) ; delay(400) ; return true }
                      "click" -> {
                          val clickedNode = nodeMap[targetId]
                          if (prevPkg == "com.google.android.youtube" && clickedNode != null && isAdElement(clickedNode)) {
                              performSwipe("up") ; delay(500)
                              findNonAdVideoResult(currentGoal)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(600) ; return true }
                              return false
                          }
                          if (targetId > 0 || (x > 0 && y > 0)) {
                              performSmartClick(targetId, x, y)
                              waitForUiReady(prevPkg, 450L)
                              val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                              if (prevPkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                                  failedTargets.add("#$targetId($x,$y)")
                                  performGlobalAction(GLOBAL_ACTION_BACK) ; delay(400) ; return false
                              }
                              return true
                          }
                          if (target.isNotEmpty()) {
                              waitForKeywordOnScreen(target, 1200L)?.let {
                                  performTap(it.first.toFloat(), it.second.toFloat())
                                  waitForUiReady(prevPkg, 450L) ; return true
                              }
                          }
                          return false
                      }
                      "click_best_video" -> {
                          delay(500)
                          val matchKw = step.optString("match_keywords", target)
                          val pos = findNonAdVideoResult(matchKw) ?: run { performSwipe("up") ; delay(550) ; findNonAdVideoResult(matchKw) }
                          if (pos != null) { performTap(pos.first.toFloat(), pos.second.toFloat()) ; delay(700) ; return true }
                          return false
                      }
                      "type" -> {
                          val pressEnter = step.optBoolean("press_enter", true)
                          if (target.isNotEmpty() && targetId <= 0 && x <= 0) {
                              waitForKeywordOnScreen(target, 1100L)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(220) }
                          }
                          val ok = performSmartType(targetId, x, y, text, pressEnter)
                          delay(450) ; return ok
                      }
                      "system_control" -> { executeSystemControl(step.optString("command", target)) ; delay(250) ; return true }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK) ; delay(350) ; return true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME) ; delay(350) ; return true }
                      "wait" -> { delay(step.optInt("seconds", 1).coerceIn(1, 5) * 1000L) ; return true }
                  }
                  return false
              }

              private suspend fun thinkLikeGeniusHuman(
                  goal: String, userCorrection: String, researchedInfo: String, notesSoFar: String,
                  vaultSummary: String, redmiStatus: String, installedApps: String, aiAppsOnPhone: String,
                  screen: String, screenshotB64: String?, stuckCount: Int
              ): JSONObject = withContext(Dispatchers.IO) {
                  val dm = resources.displayMetrics
                  val nowTime = SimpleDateFormat("yyyy-MM-dd HH:mm EEEE", Locale.getDefault()).format(Date())
                  val corr = if (userCorrection.isNotBlank()) "🚨 URGENT LIVE USER INTERRUPTION: \"$userCorrection\" -> OBEY THIS IMMEDIATELY!" else "No live interruption."

                  val taskCategory = when {
                      userCorrection.isNotBlank() -> "LIVE_VOICE"
                      screenshotB64 != null || stuckCount >= 2 -> "DEEP_RESEARCH"
                      else -> "FAST_ACTION"
                  }

                  val prompt = """
                      You are a Hyper-Speed Multi-App Android Mind (Version 19.0) controlling Xiaomi Redmi Note 10S (${dm.widthPixels}x${dm.heightPixels} px).
                      LIVE HARDWARE: $redmiStatus | TIME: $nowTime
                      MAIN GOAL: "$goal"
                      $corr
                      RESEARCHED FACTS: "$researchedInfo"
                      COLLECTED MULTI-APP NOTES SO FAR: "$notesSoFar"
                      AI APPS INSTALLED ON THIS PHONE: $aiAppsOnPhone
                      ALL INSTALLED APPS: $installedApps
                      USER VAULT: "$vaultSummary" | NOTIFICATION: "$latestNotificationText"
                      HISTORY: ${history.joinToString(" -> ")} | BLACKLISTED: ${failedTargets.joinToString(", ")} | STUCK_COUNT: $stuckCount
