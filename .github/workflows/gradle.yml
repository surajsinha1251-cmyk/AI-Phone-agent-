                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  dragBtn = makePillButton("✥", "#1E293B")
                  var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
                  val dragListener = View.OnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x; initY = params.y; touchX = ev.rawX; touchY = ev.rawY; true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val curDm = resources.displayMetrics
                              params.x = (initX + (ev.rawX - touchX).toInt()).coerceIn(0, curDm.widthPixels - 120)
                              params.y = (initY + (ev.rawY - touchY).toInt()).coerceIn(20, curDm.heightPixels - 150)
                              try { windowManager.updateViewLayout(container, params) } catch (_: Exception) {}
                              true
                          }
                          else -> false
                      }
