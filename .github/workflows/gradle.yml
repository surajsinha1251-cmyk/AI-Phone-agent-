              private fun findPackageInstant(appName: String): String? {
                  val clean = appName.trim().lowercase()
                  if (clean.isEmpty()) return null
                  if (appCacheMap.isEmpty()) refreshInstalledAppsCache(forceFullScan = true)
                  synchronized(appCacheMap) {
                      appCacheMap[clean]?.let { return it }
                      for ((label, pkg) in appCacheMap) {
                          if (label == clean || label.contains(clean) || clean.contains(label)) return pkg
                      }
                  }
                  return null
              }

