              private fun setTouchPassThrough(passThrough: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (passThrough) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              private fun setWindowGhostMode(ghost: Boolean) {
                  val view = floatingLayout ?: return
                  view.visibility = if (ghost) View.GONE else View.VISIBLE
                  params.flags = if (ghost) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              private fun autoCollapseBar(collapse: Boolean) {
                  val dm = resources.displayMetrics
                  isMinimized = collapse
                  inputRow.visibility = if (collapse) View.GONE else View.VISIBLE
                  planPreviewTv.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  ttsToggleBtn.visibility = if (collapse) View.GONE else View.VISIBLE
                  vaultOpenBtn.visibility = if (collapse) View.GONE else View.VISIBLE
                  retryBtn.visibility = if (collapse) View.GONE else View.VISIBLE
                  minBtn.text = if (collapse) "➕" else "➖"
                  params.width = if (collapse && !isRunning) WindowManager.LayoutParams.WRAP_CONTENT else (dm.widthPixels * 0.96).toInt()
                  setTouchPassThrough(true)
              }

              private fun getPersonalVaultSummary(): String {
                  val p = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val name = p.getString("vaultName", "") ?: ""
                  val phone = p.getString("vaultPhone", "") ?: ""
                  val email = p.getString("vaultContact", "") ?: ""
                  val upi = p.getString("vaultUpi", "") ?: ""
                  if (name.isEmpty() && phone.isEmpty() && email.isEmpty() && upi.isEmpty()) return "Empty"
                  return "Name:$name | Phone:$phone | Email:$email | UPI:$upi"
              }

              private fun getLiveDeviceContext(): String {
                  val nowStr = SimpleDateFormat("dd MMM yyyy hh:mm a", Locale.ENGLISH).format(Date())
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  return "Time:$nowStr | Bat:$bat% | LastNotif:${latestNotificationText.take(60)}"
              }

              private fun lookupContactNumber(nameQuery: String): String? {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null
                  val clean = nameQuery.trim().lowercase()
                  if (clean.isEmpty()) return null
                  try {
                      contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                          null, null, null
                      )?.use { cursor ->
                          val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (cursor.moveToNext()) {
                              val dName = (cursor.getString(nameIdx) ?: "").lowercase()
                              val dNum = (cursor.getString(numIdx) ?: "").filter { it.isDigit() || it == '+' }
                              if (dName.contains(clean) || clean.contains(dName)) {
                                  if (dNum.length >= 10) return dNum
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return null
              }

              private suspend fun tryInstantHardwareReflex(cmd: String): Boolean {
                  val c = cmd.trim().lowercase()
                  return when {
                      c in listOf("kaisa hai", "kaise ho", "kya haal hai", "hello", "hi", "hey", "कैसा है", "कैसे हो", "हेलो", "नमस्ते") -> {
                          val reply = "मैं एकदम बढ़िया और तैयार हूँ भाई! बताइए आज फोन में क्या काम करना है?"
                          speakOut(reply, forceSpeak = true); planPreviewTv.text = "💬 $reply"; stopAgent("😊 $reply"); true
                      }
                      c in listOf("torch on", "flashlight on", "टॉर्च जलाओ", "टॉर्च ऑन") -> { executeSystemControl("torch_on"); stopAgent("⚡ टॉर्च चालू कर दी!"); true }
                      c in listOf("torch off", "flashlight off", "टॉर्च बंद", "टॉर्च बंद करो") -> { executeSystemControl("torch_off"); stopAgent("⚡ टॉर्च बंद कर दी!"); true }
                      c in listOf("back", "पीछे जाओ", "बैक") -> { performGlobalAction(GLOBAL_ACTION_BACK); stopAgent("⚡ पीछे आ गए!"); true }
                      c in listOf("home", "होम स्क्रीन") -> { performGlobalAction(GLOBAL_ACTION_HOME); stopAgent("⚡ होम स्क्रीन!"); true }
                      c in listOf("recent apps", "recents", "रीसेंट ऐप्स") -> { performGlobalAction(GLOBAL_ACTION_RECENTS); stopAgent("⚡ रीसेंट ऐप्स!"); true }
                      c in listOf("volume up", "आवाज़ बढ़ाओ") -> { executeSystemControl("volume_up"); stopAgent("⚡ आवाज़ बढ़ा दी!"); true }
                      c in listOf("volume down", "आवाज़ कम करो") -> { executeSystemControl("volume_down"); stopAgent("⚡ आवाज़ कम कर दी!"); true }
                      else -> false
                  }
              }

              private fun needsGoogleKnowledgeOrResearch(cmd: String): Boolean {
                  val l = cmd.lowercase()
                  return listOf(
                      "episode", "एपिसोड", "latest", "naya", "नया", "last", "aakhiri",
                      "kaise", "कैसे", "kya", "क्या", "kaun", "कौन", "kab", "कब", "kyon", "क्यों",
                      "search", "सर्च", "pata karo", "पता करो", "batao", "बताओ", "free mein", "फ्री में",
                      "kamao", "कमाओ", "price", "news", "khabar"
                  ).any { l.contains(it) }
              }

              // Mobile-Agent-v2 Reflection Engine: Compares screen before & after action to verify progress or detect new popups!
              private fun computeScreenReflection(prevDom: String, currDom: String, lastActionSig: String): String {
                  if (prevDom.isEmpty()) return "Initial step — observe the HTML DOM carefully."
                  val cleanPrev = prevDom.replace(Regex("\\d+:\\d+"), "").replace(Regex("\\d+%"), "")
                  val cleanCurr = currDom.replace(Regex("\\d+:\\d+"), "").replace(Regex("\\d+%"), "")

                  val hadDialogBefore = prevDom.contains("<dialog")
                  val hasDialogNow = currDom.contains("<dialog")

                  return when {
                      !hadDialogBefore && hasDialogNow ->
                          "🔔 REFLECTION: Your last action ($lastActionSig) opened a POPUP `<dialog>` window! You MUST handle the `<radio>`/`<checkbox>` options and `<button>` inside `<dialog>` FIRST before doing anything else!"
                      cleanPrev == cleanCurr ->
                          "⚠️ REFLECTION ALERT: Your last action ($lastActionSig) did NOT change the screen at all! Do NOT repeat $lastActionSig. Choose a different element `#id`, or use `hide_keyboard` / `scroll_down`."
                      else ->
                          "✅ REFLECTION: Screen updated after ($lastActionSig). Verify if the main goal is 100% complete or if another step/popup remains."
                  }
              }

              // OPEN-SOURCE CORE LOOP: Planner -> AutoDroid HTML DOM -> AppAgent SoM Vision -> Mobile-Agent-v2 Reflector
              private fun startOpenSourceCoreAgent(isResumeWithCorrection: Boolean) {
                  agentJob?.cancel()
                  isRunning = true
                  lastSpokenText = ""
                  if (!isResumeWithCorrection) {
                      history.clear()
                      failedTargets.clear()
                      researchedContext = ""
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      if (!isResumeWithCorrection && tryInstantHardwareReflex(currentGoal)) return@launch

                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()

                      // 1. PLANNER & GOOGLE KNOWLEDGE PHASE
                      if (!isResumeWithCorrection && needsGoogleKnowledgeOrResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#00F5D4"))
                          statusTv.text = "🔍 Planner: Google Search से सटीक जानकारी निकाल रहा हूँ..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val researchResult = answerOrResearchWithGoogle(currentGoal, vaultSummary, installedApps, currentPkg)
                          if (!isRunning) return@launch

                          val rAct = researchResult.optString("action", "")
                          if (rAct == "ask_user") {
                              val errMsg = researchResult.optString("message", "API Error")
                              speakOut(errMsg, forceSpeak = true); pauseForUser(errMsg); return@launch
                          }
                          if (rAct == "chat_reply" || rAct == "done") {
                              val ans = researchResult.optString("message", researchResult.optString("researched_info", "यहाँ जवाब है"))
                              val advice = researchResult.optString("next_step_advice", "")
                              speakOut(researchResult.optString("speak", ans), forceSpeak = true)
                              planPreviewTv.text = if (advice.isNotEmpty()) "💡 जवाब: $ans\n👉 आगे: $advice" else "💡 जवाब: $ans"
                              stopAgent("✅ $ans")
                              return@launch
                          }

                          researchedContext = researchResult.optString("researched_info", "")
                          val spk = researchResult.optString("speak", "")
                          if (spk.isNotEmpty()) speakOut(spk)

                          val initStep = researchResult.optJSONObject("first_step")
                              ?: researchResult.optJSONArray("steps")?.optJSONObject(0)
                          if (initStep != null) {
                              executeSingleActionOnPhone(initStep)
                              delay(2300)
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("ठीक है, आपकी बात मानकर रास्ता बदल रहा हूँ", forceSpeak = true)
                      }

                      // 2. DECISION + ACT + REFLECTION LOOP (Mobile-Agent-v2 + AutoDroid + AppAgent SoM)
                      var stepCount = 0
                      var stuckCount = 0
                      var previousHtmlDom = ""
                      var lastActionSignature = "None"

                      while (isRunning && stepCount < 35) {
                          stepCount++
                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "🧠 Step #$stepCount: HTML DOM और पॉपअप पढ़ रहा हूँ..."
                          delay(400)

                          val currentHtmlDom = readScreenAsHtmlDom()
                          val reflectionNote = computeScreenReflection(previousHtmlDom, currentHtmlDom, lastActionSignature)

                          if (reflectionNote.startsWith("⚠️")) {
                              stuckCount++
                              failedTargets.add(lastActionSignature)
                          } else {
                              stuckCount = 0
                          }

                          // Trigger AppAgent Set-of-Mark [#ID] visual screenshot when stuck or on canvas/game screen
                          val somScreenshotB64 = if (stuckCount >= 1 || currentHtmlDom.lines().size < 5) {
                              captureScreenBase64WithSoM()
                          } else null

                          val appsList = if (stepCount <= 2 || currentHtmlDom.contains("launcher")) installedApps else "Use open_app if needed"

                          val decision = openSourceCoreBrainDecision(
                              goal = currentGoal,
                              userCorrection = liveUserCorrection,
                              researchedInfo = researchedContext,
                              reflectionNote = reflectionNote,
                              vaultSummary = vaultSummary,
                              deviceContext = getLiveDeviceContext(),
                              installedApps = appsList,
                              htmlDom = currentHtmlDom,
                              somScreenshotB64 = somScreenshotB64,
                              stuckCount = stuckCount
                          )
                          if (!isRunning) break
                          liveUserCorrection = ""

                          val obs = decision.optString("screen_observation", "")
                          val chosenBtn = decision.optString("chosen_button_info", "")
                          val nextPlan = decision.optString("next_step_plan", "")
                          if (chosenBtn.isNotEmpty() || nextPlan.isNotEmpty()) {
                              planPreviewTv.text = "👁️ DOM: $obs\n🎯 एक्शन: $chosenBtn | 👉 आगे: $nextPlan"
                          }

                          val action = decision.optString("action", "")
                          val speakMsg = decision.optString("speak", "")

                          if (action == "done" || action == "chat_reply") {
                              val finalMsg = decision.optString("message", speakMsg.ifEmpty { "काम पूरा हो गया!" })
                              speakOut(finalMsg, forceSpeak = true)
                              vibratePhone()
                              planPreviewTv.text = "✅ पूरा हुआ: $finalMsg"
                              stopAgent("✅ $finalMsg")
                              break
                          }

                          if (action == "ask_user") {
                              val askMsg = decision.optString("message", "यहाँ आपकी मदद चाहिए")
                              speakOut(askMsg, forceSpeak = true)
                              vibratePhone()
                              pauseForUser("🤝 $askMsg")
                              break
                          }

                          if (speakMsg.isNotEmpty()) speakOut(speakMsg, forceSpeak = false)

                          previousHtmlDom = currentHtmlDom
                          val singleStep = decision.optJSONArray("steps")?.optJSONObject(0) ?: decision
                          lastActionSignature = "${singleStep.optString("action")}(#${singleStep.optInt("id", -1)} '${singleStep.optString("target")}')"
                          executeSingleActionOnPhone(singleStep)
                      }

                      if (isRunning && stepCount >= 35) {
                          stopAgent("✅ काम पूरा हो गया!")
                      }
                  }
              }

              private suspend fun executeSingleActionOnPhone(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"

                  val sig = "$action(#$targetId '$target' $x,$y)"
                  history.add("$sig -> $reason")
                  if (history.size > 10) history.removeAt(0)

                  if (action == "click" || action == "long_press") {
                      val lbl = nodeMap[targetId]?.let { collectSubtreeText(it).lowercase() } ?: target.lowercase()
                      val danger = listOf(
                          "delete forever", "uninstall", "pay ₹", "send money", "confirm payment", "factory reset",
                          "हमेशा के लिए हटाएं", "अनइंस्टॉल", "भुगतान करें", "पैसे भेजें"
                      )
                      val goalL = currentGoal.lowercase()
                      if (danger.any { lbl.contains(it) && !goalL.contains(it.split(" ").first()) }) {
                          pauseForUser("🛡️ Safety Lock: '$lbl' संवेदनशील बटन है। आगे बढ़ने के लिए ▶ दबाएँ")
                          return false
                      }
                  }

                  return when (action) {
                      "open_app" -> {
                          val ok = openAppByName(step.optString("app_name", target))
                          delay(2200)
                          ok
                      }
                      "direct_intent" -> {
                          val iType = step.optString("intent_type", "").lowercase()
                          val iData = step.optString("data", text.ifEmpty { target })
                          val ok = fireDirectIntent(iType, iData)
                          delay(2500)
                          ok
                      }
                      "click" -> {
                          val ok = performSmartClick(targetId, target, x, y)
                          delay(1700)
                          ok
                      }
                      "type", "write_content" -> {
                          val pressEnter = step.optBoolean("press_enter", action == "type")
                          val ok = performSmartType(targetId, target, x, y, text, pressEnter)
                          delay(1700)
                          ok
                      }
                      "scroll_down" -> {
                          val times = step.optInt("times", 1).coerceIn(1, 5)
                          for (i in 1..times) {
                              if (!isRunning) break
                              performSwipe("up", 320); delay(1000)
                          }
                          true
                      }
                      "scroll_up" -> { performSwipe("down", 320); delay(1000); true }
                      "fast_scroll" -> { performSwipe(step.optString("direction", "up"), 130); delay(850); true }
                      "scroll_loop" -> {
                          val dir = step.optString("direction", "up")
                          val sec = step.optInt("interval_sec", 4).coerceIn(2, 20)
                          val cnt = step.optInt("count", 250)
                          for (i in 1..cnt) {
                              if (!isRunning) break
                              statusTv.setTextColor(Color.parseColor("#00F5D4"))
                              statusTv.text = "🔄 Auto-Scroll (#$i) — रोकने के लिए ⏹ दबाएँ"
                              performSwipe(dir, 320); delay(sec * 1000L)
                          }
                          true
                      }
                      "swipe_left" -> { performSwipe("left", 280); delay(1000); true }
                      "swipe_right" -> { performSwipe("right", 280); delay(1000); true }
                      "double_tap" -> { val c = getCoordsForTarget(targetId, target, x, y); performDoubleTap(c.first.toFloat(), c.second.toFloat()); delay(1100); true }
                      "long_press" -> { val c = getCoordsForTarget(targetId, target, x, y); performLongPress(c.first.toFloat(), c.second.toFloat()); delay(1200); true }
                      "pinch_zoom" -> { performPinchZoom(step.optBoolean("zoom_in", true)); delay(1000); true }
                      "drag_and_drop" -> {
                          val c = getCoordsForTarget(targetId, target, x, y)
                          performDragGesture(c.first.toFloat(), c.second.toFloat(), step.optInt("to_x", 540).toFloat(), step.optInt("to_y", 500).toFloat())
                          delay(1100); true
                      }
                      "set_slider" -> {
                          val node = nodeMap[targetId]
                          if (node != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              val rInfo = node.rangeInfo
                              val rawPct = step.optDouble("progress", 50.0).toFloat().coerceIn(0f, 100f)
                              val mappedVal = if (rInfo != null) rInfo.min + (rInfo.max - rInfo.min) * (rawPct / 100f) else rawPct
                              val args = Bundle().apply { putFloat(AccessibilityNodeInfo.ACTION_ARGUMENT_PROGRESS_VALUE, mappedVal) }
                              node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_SET_PROGRESS.id, args)
                          }
                          delay(800); true
                      }
                      "hide_keyboard" -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              softKeyboardController.showMode = SHOW_MODE_HIDDEN; delay(350); softKeyboardController.showMode = SHOW_MODE_AUTO
                          } else performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(700); true
                      }
                      "system_control" -> { executeSystemControl(step.optString("command", target)); delay(1000); true }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK); delay(1100); true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME); delay(1100); true }
                      "wait" -> { delay(step.optInt("seconds", 2).coerceIn(1, 8) * 1000L); true }
                      else -> false
                  }
              }

