                                  lastErr = if (err.contains("leaked", true)) "Purani Key Leaked/Blocked hai! Nayi Key banayein." else "HTTP $code ($mName)"
                              }
                          } catch (e: Exception) { lastErr = e.message ?: "Error" } finally { try { conn?.disconnect() } catch (e: Exception) {} }
                      }
                  }
                  if (workingKeys.isNotEmpty()) {
                      prefs.edit().putString("apiKey", workingKeys.joinToString(",")).apply()
                      return@withContext Pair("#4ADE80", "✅ Sahi aur Working API Key Save Ho Gayi! (${workingKeys.size} Active)")
                  }
                  return@withContext Pair("#F87171", "❌ Key Error: $lastErr")
              }

