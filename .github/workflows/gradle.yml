              private suspend fun captureScreenBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val now = System.currentTimeMillis()
                  if (now - lastScreenshotTime < 1200L) return null
                  lastScreenshotTime = now
                  val deferred = CompletableDeferred<String?>()
                  try {
                      setWindowGhostMode(true) ; delay(60)
                      val dm = resources.displayMetrics
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              try {
                                  val buffer: HardwareBuffer = screenshot.hardwareBuffer
                                  val bmp = Bitmap.wrapHardwareBuffer(buffer, screenshot.colorSpace)
                                  val soft = bmp?.copy(Bitmap.Config.ARGB_8888, false)
                                  buffer.close() ; bmp?.recycle()
                                  if (soft != null) {
                                      val scaled = Bitmap.createScaledBitmap(soft, dm.widthPixels / 2, dm.heightPixels / 2, true)
                                      soft.recycle()
                                      val out = ByteArrayOutputStream()
                                      scaled.compress(Bitmap.CompressFormat.JPEG, 58, out)
                                      scaled.recycle()
                                      deferred.complete(Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP))
                                  } else deferred.complete(null)
                              } catch (e: Exception) { deferred.complete(null) }
                          }
                          override fun onFailure(errorCode: Int) { deferred.complete(null) }
                      })
                  } catch (e: Exception) { setWindowGhostMode(false) ; return null }
                  val res = withTimeoutOrNull(3000L) { deferred.await() }
                  setWindowGhostMode(false)
                  return res
              }

              private fun isAdElement(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val adWords = listOf("sponsored", "विज्ञापन", "प्रायोजित", "ad ·", "ad •", "ad:", "visit site", "install now", "shop now", "promoted")
                  fun checkSubtree(n: AccessibilityNodeInfo?, depth: Int): Boolean {
                      if (n == null || depth > 4) return false
                      val combined = "${n.text ?: ""} ${n.contentDescription ?: ""} ${n.viewIdResourceName ?: ""}".lowercase()
                      if (adWords.any { combined.contains(it) } || combined.contains("ad_badge") || combined.contains("ad_attribution")) return true
                      for (i in 0 until n.childCount) if (checkSubtree(n.getChild(i), depth + 1)) return true
                      return false
                  }
                  if (checkSubtree(node, 0)) return true
                  val p1 = node.parent
                  if (p1 != null && checkSubtree(p1, 0)) return true
                  val p2 = p1?.parent
                  if (p2 != null && p2.childCount <= 8 && checkSubtree(p2, 0)) return true
                  return false
              }

              private fun findNonAdVideoResult(keywordsPipe: String): Pair<Int, Int>? {
                  val root = rootInActiveWindow ?: return null
                  val dm = resources.displayMetrics
                  val keywords = keywordsPipe.split("|", ",", " ").map { it.trim().lowercase() }.filter { it.length > 2 }
                  data class Candidate(val x: Int, val y: Int, val score: Int)
                  val candidates = mutableListOf<Candidate>()
                  fun scan(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      val r = Rect() ; node.getBoundsInScreen(r)
                      val t = (node.text ?: node.contentDescription ?: "").toString().trim()
                      if (r.centerY() in 230..(dm.heightPixels - 180) && r.width() > 180 && r.height() > 55 && t.length > 8) {
                          if ((node.isClickable || node.parent?.isClickable == true) && !isAdElement(node)) {
                              val lower = t.lowercase()
                              if (!lower.startsWith("filter") && lower != "shorts" && !lower.contains("sponsored") && !lower.contains("विज्ञापन")) {
                                  var s = 1
                                  for (kw in keywords) if (lower.contains(kw)) s += 5
                                  if (lower.contains("views") || lower.contains("ago") || lower.contains("बार देखा")) s += 8
                                  candidates.add(Candidate(r.centerX(), r.centerY(), s))
                              }
                          }
                      }
                      for (i in 0 until node.childCount) scan(node.getChild(i))
                  }
                  scan(root)
                  return candidates.maxWithOrNull(compareBy<Candidate> { it.score }.thenBy { -it.y })?.let { Pair(it.x, it.y) }
              }

              private suspend fun waitForKeywordOnScreen(keywordsPipe: String, timeoutMs: Long): Pair<Int, Int>? {
                  val keys = keywordsPipe.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < timeoutMs && isRunning) {
                      rootInActiveWindow?.let { searchKeywordInTree(it, keys)?.let { pos -> return pos } }
                      delay(250)
                  }
                  return null
              }

              private fun searchKeywordInTree(node: AccessibilityNodeInfo?, keys: List<String>): Pair<Int, Int>? {
                  if (node == null || !node.isVisibleToUser) return null
                  val r = Rect() ; node.getBoundsInScreen(r)
                  if (r.width() > 10 && r.height() > 10 && r.centerY() > 80 && !isAdElement(node)) {
                      val h = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (node.hintText ?: "").toString() else ""
                      val all = "${node.text ?: ""} ${node.contentDescription ?: ""} $h ${node.viewIdResourceName ?: ""}".lowercase()
                      for (k in keys) if (all.contains(k)) return Pair(r.centerX(), r.centerY())
                  }
                  for (i in 0 until node.childCount) searchKeywordInTree(node.getChild(i), keys)?.let { return it }
                  return null
              }

              private fun openRedmiSetting(settingName: String): Boolean {
                  return try {
                      val s = settingName.trim().lowercase()
                      val action = when {
                          s.contains("wifi") || s.contains("wi-fi") || s.contains("वाईफाई") -> Settings.ACTION_WIFI_SETTINGS
                          s.contains("bluetooth") || s.contains("ब्लूटूथ") -> Settings.ACTION_BLUETOOTH_SETTINGS
                          s.contains("hotspot") || s.contains("tether") || s.contains("हॉटस्पॉट") -> "android.settings.TETHER_SETTINGS"
                          s.contains("storage") || s.contains("स्टोरेज") -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                          s.contains("battery") || s.contains("बैटरी") -> Intent.ACTION_POWER_USAGE_SUMMARY
                          s.contains("display") || s.contains("brightness") || s.contains("डिस्प्ले") -> Settings.ACTION_DISPLAY_SETTINGS
                          s.contains("sound") || s.contains("volume") || s.contains("आवाज़") -> Settings.ACTION_SOUND_SETTINGS
                          s.contains("app") || s.contains("ऐप") -> Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS
                          s.contains("location") || s.contains("gps") -> Settings.ACTION_LOCATION_SOURCE_SETTINGS
                          s.contains("security") || s.contains("lock") -> Settings.ACTION_SECURITY_SETTINGS
                          s.contains("cast") || s.contains("screen") -> Settings.ACTION_CAST_SETTINGS
                          else -> Settings.ACTION_SETTINGS
                      }
                      startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP))
                      true
                  } catch (e: Exception) {
                      try {
                          startActivity(Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          true
                      } catch (ex: Exception) { false }
                  }
              }

              private fun fireDirectIntent(intentType: String, data: String): Boolean {
                  return try {
                      val intent = when (intentType.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply { setPackage("com.google.android.youtube") ; putExtra("query", data) }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${Uri.encode(data)}"))
                          "open_url" -> Intent(Intent.ACTION_VIEW, Uri.parse(if (data.startsWith("http")) data else "https://$data"))
                          "dial" -> Intent(Intent.ACTION_DIAL, Uri.parse("tel:${data.filter { it.isDigit() || it == '+' }}"))
                          "whatsapp_num" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/${data.filter { it.isDigit() }}"))
                          "play_store" -> Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=${Uri.encode(data)}"))
                          else -> null
                      }
                      if (intent != null) { intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP) ; startActivity(intent) ; true } else false
                  } catch (e: Exception) { false }
              }

              private fun isNetworkAvailable(): Boolean {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork ?: return false) ?: return false
                      caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } catch (e: Exception) { true }
              }

              // FIXED 403/404 ROTATION: If any model gives 403 or 404, auto-skip it and immediately run the next Flash/Live model!
              private suspend fun callGeminiAPI(prompt: String, useGoogleSearch: Boolean, base64Image: String?): JSONObject = withContext(Dispatchers.IO) {
                  if (!isNetworkAvailable()) return@withContext JSONObject().put("action", "ask_user").put("message", "इंटरनेट बंद है! कृपया डेटा या Wi-Fi चालू करें।")
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val keyList = (prefs.getString("apiKey", "") ?: "").split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  if (keyList.isEmpty()) return@withContext JSONObject().put("action", "ask_user").put("message", "पहले ऐप में Gemini API Key सेव करें!")

                  var hitRateLimit = false
                  var lastError = ""

                  for (keyAttempt in keyList.indices) {
                      val activeKey = keyList[(currentApiKeyIndex + keyAttempt) % keyList.size]
                      for (attempt in flashAndLiveModels.indices) {
                          val idx = (currentModelIndex + attempt) % flashAndLiveModels.size
                          val modelName = flashAndLiveModels[idx]
                          if (deadModels.contains(modelName)) continue
                          val searchModes = if (useGoogleSearch && base64Image == null) listOf(true, false) else listOf(false)

                          for (withSearch in searchModes) {
                              var conn: HttpURLConnection? = null
                              try {
                                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$modelName:generateContent?key=$activeKey")
                                  conn = url.openConnection() as HttpURLConnection
                                  conn.requestMethod = "POST"
                                  conn.setRequestProperty("Content-Type", "application/json")
                                  conn.connectTimeout = 8000 ; conn.readTimeout = 14000 ; conn.doOutput = true

                                  val partsArray = JSONArray().apply {
                                      put(JSONObject().put("text", prompt))
                                      if (!base64Image.isNullOrEmpty()) {
                                          put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", base64Image)))
                                      }
                                  }
                                  val body = JSONObject().apply {
                                      put("contents", JSONArray().put(JSONObject().put("parts", partsArray)))
                                      if (withSearch) put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                                      else put("generationConfig", JSONObject().put("responseMimeType", "application/json").put("temperature", 0.1))
                                  }

                                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                                  val code = conn.responseCode
                                  if (code == 200) {
                                      currentModelIndex = idx
                                      currentApiKeyIndex = (currentApiKeyIndex + keyAttempt) % keyList.size
                                      val resText = conn.inputStream.bufferedReader().readText()
                                      val parts = JSONObject(resText).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                                      var fullReply = ""
                                      for (p in 0 until parts.length()) fullReply += parts.getJSONObject(p).optString("text", "")
                                      saveBrainLog("OK [$modelName]")
                                      return@withContext extractJsonObject(fullReply)
                                  } else if (code == 400 && withSearch) continue
                                  else if (code == 429) { hitRateLimit = true ; break }
                                  else if (code == 404 || code == 403) {
                                      val errStr = conn.errorStream?.bufferedReader()?.readText() ?: ""
                                      if (errStr.contains("API_KEY_INVALID", true) || errStr.contains("key not valid", true)) {
                                          lastError = "API Key Invalid" ; break
                                      }
                                      deadModels.add(modelName)
                                      lastError = "$modelName ($code)"
                                      break
                                  } else {
                                      lastError = "$modelName ($code)" ; break
                                  }
                              } catch (e: Exception) {
                                  lastError = e.message ?: "Timeout"
                                  if (!withSearch) break
                              } finally {
                                  try { conn?.disconnect() } catch (e: Exception) {}
                              }
                          }
                      }
                  }
                  if (hitRateLimit) return@withContext JSONObject().put("action", "rate_limit")
                  return@withContext JSONObject().put("action", "ask_user").put("message", "API Error: $lastError")
              }

              private fun extractJsonObject(raw: String): JSONObject {
                  val clean = raw.replace("```json", "").replace("```", "").trim()
                  val objStart = clean.indexOf('{') ; val objEnd = clean.lastIndexOf('}')
                  if (objStart != -1 && objEnd != -1 && objEnd > objStart) {
                      try { return JSONObject(clean.substring(objStart, objEnd + 1)) } catch (e: Exception) {}
                  }
                  val arrStart = clean.indexOf('[') ; val arrEnd = clean.lastIndexOf(']')
                  if (arrStart != -1 && arrEnd != -1 && arrEnd > arrStart) {
                      try { return JSONObject().put("steps", JSONArray(clean.substring(arrStart, arrEnd + 1))) } catch (e: Exception) {}
                  }
                  return JSONObject().put("action", "wait")
              }

              private fun getCoordsForTarget(id: Int, x: Int, y: Int): Pair<Int, Int> {
                  nodeMap[id]?.let { n ->
                      val r = Rect() ; n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) return Pair(r.centerX(), r.centerY())
                  }
                  val dm = resources.displayMetrics
                  return Pair(if (x > 0) x else dm.widthPixels / 2, if (y > 0) y else dm.heightPixels / 2)
              }

              private suspend fun performSmartClick(id: Int, x: Int, y: Int) {
                  nodeMap[id]?.let { n ->
                      val r = Rect() ; n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) { performTap(r.centerX().toFloat(), r.centerY().toFloat()) ; return }
                      var curr: AccessibilityNodeInfo? = n
                      while (curr != null) {
                          if (curr.isClickable) { curr.performAction(AccessibilityNodeInfo.ACTION_CLICK) ; return }
                          curr = curr.parent
                      }
                  }
                  if (x > 0 && y > 0) performTap(x.toFloat(), y.toFloat())
              }

              private suspend fun performSmartType(id: Int, x: Int, y: Int, text: String, pressEnter: Boolean): Boolean {
                  val explicitNode = nodeMap[id]
                  if (id > 0 || (x > 0 && y > 0)) {
                      val c = getCoordsForTarget(id, x, y)
                      performTap(c.first.toFloat(), c.second.toFloat()) ; delay(650)
                  }
                  val root = rootInActiveWindow ?: return false
                  val targetNode = if (explicitNode != null && explicitNode.isEditable) explicitNode else findEditableNode(root)
                  if (targetNode != null) {
                      targetNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                      var typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                      if (!typed) { copyToClipboard(text) ; typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_PASTE) }
                      if (pressEnter) {
                          delay(380)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              targetNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                          }
                      }
                      return typed
                  }
                  return false
              }

              private fun findEditableNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var focused: AccessibilityNodeInfo? = null ; var any: AccessibilityNodeInfo? = null
                  fun search(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      if (node.isEditable) {
                          if (node.isFocused || node.isAccessibilityFocused) { focused = node ; return }
                          if (any == null) any = node
                      }
                      for (i in 0 until node.childCount) { search(node.getChild(i)) ; if (focused != null) return }
                  }
                  search(root)
                  return focused ?: any
              }

              private fun readScreenElementsWithSignature(): Pair<String, String> {
                  nodeMap.clear()
                  val root = rootInActiveWindow ?: return Pair("Screen khali hai", "empty")
                  val dm = resources.displayMetrics
                  val list = mutableListOf<String>()
                  val sig = StringBuilder()
                  val pkg = root.packageName?.toString() ?: "unknown"
                  list.add("Current App Package: $pkg") ; sig.append(pkg)
                  var nextId = 1

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || nextId > 135) return
                      if (pkg == "com.google.android.youtube" && isAdElement(node)) return

                      val rect = Rect() ; node.getBoundsInScreen(rect)
                      val text = (node.text ?: node.contentDescription ?: "").toString().trim()
                      val hint = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) (node.hintText ?: "").toString().trim() else ""
                      val idName = (node.viewIdResourceName ?: "").substringAfterLast("/")
                      val isClick = node.isClickable || (node.parent?.isClickable == true)
                      val isEdit = node.isEditable ; val isPass = node.isPassword ; val isCheck = node.isCheckable

                      if (text.isNotEmpty() || hint.isNotEmpty() || isEdit || isPass || isCheck || (isClick && idName.isNotEmpty())) {
                          val cx = rect.centerX() ; val cy = rect.centerY()
                          if (cx in 5..(dm.widthPixels - 5) && cy in 75..(dm.heightPixels - 15) && rect.width() > 10 && rect.height() > 10) {
                              if (!isAdElement(node)) {
                                  val tag = when {
                                      isPass -> "[PASSWORD_BOX]"
                                      isEdit -> "[INPUT_BOX]"
                                      isCheck -> if (node.isChecked) "[SWITCH_ON]" else "[SWITCH_OFF]"
                                      isClick -> "[BUTTON]"
                                      else -> "[TEXT]"
                                  }
                                  val rawLabel = if (text.isNotEmpty()) text else hint
                                  val cleanText = rawLabel.replace("\n", " ").replace("\"", "'").take(90)
                                  val idHint = if (idName.isNotEmpty()) " ($idName)" else ""
                                  val id = nextId++
                                  nodeMap[id] = node
                                  list.add("#$id$tag '$cleanText'$idHint at (x=$cx, y=$cy)")
                                  sig.append("|").append(tag).append(idName).append(cx / 40).append(cy / 40)
                              }
                          }
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }
                  traverse(root)
                  return Pair(list.joinToString("\n"), sig.toString())
              }

