              fun pasteCodeToGitHubAndOpenActions() {
                  agentJob?.cancel() ; isRunning = true ; autoCollapseBar(false)
                  agentJob = scope.launch {
                      val rawClip = getClipboardText()
                      val cleanKotlin = YantraBrain.extractPureBrainKotlin(rawClip) ?: rawClip
