              // CEO STRATEGY + ZERO-ERROR AUTONOMOUS ENGINE
              private fun startSmartAutonomousGoal() {
                  agentJob?.cancel()
                  isRunning = true
                  history.clear()
                  failedTargets.clear()
                  researchedContext = ""
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      statusTv.setTextColor(Color.parseColor("#38BDF8"))
                      statusTv.text = "👑 CEO Brain: Google से रिसर्च और मास्टर प्लान बना रहा हूँ..."

                      val installedApps = getInstalledAppNames()
                      val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                      val vaultSummary = getPersonalVaultSummary()

                      // PHASE 1: Deep Research + Strategy & Action Plan
                      val masterPlan = researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, currentPkg)
                      if (!isRunning) return@launch

                      val understood = masterPlan.optString("understood_goal", currentGoal)
                      researchedContext = masterPlan.optString("researched_info", "")
                      val missionPlanToSave = masterPlan.optString("save_mission_plan", "")
                      val clipboardContent = masterPlan.optString("copy_to_clipboard", "")
                      val speakMsg = masterPlan.optString("speak", "मैंने पूरा प्लान बना लिया है, काम शुरू कर रहा हूँ")

                      if (missionPlanToSave.isNotBlank()) {
                          getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                              .edit().putString("activeMission", missionPlanToSave).apply()
                      }
                      if (clipboardContent.isNotBlank()) {
                          copyToClipboard(clipboardContent)
                      }

                      speakOut(speakMsg)
                      currentGoal = understood

                      if (researchedContext.isNotEmpty()) {
                          statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                          statusTv.text = "💡 रणनीति: $researchedContext"
                          delay(900)
                      }

                      val stepQueue = mutableListOf<JSONObject>()
                      val initialSteps = masterPlan.optJSONArray("steps")
                      if (initialSteps != null) {
                          for (i in 0 until initialSteps.length()) {
                              stepQueue.add(initialSteps.getJSONObject(i))
                          }
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastScreenHash = ""

                      // PHASE 2: Zero-Error Execution Loop with Before/After Verification & Hybrid Vision
                      while (isRunning) {
                          while (stepQueue.isNotEmpty() && isRunning) {
                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")

                              if (act == "done") {
                                  val doneMsg = step.optString("message", "काम पूरा हो गया!")
                                  speakOut(doneMsg)
                                  vibratePhone()
                                  stopAgent("✅ $doneMsg")
                                  return@launch
                              }

                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "भाई, यहाँ OTP/PIN या आपकी बातचीत ज़रूरी है, पूरा करके ▶ दबाएँ")
                                  speakOut(askMsg)
                                  vibratePhone()
                                  pauseForUser("🤝 Co-Pilot: $askMsg")
                                  return@launch
                              }

                              val ok = executeLocalStepWithVerification(step)
                              if (!ok) {
                                  stepQueue.clear()
                                  break
                              }
                          }

                          if (!isRunning) break

                          aiConsultCount++
                          if (aiConsultCount > 18) {
                              stopAgent("✅ मिशन के इस चरण का काम पूरा हो गया!")
                              break
                          }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "👁️ Zero-Error Check: स्क्रीन वेरीफाई कर रहा हूँ..."
                          delay(650)

                          val screenSnapshot = readScreenElements()
                          val currentHash = screenSnapshot.hashCode().toString()
                          if (currentHash == lastScreenHash) {
                              stuckCount++
                          } else {
                              stuckCount = 0
                              lastScreenHash = currentHash
                          }

                          // Agar screen complex hai ya stuckCount > 0 hai, toh Live Screenshot Vision bhi bhejo!
                          val needVision = stuckCount >= 1 || screenSnapshot.lines().size < 6
                          val screenshotB64 = if (needVision) captureScreenBase64() else null

                          val nextBatch = planNextBatchFromScreen(
                              currentGoal,
                              researchedContext,
                              vaultSummary,
                              screenSnapshot,
                              screenshotB64
                          )
                          if (!isRunning) break

                          val newClip = nextBatch.optString("copy_to_clipboard", "")
                          if (newClip.isNotBlank()) copyToClipboard(newClip)

                          val updatedMission = nextBatch.optString("save_mission_plan", "")
                          if (updatedMission.isNotBlank()) {
                              getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                                  .edit().putString("activeMission", updatedMission).apply()
                          }

                          val topAct = nextBatch.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ 6 सेकंड इंतज़ार..."
                              delay(6000)
                              continue
                          } else if (topAct == "done") {
                              val m = nextBatch.optString("message", "काम पूरा हो गया!")
                              speakOut(m)
                              vibratePhone()
                              stopAgent("✅ $m")
                              break
                          } else if (topAct == "ask_user") {
                              val m = nextBatch.optString("message", "यहाँ आपका इनपुट चाहिए, पूरा करके ▶ दबाएँ")
                              speakOut(m)
                              vibratePhone()
                              pauseForUser("🤝 Co-Pilot: $m")
                              break
                          }

                          val batchSpeak = nextBatch.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextBatch.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) {
                                  stepQueue.add(arr.getJSONObject(i))
                              }
                          } else if (topAct.isNotEmpty()) {
                              stepQueue.add(nextBatch)
                          } else {
                              stopAgent("✅ काम पूरा हो गया!")
                              break
                          }
                      }
                  }
              }

              // ZERO-ERROR STEP EXECUTOR (Checks Before & After state)
              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  history.add("$action($reason)")
                  if (history.size > 15) history.removeAt(0)

                  when (action) {
                      "open_app" -> {
                          val appName = step.optString("app_name", target)
                          val opened = openAppByName(appName)
                          delay(2500)
                          return opened
                      }
                      "direct_intent" -> {
                          val intentType = step.optString("intent_type", "")
                          val data = step.optString("data", text)
                          val ok = fireDirectIntent(intentType, data)
                          delay(2600)
                          return ok
                      }
                      "write_content" -> {
                          // AI dwara banaya gaya content ya Vault data clipboard mein copy aur paste karna
                          copyToClipboard(text)
                          val pressEnter = step.optBoolean("press_enter", false)
                          val ok = performSmartType(targetId, x, y, text, pressEnter)
                          delay(1600)
                          return ok
                      }
                      "scroll_loop" -> {
                          val direction = step.optString("direction", "up")
                          val intervalSec = step.optInt("interval_sec", 4).coerceIn(2, 15)
                          val maxCount = step.optInt("count", 200)
                          for (i in 1..maxCount) {
                              if (!isRunning) break
                              statusTv.setTextColor(Color.parseColor("#4ADE80"))
                              statusTv.text = "🔄 लगातार स्क्रॉल (#$i) — रोकने के लिए ⏹ दबाएँ"
                              performSwipe(direction)
                              delay(intervalSec * 1000L)
                          }
                          return true
                      }
                      "scroll_down" -> {
                          val times = step.optInt("times", 1).coerceIn(1, 8)
                          for (i in 1..times) {
                              if (!isRunning) break
                              performSwipe("up")
                              delay(1300)
                          }
                          return true
                      }
                      "scroll_up" -> {
                          performSwipe("down")
                          delay(1300)
                          return true
                      }
                      "click" -> {
                          val beforePkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          if (targetId > 0 || (x > 0 && y > 0)) {
                              performSmartClick(targetId, x, y)
                              delay(1700)
                              val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                              // Agar YouTube/App se achanak browser ad khul gaya ho, toh warn history mein daalo
                              if (beforePkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                                  failedTargets.add("($x,$y)")
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  delay(1200)
                                  return false
                              }
                              return true
                          }
                          if (target.isNotEmpty()) {
                              val coords = waitForKeywordOnScreen(target, 3000L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(1700)
                                  return true
                              }
                          }
                          return false
                      }
                      "click_best_video" -> {
                          delay(1400)
                          val matchKw = step.optString("match_keywords", target)
                          val pos = findNonAdVideoResult(matchKw)
                          if (pos != null) {
                              performTap(pos.first.toFloat(), pos.second.toFloat())
                              delay(2000)
                              return true
                          }
                          performSwipe("up")
                          delay(1400)
                          val posAfterScroll = findNonAdVideoResult(matchKw)
                          if (posAfterScroll != null) {
                              performTap(posAfterScroll.first.toFloat(), posAfterScroll.second.toFloat())
                              delay(2000)
                              return true
                          }
                          return false
                      }
                      "type" -> {
                          val pressEnter = step.optBoolean("press_enter", true)
                          if (target.isNotEmpty() && targetId <= 0 && x <= 0) {
                              val coords = waitForKeywordOnScreen(target, 2500L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(750)
                              }
                          }
                          val ok = performSmartType(targetId, x, y, text, pressEnter)
                          delay(2100)
                          return ok
                      }
                      "system_control" -> {
                          val cmd = step.optString("command", target)
                          executeSystemControl(cmd)
                          delay(1200)
                          return true
                      }
                      "back" -> {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(1200)
                          return true
                      }
                      "home" -> {
                          performGlobalAction(GLOBAL_ACTION_HOME)
                          delay(1200)
                          return true
                      }
                      "wait" -> {
                          val sec = step.optInt("seconds", 3).coerceIn(1, 15)
                          delay(sec * 1000L)
                          return true
                      }
                  }
                  return false
              }

              // Live Screenshot Vision (API 30+ / Android 11+)
              private suspend fun captureScreenBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val deferred = CompletableDeferred<String?>()
                  try {
                      setWindowGhostMode(true)
                      delay(50)
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(screenshot: ScreenshotResult) {
                              try {
                                  val buffer = screenshot.hardwareBuffer
                                  val bmp = Bitmap.wrapHardwareBuffer(buffer, screenshot.colorSpace)
                                  val soft = bmp?.copy(Bitmap.Config.ARGB_8888, false)
                                  buffer.close()
                                  bmp?.recycle()
                                  if (soft != null) {
                                      val scaled = Bitmap.createScaledBitmap(soft, 540, 1080, true)
                                      soft.recycle()
                                      val out = ByteArrayOutputStream()
                                      scaled.compress(Bitmap.CompressFormat.JPEG, 62, out)
                                      scaled.recycle()
                                      val b64 = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                                      deferred.complete(b64)
                                  } else {
                                      deferred.complete(null)
                                  }
                              } catch (_: Exception) {
                                  deferred.complete(null)
                              }
                          }
                          override fun onFailure(errorCode: Int) {
                              deferred.complete(null)
                          }
                      })
                  } catch (_: Exception) {
                      setWindowGhostMode(false)
                      return null
                  }
                  val res = withTimeoutOrNull(3200L) { deferred.await() }
                  setWindowGhostMode(false)
                  return res
              }

              private fun isAdElement(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  val adWords = listOf(
                      "sponsored", "विज्ञापन", "प्रायोजित", "ad ·", "ad •",
                      "visit site", "install now", "shop now", "sign up"
                  )
                  fun checkSubtree(n: AccessibilityNodeInfo?, depth: Int): Boolean {
                      if (n == null || depth > 3) return false
                      val t = (n.text ?: "").toString().lowercase()
                      val d = (n.contentDescription ?: "").toString().lowercase()
                      val id = (n.viewIdResourceName ?: "").substringAfterLast("/").lowercase()
                      val combined = "$t $d $id"
                      if (adWords.any { combined.contains(it) } || id.contains("ad_badge") || id.contains("promoted")) {
                          return true
                      }
                      for (i in 0 until n.childCount) {
                          if (checkSubtree(n.getChild(i), depth + 1)) return true
                      }
                      return false
                  }
                  if (checkSubtree(node, 0)) return true
                  if (node.parent != null && checkSubtree(node.parent, 0)) return true
                  return false
              }

              private fun findNonAdVideoResult(keywordsPipe: String): Pair<Int, Int>? {
                  val root = rootInActiveWindow ?: return null
                  val dm = resources.displayMetrics
                  val keywords = keywordsPipe.split("|", ",", " ")
                      .map { it.trim().lowercase() }
                      .filter { it.length > 2 }

                  data class Candidate(val x: Int, val y: Int, val score: Int)
                  val candidates = mutableListOf<Candidate>()

                  fun scan(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      val r = Rect()
                      node.getBoundsInScreen(r)
                      val t = (node.text ?: node.contentDescription ?: "").toString().trim()

                      if (r.centerY() in 230..(dm.heightPixels - 200) && r.width() > 180 && r.height() > 55 && t.length > 8) {
                          if ((node.isClickable || node.parent?.isClickable == true) && !isAdElement(node)) {
                              val lower = t.lowercase()
                              if (!lower.startsWith("filter") && !lower.equals("shorts")) {
                                  var matchScore = 1
                                  for (kw in keywords) {
                                      if (lower.contains(kw)) matchScore += 5
                                  }
                                  if (lower.contains("views") || lower.contains("minute") || lower.contains("ago") || lower.contains("बार देखा")) {
                                      matchScore += 8
                                  }
                                  candidates.add(Candidate(r.centerX(), r.centerY(), matchScore))
                              }
                          }
                      }
                      for (i in 0 until node.childCount) scan(node.getChild(i))
                  }
                  scan(root)
                  val best = candidates.maxWithOrNull(compareBy<Candidate> { it.score }.thenBy { -it.y })
                  return best?.let { Pair(it.x, it.y) }
              }

              private suspend fun waitForKeywordOnScreen(keywordsPipe: String, timeoutMs: Long): Pair<Int, Int>? {
                  val keys = keywordsPipe.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < timeoutMs && isRunning) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          val found = searchKeywordInTree(root, keys)
                          if (found != null) return found
                      }
                      delay(300)
                  }
                  return null
              }

              private fun searchKeywordInTree(node: AccessibilityNodeInfo?, keys: List<String>): Pair<Int, Int>? {
                  if (node == null || !node.isVisibleToUser) return null
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  if (r.width() > 10 && r.height() > 10 && r.centerY() > 35) {
                      val t = (node.text ?: "").toString().lowercase()
                      val d = (node.contentDescription ?: "").toString().lowercase()
                      val id = (node.viewIdResourceName ?: "").substringAfterLast("/").lowercase()
                      val all = "$t $d $id"
                      for (k in keys) {
                          if (all.contains(k)) return Pair(r.centerX(), r.centerY())
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val sub = searchKeywordInTree(node.getChild(i), keys)
                      if (sub != null) return sub
                  }
                  return null
              }

              private fun fireDirectIntent(type: String, data: String): Boolean {
                  return try {
                      val intent = when (type.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply {
                              setPackage("com.google.android.youtube")
                              putExtra("query", data)
                          }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${Uri.encode(data)}"))
                          "open_url" -> {
                              val url = if (data.startsWith("http")) data else "https://$data"
                              Intent(Intent.ACTION_VIEW, Uri.parse(url))
                          }
                          "dial" -> Intent(Intent.ACTION_DIAL, Uri.parse("tel:${data.filter { it.isDigit() || it == '+' }}"))
                          else -> null
                      }
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                          true
                      } else false
                  } catch (_: Exception) {
                      false
                  }
              }

