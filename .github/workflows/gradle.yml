name: Build Yantra Twin AI APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Modular Project (Build #57 Method)
        run: |
          BRAIN_PATH="app/src/main/java/com/ai/phoneagent/YantraBrain.kt"
          rm -f /tmp/custom_brain.kt
          if [ -f "$BRAIN_PATH" ] && grep -q "object YantraBrain" "$BRAIN_PATH" && ! grep -q "27.0-MODULAR" "$BRAIN_PATH" && ! grep -q "27.1-MODULAR" "$BRAIN_PATH"; then
            cp "$BRAIN_PATH" /tmp/custom_brain.kt
          fi

          # Clean entire app directory just like Build #57 so old repo files never conflict!
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          if [ ! -f yantra.keystore ]; then
            keytool -genkey -v -keystore yantra.keystore -alias yantra -keyalg RSA -keysize 2048 -validity 10000 -storepass yantra123 -keypass yantra123 -dname "CN=YantraAI, OU=DevLab, O=Yantra, L=Patna, S=Bihar, C=IN"
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "YantraAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.yantra"
                  minSdk 26
                  targetSdk 34
                  versionCode 38
                  versionName "28.1-OMEGA-MODULAR"
              }
              signingConfigs {
                  yantraSign {
                      storeFile file("../yantra.keystore")
                      storePassword "yantra123"
                      keyAlias "yantra"
                      keyPassword "yantra123"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.yantraSign }
                  release { signingConfig signingConfigs.yantraSign ; minifyEnabled false }
              }
              flavorDimensions "tier"
              productFlavors {
                  alpha {
                      dimension "tier"
                      applicationId "com.ai.yantra.alpha"
                      resValue "string", "app_name", "Yantra Alpha (यंत्र A)"
                  }
                  beta {
                      dimension "tier"
                      applicationId "com.ai.yantra.beta"
                      resValue "string", "app_name", "Yantra Beta (यंत्र B)"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="SCHEMA_URL">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceActivity" android:exported="false" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service android:name=".AgentService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="SCHEMA_URL"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="15" />
          EOF

          S_HTTP="http"
          sed -i "s|SCHEMA_URL|$S_HTTP://schemas.android.com/apk/res/android|g" app/src/main/AndroidManifest.xml app/src/main/res/xml/accessibility_config.xml

          cat << 'EOF' > /tmp/default_brain.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.media.AudioManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object YantraBrain {
              const val BRAIN_VERSION = "28.1-OMEGA-MODULAR"

              val extraAppAliases = mapOf(
                  "studio" to "com.google.android.apps.youtube.creator",
                  "yt studio" to "com.google.android.apps.youtube.creator",
                  "seller" to "com.amazon.sellermobile.android",
                  "amazon seller" to "com.amazon.sellermobile.android",
                  "flipkart seller" to "com.flipkart.seller",
                  "truecaller" to "com.truecaller",
                  "meesho" to "com.meesho.supply",
                  "zepto" to "com.zeptoconsumerapp",
                  "blinkit" to "com.grofers.customerapp",
                  "whatsapp business" to "com.whatsapp.w4b",
                  "paytm business" to "net.one97.merchant",
                  "telegram" to "org.telegram.messenger",
                  "spotify" to "com.spotify.music",
                  "jio" to "com.jio.myjio",
                  "airtel" to "com.myairtelapp",
                  "canva" to "com.canva.editor"
              )

              fun handleCustomReflex(g: String, service: AgentService): Boolean {
                  val audio = service.getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                  when {
                      g.contains("battery") || g.contains("storage") || g.contains("ram kitn") || g.contains("स्टोरेज") || g.contains("बैटरी") -> {
                          if (!g.contains("setting") && !g.contains("khol") && !g.contains("open")) {
                              val report = service.getRedmiPhoneStatus(true)
                              service.speakOut(report)
                              service.stopAgent("📲 $report")
                              return true
                          }
                      }
                      g.contains("time kya") || g.contains("samay kya") || g.contains("kitne baje") || g.contains("टाइम क्या") || g.contains("aaj ki date") -> {
                          val nowStr = SimpleDateFormat("hh:mm a, EEEE, dd MMMM", Locale.getDefault()).format(Date())
                          service.speakOut("Abhi samay hai $nowStr")
                          service.stopAgent("🕒 $nowStr")
                          return true
                      }
                      g.contains("flashlight") || g.contains("torch") || g.contains("टॉर्च") -> {
                          val turnOff = g.contains("off") || g.contains("band") || g.contains("बंद")
                          service.executeSystemControl(if (turnOff) "torch_off" else "torch_on")
                          service.speakOut(if (turnOff) "Torch band" else "Torch chalu")
                          service.stopAgent(if (turnOff) "🔦 Torch OFF!" else "🔦 Torch ON!")
                          return true
                      }
                      g.contains("screenshot") || g.contains("स्क्रीनशॉट") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT)
                          service.speakOut("Screenshot le liya gaya hai")
                          service.stopAgent("📸 Screenshot Captured!")
                          return true
                      }
                      g.contains("notification") || g.contains("नोटिफिकेशन") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS)
                          service.stopAgent("🔔 Notifications Opened!")
                          return true
                      }
                      g.contains("control center") || g.contains("quick setting") || g.contains("कंट्रोल सेंटर") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS)
                          service.stopAgent("🎛️ Control Center Opened!")
                          return true
                      }
                      g.contains("recent app") || g.contains("रीसेंट") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_RECENTS)
                          service.stopAgent("🗂️ Recent Apps!")
                          return true
                      }
                      g == "back" || g == "back karo" || g.contains("पीछे जाओ") || g.contains("बैक करो") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)
                          service.stopAgent("🔙 Back!")
                          return true
                      }
                      g == "home" || g == "home chalo" || g.contains("होम स्क्रीन") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME)
                          service.stopAgent("🏠 Home Screen!")
                          return true
                      }
                      g.contains("volume up") || g.contains("aawaz badha") || g.contains("full aawaz") || g.contains("आवाज़ बढ़ा") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          audio?.adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          service.speakOut("Aawaz badha di hai")
                          service.stopAgent("🔊 Volume Up!")
                          return true
                      }
                      g.contains("volume down") || g.contains("aawaz kam") || g.contains("आवाज़ कम") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          audio?.adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          service.speakOut("Aawaz kam kar di hai")
                          service.stopAgent("🔉 Volume Down!")
                          return true
                      }
                      g.contains("mute") || g.contains("silent karo") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI)
                          service.stopAgent("🔇 Audio Muted!")
                          return true
                      }
                      (g.contains("youtube par ") || g.contains("यूट्यूब पर ")) && (g.contains("search") || g.contains("chala") || g.contains("play") || g.contains("चलाओ")) -> {
                          val q = g.replace("youtube par", "").replace("यूट्यूब पर", "").replace("search karo", "").replace("chalao", "").replace("chala do", "").replace("play karo", "").replace("चलाओ", "").trim()
                          if (q.length >= 2) {
                              service.fireDirectIntent("youtube_search", q)
                              service.speakOut("YouTube par $q khol diya hai")
                              service.stopAgent("▶️ YouTube Search: '$q'")
                              return true
                          }
                      }
                      (g.contains("google par ") || g.contains("गूगल पर ")) && g.contains("search") -> {
                          val q = g.replace("google par", "").replace("गूगल पर", "").replace("search karo", "").replace("search", "").trim()
                          if (q.length >= 2) {
                              service.fireDirectIntent("web_search", q)
                              service.speakOut("Google par $q search kar diya hai")
                              service.stopAgent("🌐 Google Search: '$q'")
                              return true
                          }
                      }
                      g.contains("wifi setting") || g.contains("bluetooth setting") || g.contains("storage setting") || g.contains("display setting") -> {
                          service.openRedmiSetting(g)
                          service.speakOut("Setting khol di hai")
                          service.stopAgent("⚙️ Setting Opened!")
                          return true
                      }
                      g.contains("clear cache") || g.contains("boost speed") -> {
                          service.speakOut("Yantra cache aur memory optimize ho gayi hai")
                          service.stopAgent("⚡ Memory & Cache Optimized!")
                          return true
                      }
                  }
                  return false
              }

              fun buildMegaAuditPrompt(
                  myVariant: String,
                  targetTwin: String,
                  cacheTimeMs: Long,
                  appCount: Int,
                  aiCount: Int,
                  modelName: String,
                  apiLatencyMs: Long,
                  recentLogs: String,
                  failedList: String,
                  customFeatureRequest: String
              ): String {
                  return buildString {
                      append("Bhai, main $myVariant ($BRAIN_VERSION) bol raha hoon. Maine apna Mega-Audit poora kar liya hai:\n")
                      append("• Cache Speed: ${cacheTimeMs}ms ($appCount apps,$aiCount AI apps)\n")
                      append("• Active Model Latency: $modelName (${apiLatencyMs}ms)\n")
                      append("• Brain Logs: $recentLogs\n")
                      append("• Failed Clicks / Bottlenecks: $failedList\n")
                      if (customFeatureRequest.isNotEmpty()) append("• User Priority Request: $customFeatureRequest\n")
                      append("\n🚨 IMPORTANT MODULAR RULE:\n")
                      append("Ab humein 1300 line ka gradle.yml NAHI chahiye! ")
                      append("Kripya ek hi baar mein 5 naye smart offline commands/features aur speed optimizations jodkar SIRF YantraBrain.kt (package com.ai.phoneagent se lekar aakhiri } tak) ka 100% complete single-box Kotlin code do taaki main usse seedha GitHub par commit kar sakoon!")
                  }
              }

              fun extractPureBrainKotlin(raw: String): String? {
                  val clean = raw.replace("```kotlin", "").replace("```java", "").replace("```", "").trim()
                  val startIdx = clean.indexOf("package com.ai.phoneagent")
                  if (startIdx == -1) return null
                  if (!clean.contains("object YantraBrain")) return null
                  val endIdx = clean.lastIndexOf('}')
                  if (endIdx == -1 || endIdx <= startIdx) return null
                  return clean.substring(startIdx, endIdx + 1).trim()
              }

              fun buildActionPrompt(
                  dmWidth: Int, dmHeight: Int, redmiStatus: String, nowTime: String,
                  goal: String, corr: String, researchedInfo: String, notesSoFar: String,
                  aiAppsOnPhone: String, installedApps: String, vaultSummary: String,
                  latestNotif: String, historyStr: String, failedStr: String, stuckCount: Int, screen: String
              ): String {
                  return """
                      You are Yantra AI ($BRAIN_VERSION) controlling Xiaomi Redmi Note 10S (${dmWidth}x${dmHeight} px).
                      HARDWARE: $redmiStatus | TIME: $nowTime
                      MAIN GOAL: "$goal" | $corr
                      RESEARCHED: "$researchedInfo" | MULTI-APP NOTES: "$notesSoFar"
                      AI APPS: $aiAppsOnPhone | ALL APPS: $installedApps
                      VAULT & RULES: "$vaultSummary" | NOTIF: "$latestNotif"
                      HISTORY: $historyStr | BLACKLISTED: $failedStr | STUCK: $stuckCount
                      SCREEN ELEMENTS:
                      $screen

                      RULES:
                      1. Chain 2 to 4 fast actions in "steps" whenever possible.
                      2. For multi-app research, visit AI apps one by one, save key points in "save_note", then return "action":"done" with full summary.
                      3. Output ONLY valid JSON:
                      {"chosen_button_info":"...","next_step_plan":"...","save_note":"...","speak":"short Hindi","steps":[{"action":"open_app|type|click|open_setting|direct_intent|scroll_down|scroll_up|system_control|back|home","id":1,"x":540,"y":300,"app_name":"...","target":"...","text":"...","press_enter":true,"reason":"..."}]}
                  """.trimIndent()
              }
          }
          EOF

          if [ -f /tmp/custom_brain.kt ]; then
            cp /tmp/custom_brain.kt "$BRAIN_PATH"
          else
            cp /tmp/default_brain.kt "$BRAIN_PATH"
          fi

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : AppCompatActivity() {
              private val uiScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private val backupKeys = listOf("apiKey", "githubToken", "vaultName", "vaultContact", "vaultUpi", "vaultSkills", "userMemory", "activeMission", "learnedPaths", "dynamicRules", "verifiedModels", "lastFastModel")
              private val httpsPrefix = "https" + "://"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)

                  val incomingJson = intent?.getStringExtra("EXTRA_TWIN_SYNC_JSON")
                  if (!incomingJson.isNullOrEmpty()) {
                      try {
                          val obj = JSONObject(incomingJson)
                          val ed = prefs.edit()
                          backupKeys.forEach { k ->
                              val v = obj.optString(k, "")
                              if (v.isNotEmpty()) ed.putString(k, v)
                          }
                          ed.apply()
                          Toast.makeText(this, "✅ Twin App se saara Data Auto-Transfer ho gaya!", Toast.LENGTH_LONG).show()
                          AgentService.instance?.activateAfterTwinHandover()
                          if (intent?.getBooleanExtra("EXTRA_AUTO_RUN_TEST", false) == true) {
                              uiScope.launch {
                                  delay(600)
                                  AgentService.instance?.runSelfDiagnosticAndImprove(openGeminiChat = false)
                              }
                          }
                      } catch (e: Exception) {}
                  }

                  val isAlpha = packageName.contains("alpha")
                  val twinPkg = if (isAlpha) "com.ai.yantra.beta" else "com.ai.yantra.alpha"
                  val myTitle = if (isAlpha) "🔱 YANTRA ALPHA (Master Dev A)" else "🔱 YANTRA BETA (Twin Tester B)"

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0F172A")) }
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL ; setPadding(42, 50, 42, 50) }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#38BDF8") {
                      layout.addView(TextView(this@MainActivity).apply { text = txt ; textSize = size ; setTextColor(Color.parseColor(color)) ; setPadding(0, 16, 0, 8) })
                  }
                  fun makeInput(hintTxt: String, key: String, isSecret: Boolean = false): EditText {
                      val et = EditText(this@MainActivity).apply {
                          hint = hintTxt ; setHintTextColor(Color.GRAY) ; setTextColor(Color.WHITE)
                          setText(prefs.getString(key, ""))
                          if (isSecret) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      }
                      layout.addView(et)
                      return et
                  }
                  fun addBtn(txt: String, onClick: () -> Unit) {
                      layout.addView(Button(this@MainActivity).apply { text = txt ; setOnClickListener { onClick() } })
                  }

                  addLabel("$myTitle — ${YantraBrain.BRAIN_VERSION}\n(100% Zero-Touch Auto-Coder + Modular YantraBrain.kt)", 18f, "#38BDF8")
                  val apiInput = makeInput("Yahan Gemini API Key daalein (AIzaSy...)", "apiKey", isSecret = true)
                  val ghTokenInput = makeInput("GitHub Token (ghp_...) 1-Sec Background Auto-Commit ke liye", "githubToken", isSecret = true)
                  val keyStatusTv = TextView(this).apply {
                      text = "✅ v28.1 Ready: Report bhejne ke baad rukega nahi, khud code lekar GitHub YantraBrain.kt mein dale-ga!"
                      setTextColor(Color.parseColor("#4ADE80")) ; textSize = 12f ; setPadding(0, 4, 0, 8)
                  }
                  layout.addView(keyStatusTv)

                  addBtn("🔑 Get New Free API Key (Google AI Studio)") {
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("${httpsPrefix}[aistudio.google.com/app/apikey](https://aistudio.google.com/app/apikey)")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (e: Exception) {}
                  }

                  addBtn("💾 Save Keys & Live Test Speed") {
                      val raw = apiInput.text.toString()
                      val extracted = Regex("AIza[0-9A-Za-z_-]{30,45}").findAll(raw).map { it.value }.distinct().toList()
                      val finalKey = if (extracted.isNotEmpty()) extracted.joinToString(",") else raw.replace("\\s".toRegex(), "")
                      val ghTok = ghTokenInput.text.toString().trim()
                      prefs.edit().putString("apiKey", finalKey).putString("githubToken", ghTok).apply()
                      apiInput.setText(finalKey)
                      if (!finalKey.startsWith("AIza")) {
                          keyStatusTv.setTextColor(Color.parseColor("#F87171"))
                          keyStatusTv.text = "⚠️ Dhyan dein: Key 'AIza' se shuru honi chahiye!"
                          return@addBtn
                      }
                      keyStatusTv.setTextColor(Color.parseColor("#38BDF8"))
                      keyStatusTv.text = "⏳ Google Server se aapki API Key check ho rahi hai..."
                      val allKeys = finalKey.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                      uiScope.launch {
                          val (okColor, resultMsg) = testAllKeysAndDiscoverModels(allKeys, prefs)
                          keyStatusTv.setTextColor(Color.parseColor(okColor))
                          keyStatusTv.text = resultMsg
                      }
                  }

                  addLabel("🧬 Modular Self-Evolution (YantraBrain.kt):", 15f, "#A855F7")

                  addBtn("🧬 1. Run Mega-Audit & Auto-Evolve YantraBrain.kt") {
                      if (AgentService.instance == null) {
                          Toast.makeText(this@MainActivity, "Pehle Accessibility Service ON karein!", Toast.LENGTH_LONG).show()
                      } else {
                          AgentService.instance?.runSelfDiagnosticAndImprove(openGeminiChat = true)
                      }
                  }

                  addBtn("🚀 2. Commit Copied YantraBrain.kt to GitHub Now") {
                      if (AgentService.instance == null) {
                          Toast.makeText(this@MainActivity, "Pehle Accessibility Service ON karein!", Toast.LENGTH_LONG).show()
                      } else {
                          AgentService.instance?.pasteCodeToGitHubAndOpenActions()
                      }
                  }

                  addBtn("🔄 3. Auto-Transfer Data to Twin App & Handover ($twinPkg)") {
                      val obj = JSONObject().apply { backupKeys.forEach { k -> put(k, prefs.getString(k, "")) } }
                      (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIBackup", obj.toString()))
                      val launchTwin = packageManager.getLaunchIntentForPackage(twinPkg)
                      if (launchTwin != null) {
                          AgentService.instance?.sleepForTwinHandover()
                          launchTwin.putExtra("EXTRA_TWIN_SYNC_JSON", obj.toString())
                          launchTwin.putExtra("EXTRA_AUTO_RUN_TEST", true)
                          launchTwin.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          startActivity(launchTwin)
                      } else {
                          Toast.makeText(this@MainActivity, "Backup Copy ho gaya! Twin App GitHub Actions se download karein.", Toast.LENGTH_LONG).show()
                          try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("${httpsPrefix}[github.com/surajsinha1251-cmyk/AI-Phone-agent-/actions](https://github.com/surajsinha1251-cmyk/AI-Phone-agent-/actions)")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (e: Exception) {}
                      }
                  }

                  addLabel("🛡️ Permissions Setup:", 15f, "#38BDF8")
                  addBtn("🎤 Enable Voice Mic Permission") {
