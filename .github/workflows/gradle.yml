                          tts?.stop(); agentJob?.cancel(); isRunning = false
                          startActivity(Intent(this@AgentService, VoiceActivity::class.java).apply {
                              putExtra("INTERRUPT_MODE", intr)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
