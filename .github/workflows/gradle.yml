                  }

                  val infoText = TextView(this).apply {
                      text = "\n🔥 7.0 Superpowers:\n• CEO Mission Brain (10 दिन में ₹1000 कमाने जैसे चैलेंज की पूरी रणनीति और रोडमैप)\n• Personal Vault से ऑटोमैटिक फॉर्म, UPI और प्रोफाइल भरना\n• Live Screenshot Vision + Before/After Zero-Error Check\n• ✥ Movable Ghost Bar (ऊपर के 3-Dots ⋮ और Search Bar कभी ब्लॉक नहीं होंगे)"
                      setTextColor(Color.LTGRAY)
