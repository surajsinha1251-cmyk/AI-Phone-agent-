name: Build Yantra Twin AI APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Modular Project (v33.1 Zero-Bracket YAML)
        run: |
          BRAIN_PATH="app/src/main/java/com/ai/phoneagent/YantraBrain.kt"
          rm -f /tmp/custom_brain.kt
          if [ -f "$BRAIN_PATH" ] && grep -q "object YantraBrain" "$BRAIN_PATH"; then
            if ! grep -q "27\." "$BRAIN_PATH" && ! grep -q "28\." "$BRAIN_PATH" && ! grep -q "29\." "$BRAIN_PATH" && ! grep -q "30\.0-ULTIMATE" "$BRAIN_PATH"; then
              cp "$BRAIN_PATH" /tmp/custom_brain.kt
            fi
          fi

          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          if [ ! -f yantra.keystore ]; then
            keytool -genkey -v -keystore yantra.keystore -alias yantra -keyalg RSA -keysize 2048 -validity 10000 -storepass yantra123 -keypass yantra123 -dname "CN=YantraAI, OU=DevLab, O=Yantra, L=Patna, S=Bihar, C=IN"
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "YantraAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.yantra"
                  minSdk 26
                  targetSdk 34
                  versionCode 46
                  versionName "33.1-ULTIMATE-FIXED"
              }
              signingConfigs {
                  yantraSign {
                      storeFile file("../yantra.keystore")
                      storePassword "yantra123"
                      keyAlias "yantra"
                      keyPassword "yantra123"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.yantraSign }
                  release { signingConfig signingConfigs.yantraSign ; minifyEnabled false }
              }
              flavorDimensions "tier"
              productFlavors {
                  alpha {
                      dimension "tier"
                      applicationId "com.ai.yantra.alpha"
                      resValue "string", "app_name", "Yantra Alpha (यंत्र A)"
                  }
                  beta {
                      dimension "tier"
                      applicationId "com.ai.yantra.beta"
                      resValue "string", "app_name", "Yantra Beta (यंत्र B)"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="SCHEMA_URL">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceActivity" android:exported="false" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service android:name=".AgentService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="SCHEMA_URL"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="15" />
          EOF

          S_HTTP="http"
          S_HOST="schemas"
          S_DOM="android"
          S_TLD="com"
          sed -i "s|SCHEMA_URL|$S_HTTP://$S_HOST.$S_DOM.$S_TLD/apk/res/android|g" app/src/main/AndroidManifest.xml app/src/main/res/xml/accessibility_config.xml

          cat << 'EOF' > /tmp/default_brain.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.provider.AlarmClock
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object YantraBrain {
              const val BRAIN_VERSION = "33.1-ULTIMATE-FIXED"

              val extraAppAliases = mapOf(
                  "studio" to "com.google.android.apps.youtube.creator",
                  "yt studio" to "com.google.android.apps.youtube.creator",
                  "seller" to "com.amazon.sellermobile.android",
                  "amazon seller" to "com.amazon.sellermobile.android",
                  "flipkart seller" to "com.flipkart.seller",
                  "seller hub" to "com.flipkart.seller",
                  "termux" to "com.termux",
                  "github" to "com.github.android",
                  "truecaller" to "com.truecaller",
                  "meesho" to "com.meesho.supply",
                  "zepto" to "com.zeptoconsumerapp",
                  "blinkit" to "com.grofers.customerapp",
                  "swiggy" to "in.swiggy.android",
                  "zomato" to "com.application.zomato",
                  "whatsapp business" to "com.whatsapp.w4b",
                  "paytm business" to "net.one97.merchant",
                  "phonepe" to "com.phonepe.app",
                  "gpay" to "com.google.android.apps.nbu.paisa.user",
                  "telegram" to "org.telegram.messenger",
                  "spotify" to "com.spotify.music",
                  "jio" to "com.jio.myjio",
                  "airtel" to "com.myairtelapp",
                  "canva" to "com.canva.editor"
              )

              private fun tryOfflineMath(g: String): String? {
                  val m = Regex("""(\d+(?:\.\d+)?)\s*([+\-*/xX×÷])\s*(\d+(?:\.\d+)?)""").find(g) ?: return null
                  val a = m.groupValues[1].toDoubleOrNull() ?: return null
                  val op = m.groupValues[2]
                  val b = m.groupValues[3].toDoubleOrNull() ?: return null
                  val res = when (op) {
                      "+" -> a + b
                      "-" -> a - b
                      "*", "x", "X", "×" -> a * b
                      "/", "÷" -> if (b != 0.0) a / b else return null
                      else -> return null
                  }
                  return if (res % 1.0 == 0.0) res.toLong().toString() else String.format(Locale.US, "%.2f", res)
              }

              fun handleCustomReflex(g: String, service: AgentService): Boolean {
                  val audio = service.getSystemService(Context.AUDIO_SERVICE) as? AudioManager

                  if (g.contains("kitna") || g.contains("calculate") || g.contains("hisab") || Regex("""\d+\s*[+\-*/×÷]\s*\d+""").containsMatchIn(g)) {
                      tryOfflineMath(g)?.let { ans ->
                          service.speakOut("Jawab hai $ans")
                          service.stopAgent("🧮 Answer: $ans")
                          return true
                      }
                  }

                  when {
                      g.contains("alarm") || g.contains("अलार्म") -> {
                          try {
                              val hMatch = Regex("""(\d{1,2})\s*(?:baje|बजे|am|pm)""").find(g)
                              val hour = hMatch?.groupValues?.get(1)?.toIntOrNull() ?: 7
                              val intent = Intent(AlarmClock.ACTION_SET_ALARM).apply {
                                  putExtra(AlarmClock.EXTRA_MESSAGE, "Yantra Alarm")
                                  putExtra(AlarmClock.EXTRA_HOUR, hour)
                                  putExtra(AlarmClock.EXTRA_MINUTES, 0)
                                  putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              service.startActivity(intent)
                              service.speakOut("$hour baje ka alarm laga diya hai")
                              service.stopAgent("⏰ Alarm Set ($hour:00)!")
                              return true
                          } catch (e: Exception) {}
                      }
                      g.contains("timer") || g.contains("टाइमर") -> {
                          try {
                              val mMatch = Regex("""(\d+)\s*(?:min|minute|मिनट)""").find(g)
                              val mins = mMatch?.groupValues?.get(1)?.toIntOrNull() ?: 5
                              val intent = Intent(AlarmClock.ACTION_SET_TIMER).apply {
                                  putExtra(AlarmClock.EXTRA_LENGTH, mins * 60)
                                  putExtra(AlarmClock.EXTRA_MESSAGE, "Yantra Timer")
                                  putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              service.startActivity(intent)
                              service.speakOut("$mins minute ka timer chalu kar diya hai")
                              service.stopAgent("⏱️ $mins Min Timer Started!")
                              return true
                          } catch (e: Exception) {}
                      }
                      g.contains("battery") || g.contains("storage") || g.contains("ram kitn") || g.contains("स्टोरेज") || g.contains("बैटरी") -> {
                          if (!g.contains("setting") && !g.contains("khol") && !g.contains("open")) {
                              val report = service.getRedmiPhoneStatus(true)
                              service.speakOut(report)
                              service.stopAgent("📲 $report")
                              return true
                          }
                      }
                      g.contains("time kya") || g.contains("samay kya") || g.contains("kitne baje") || g.contains("टाइम क्या") || g.contains("aaj ki date") || g.contains("tarikh") -> {
                          val nowStr = SimpleDateFormat("hh:mm a, EEEE, dd MMMM yyyy", Locale.getDefault()).format(Date())
                          service.speakOut("Abhi samay hai $nowStr")
                          service.stopAgent("🕒 $nowStr")
                          return true
                      }
                      g.contains("flashlight") || g.contains("torch") || g.contains("टॉर्च") -> {
                          val turnOff = g.contains("off") || g.contains("band") || g.contains("बंद")
                          service.executeSystemControl(if (turnOff) "torch_off" else "torch_on")
                          service.speakOut(if (turnOff) "Torch band" else "Torch chalu")
                          service.stopAgent(if (turnOff) "🔦 Torch OFF!" else "🔦 Torch ON!")
                          return true
                      }
                      g.contains("screenshot") || g.contains("स्क्रीनशॉट") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT)
                          service.speakOut("Screenshot le liya gaya hai")
                          service.stopAgent("📸 Screenshot Captured!")
                          return true
                      }
                      g.contains("lock screen") || g.contains("screen lock") || g.contains("phone lock") || g.contains("लॉक करो") -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                              service.stopAgent("🔒 Screen Locked!")
                              return true
                          }
                      }
                      g.contains("split screen") || g.contains("do screen") || g.contains("स्प्लिट स्क्रीन") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_TOGGLE_SPLIT_SCREEN)
                          service.stopAgent("🪟 Split Screen Toggled!")
                          return true
                      }
                      g.contains("notification") || g.contains("नोटिफिकेशन") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS)
                          service.stopAgent("🔔 Notifications Opened!")
                          return true
                      }
                      g.contains("control center") || g.contains("quick setting") || g.contains("कंट्रोल सेंटर") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS)
                          service.stopAgent("🎛️ Control Center Opened!")
                          return true
                      }
                      g.contains("recent app") || g.contains("रीसेंट") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_RECENTS)
                          service.stopAgent("🗂️ Recent Apps!")
                          return true
                      }
                      g == "back" || g == "back karo" || g.contains("पीछे जाओ") || g.contains("बैक करो") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK)
                          service.stopAgent("🔙 Back!")
                          return true
                      }
                      g == "home" || g == "home chalo" || g.contains("होम स्क्रीन") -> {
                          service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME)
                          service.stopAgent("🏠 Home Screen!")
                          return true
                      }
                      g.contains("volume up") || g.contains("aawaz badha") || g.contains("full aawaz") || g.contains("आवाज़ बढ़ा") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          audio?.adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          service.speakOut("Aawaz badha di hai")
                          service.stopAgent("🔊 Volume Up!")
                          return true
                      }
                      g.contains("volume down") || g.contains("aawaz kam") || g.contains("आवाज़ कम") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          audio?.adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          service.speakOut("Aawaz kam kar di hai")
                          service.stopAgent("🔉 Volume Down!")
                          return true
                      }
                      g.contains("mute") || g.contains("silent karo") -> {
                          audio?.adjustVolume(AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI)
                          service.stopAgent("🔇 Audio Muted!")
                          return true
                      }
                      (g.startsWith("call ") || g.startsWith("dial ")) && g.any { it.isDigit() } -> {
                          val digits = g.filter { it.isDigit() || it == '+' }
                          if (digits.length >= 10) {
                              val intent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$digits")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              service.startActivity(intent)
                              service.speakOut("Number dial kar diya hai")
                              service.stopAgent("📞 Dialing $digits")
                              return true
                          }
                      }
                      g.contains("wifi setting") || g.contains("bluetooth setting") || g.contains("storage setting") || g.contains("display setting") -> {
                          service.openRedmiSetting(g)
                          service.speakOut("Setting khol di hai")
                          service.stopAgent("⚙️ Setting Opened!")
                          return true
                      }
                  }
                  return false
              }

              fun buildMegaAuditPrompt(
                  myVariant: String,
                  targetTwin: String,
                  cacheTimeMs: Long,
                  appCount: Int,
                  aiCount: Int,
                  modelName: String,
                  apiLatencyMs: Long,
                  recentLogs: String,
                  failedList: String,
                  customFeatureRequest: String
              ): String {
                  return buildString {
                      append("Bhai, main $myVariant ($BRAIN_VERSION) bol raha hoon. Maine apna 7-Feature Self-Diagnostic poora kar liya hai:\n")
                      append("• Cache Speed: ${cacheTimeMs}ms ($appCount apps,$aiCount AI apps)\n")
                      append("• Active Model Latency: $modelName (${apiLatencyMs}ms)\n")
                      append("• Diagnostic Report: $recentLogs\n")
                      append("• Detected Issues: $failedList\n")
                      if (customFeatureRequest.isNotEmpty()) append("• User Priority Request: $customFeatureRequest\n")
                      append("\n🚨 IMPORTANT MODULAR RULE:\n")
                      append("Kripya naye smart offline commands/features aur speed optimizations jodkar SIRF YantraBrain.kt (package com.ai.phoneagent se lekar aakhiri } tak) ka 100% complete single-box Kotlin code do taaki main usse seedha GitHub par commit kar sakoon!")
                  }
              }

              fun extractPureBrainKotlin(raw: String): String? {
                  val clean = raw.replace("```kotlin", "").replace("```java", "").replace("```", "").trim()
                  val startIdx = clean.indexOf("package com.ai.phoneagent")
                  if (startIdx == -1) return null
                  if (!clean.contains("object YantraBrain")) return null
                  val endIdx = clean.lastIndexOf('}')
                  if (endIdx == -1 || endIdx <= startIdx) return null
                  return clean.substring(startIdx, endIdx + 1).trim()
              }

              fun buildActionPrompt(
                  dmWidth: Int, dmHeight: Int, redmiStatus: String, nowTime: String,
                  goal: String, corr: String, researchedInfo: String, notesSoFar: String,
                  aiAppsOnPhone: String, installedApps: String, vaultSummary: String,
                  latestNotif: String, historyStr: String, failedStr: String, stuckCount: Int, screen: String
              ): String {
                  return """
                      You are Yantra AI ($BRAIN_VERSION) controlling Xiaomi Redmi Note 10S (${dmWidth}x${dmHeight}).
                      USER GOAL: "$goal" | $corr
                      NOTES COLLECTED SO FAR: "$notesSoFar"
                      ALREADY EXECUTED STEPS (DO NOT REPEAT THESE!): $historyStr
                      BLACKLISTED TARGETS: $failedStr
                      CURRENT SCREEN ELEMENTS:
                      $screen

                      STRICT RULES:
                      1. If a permission or popup dialog ('Allow', 'While using the app', 'Continue', 'Skip', 'Not now', 'अनुमति दें') is visible, click it FIRST.
                      2. NEVER repeat a search or type action that is already in ALREADY EXECUTED STEPS!
                      3. Do NOT jump between ChatGPT/Google/YouTube for simple tasks! Stay focused on the fastest path.
                      4. If you already searched and results are on screen, click the best non-ad result or return "action":"done" with a clear Hindi answer in "message".
                      5. Output ONLY valid JSON:
                      {"speak":"short Hindi status","save_note":"...","steps":[{"action":"open_app|type|click|open_setting|direct_intent|scroll_down|scroll_up|back|home|done","id":1,"x":540,"y":400,"app_name":"...","target":"...","text":"...","press_enter":true,"message":"..."}]}
                  """.trimIndent()
              }
          }
          EOF

          if [ -f /tmp/custom_brain.kt ]; then
            cp /tmp/custom_brain.kt "$BRAIN_PATH"
          else
            cp /tmp/default_brain.kt "$BRAIN_PATH"
          fi

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : AppCompatActivity() {
              private val uiScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private val backupKeys = listOf("apiKey", "githubToken", "vaultName", "vaultContact", "vaultUpi", "vaultSkills", "userMemory", "activeMission", "learnedPaths", "dynamicRules", "verifiedModels", "lastFastModel")

              private val proto = "https" + "://"
              private val googleApiHost = listOf("generativelanguage", "googleapis", "com").joinToString(".")
              private val aiStudioHost = listOf("aistudio", "google", "com").joinToString(".")
              private val githubHost = listOf("github", "com").joinToString(".")

              private fun safeUrl(raw: String): String {
                  var s = raw.trim()
                  if (s.contains("](")) s = s.substringAfter("](").substringBefore(")")
                  return s.replace("[", "").replace("]", "").trim()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)

                  val incomingJson = intent?.getStringExtra("EXTRA_TWIN_SYNC_JSON")
                  if (!incomingJson.isNullOrEmpty()) {
                      try {
                          val obj = JSONObject(incomingJson)
                          val ed = prefs.edit()
                          backupKeys.forEach { k ->
                              val v = obj.optString(k, "")
                              if (v.isNotEmpty()) ed.putString(k, v)
                          }
                          ed.apply()
                          Toast.makeText(this, "✅ Twin App se saara Data Auto-Transfer ho gaya!", Toast.LENGTH_LONG).show()
                          AgentService.instance?.activateAfterTwinHandover()
                      } catch (e: Exception) {}
                  }

                  val isAlpha = packageName.contains("alpha")
                  val twinPkg = if (isAlpha) "com.ai.yantra.beta" else "com.ai.yantra.alpha"
                  val myTitle = if (isAlpha) "🔱 YANTRA ALPHA (Master Dev A)" else "🔱 YANTRA BETA (Twin Tester B)"

                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0F172A")) }
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL ; setPadding(42, 50, 42, 50) }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#38BDF8") {
                      layout.addView(TextView(this@MainActivity).apply { text = txt ; textSize = size ; setTextColor(Color.parseColor(color)) ; setPadding(0, 16, 0, 8) })
                  }
                  fun makeInput(hintTxt: String, key: String, isSecret: Boolean = false): EditText {
                      val et = EditText(this@MainActivity).apply {
                          hint = hintTxt ; setHintTextColor(Color.GRAY) ; setTextColor(Color.WHITE)
                          setText(prefs.getString(key, ""))
                          if (isSecret) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      }
                      layout.addView(et)
                      return et
                  }
                  fun addBtn(txt: String, onClick: () -> Unit) {
                      layout.addView(Button(this@MainActivity).apply { text = txt ; setOnClickListener { onClick() } })
                  }

                  addLabel("$myTitle — ${YantraBrain.BRAIN_VERSION}\n(Exit Code 9 Fixed + 2048 Token Engine + 7-Feature Tester)", 18f, "#38BDF8")
                  val apiInput = makeInput("Yahan Gemini API Key daalein (AIzaSy...)", "apiKey", isSecret = true)
                  val ghTokenInput = makeInput("GitHub Token (ghp_...) 1-Sec Background Auto-Commit ke liye", "githubToken", isSecret = true)
                  val keyStatusTv = TextView(this).apply {
                      text = "✅ v33.1 Fixed: 'Task Complete' bug, YouTube repeat aur Exit Code 9 100% खत्म!"
                      setTextColor(Color.parseColor("#4ADE80")) ; textSize = 12f ; setPadding(0, 4, 0, 8)
                  }
                  layout.addView(keyStatusTv)

                  addBtn("🔑 Get New Free API Key (Google AI Studio)") {
