          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/VoiceActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.widget.Toast

          class VoiceActivity : Activity() {
              private var isInterruptMode = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  isInterruptMode = intent.getBooleanExtra("INTERRUPT_MODE", false)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 201)
                  } else {
                      launchGoogleVoicePopup()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 201 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      launchGoogleVoicePopup()
                  } else {
                      Toast.makeText(this, "Mic permission zaroori hai!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              private fun launchGoogleVoicePopup() {
                  try {
                      val promptText = if (isInterruptMode) {
                          "✋ AI रुक गया है! बताइए अब क्या सुधार करना है?"
                      } else {
                          "🧠 बोलिए, क्या काम करना है?"
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, promptText)
                      }
                      startActivityForResult(intent, 200)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Google Voice Typing app nahi mila!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val results = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      val spokenText = results?.firstOrNull()?.trim() ?: ""
                      if (spokenText.isNotEmpty()) {
                          AgentService.instance?.onVoiceCommandReceived(spokenText, isInterruptMode)
                      }
                  }
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/AgentService.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.ColorSpace
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.hardware.HardwareBuffer
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.speech.tts.TextToSpeech
          import android.text.TextUtils
          import android.util.Base64
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class AgentService : AccessibilityService() {

              companion object {
                  var instance: AgentService? = null
              }

              private lateinit var windowManager: WindowManager
              private lateinit var floatingLayout: LinearLayout
              private lateinit var topRow: LinearLayout
              private lateinit var planPreviewTv: TextView
              private lateinit var inputRow: LinearLayout
              private lateinit var dragBtn: TextView
              private lateinit var statusTv: TextView
              private lateinit var cmdInput: EditText
              private lateinit var interruptBtn: TextView
              private lateinit var micBtn: TextView
              private lateinit var actionBtn: TextView
              private lateinit var ttsToggleBtn: TextView
              private lateinit var stopBtn: TextView
              private lateinit var minBtn: TextView
              private lateinit var params: WindowManager.LayoutParams

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var agentJob: Job? = null
              private var isRunning = false
              private var isMinimized = false
              private var isVoiceEnabled = true

              private var currentGoal = ""
              private var liveUserCorrection = ""
              private var researchedContext = ""
              private val history = mutableListOf<String>()
              private val failedTargets = mutableSetOf<String>()
              private val nodeMap = mutableMapOf<Int, AccessibilityNodeInfo>()

              private var tts: TextToSpeech? = null

              private val modelList = listOf(
                  "gemini-2.5-flash",
                  "gemini-2.5-flash-lite",
                  "gemini-3-flash-preview",
                  "gemini-3.1-flash-lite",
                  "gemini-3.5-flash",
                  "gemini-3.5-flash-lite",
                  "gemini-3.8-flash",
                  "gemini-3.7-flash",
                  "gemini-3.6-flash",
                  "gemini-2.5-pro",
                  "gemini-2.0-flash",
                  "gemini-1.5-flash"
              )
              private val deadModels = mutableSetOf<String>()
              private var currentModelIndex = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  initVoiceEngine()
                  createMovableFloatingBar()
              }

              private fun initVoiceEngine() {
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("hi", "IN"))
                      }
                  }
              }

              private fun speakOut(text: String) {
                  if (isVoiceEnabled && text.isNotBlank()) {
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
                  }
              }

              // LIVE INTERRUPT & VOICE HANDLER
              fun onVoiceCommandReceived(spoken: String, wasInterrupted: Boolean) {
                  scope.launch {
                      tts?.stop()
                      agentJob?.cancel()
                      isRunning = false
                      cmdInput.setText(spoken)

                      if (wasInterrupted && currentGoal.isNotBlank()) {
                          // User interrupted AI mid-way to correct or redirect it!
                          liveUserCorrection = spoken
                          history.add("USER_INTERRUPTED_AND_SAID: \"$spoken\"")
                          statusTv.setTextColor(Color.parseColor("#FBBF24"))
                          statusTv.text = "✋ आपकी बात समझ गया: '$spoken'"
                          startGeniusAgent(isResumeWithCorrection = true)
                      } else {
                          currentGoal = spoken
                          liveUserCorrection = ""
                          startGeniusAgent(isResumeWithCorrection = false)
                      }
                  }
              }

              private fun triggerImmediateInterruptAndListen(openVoice: Boolean) {
                  tts?.stop()
                  agentJob?.cancel()
                  isRunning = false
                  setWindowGhostMode(false)
                  autoCollapseBar(false)
                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                  statusTv.text = "✋ AI रुक गया है! बोलकर या लिखकर बताएँ क्या सुधार करना है..."
                  planPreviewTv.text = "💡 आपकी बात का इंतज़ार है (पुराना काम याद है)"
                  setTouchPassThrough(false)

                  if (openVoice) {
                      val vIntent = Intent(this@AgentService, VoiceActivity::class.java).apply {
                          putExtra("INTERRUPT_MODE", true)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      }
                      startActivity(vIntent)
                  } else {
                      cmdInput.requestFocus()
                  }
              }

              private fun makePillButton(label: String, bgColor: String): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = 11.5f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(15, 8, 15, 8)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgColor))
                          cornerRadius = 18f
                      }
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(4, 0, 0, 0) }
                      layoutParams = lp
                  }
              }

              private fun createMovableFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics

                  params = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.96).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = (dm.heightPixels * 0.72).toInt()
                  }

                  floatingLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(14, 10, 14, 10)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#EE0F172A"))
                          cornerRadius = 26f
                          setStroke(2, Color.parseColor("#38BDF8"))
                      }
                  }

                  topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  dragBtn = makePillButton("✥", "#1E293B").apply {
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 6, 0) }
                      layoutParams = lp
                  }

                  var initialY = 0
                  var initialTouchY = 0f
                  val dragListener = View.OnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialY = params.y
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dy = (event.rawY - initialTouchY).toInt()
                              params.y = (initialY + dy).coerceIn(20, dm.heightPixels - 180)
                              try { windowManager.updateViewLayout(floatingLayout, params) } catch (_: Exception) {}
                              true
                          }
                          else -> false
                      }
                  }
                  dragBtn.setOnTouchListener(dragListener)

                  statusTv = TextView(this).apply {
                      text = "🧠 AI 8.0 Ready: आदेश दें (बीच में टोकने के लिए ✋ दबाएँ)"
                      setTextColor(Color.parseColor("#4ADE80"))
                      textSize = 11.5f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener(dragListener)
                  }

                  // ✋ LIVE INTERRUPT ("टोको") BUTTON
                  interruptBtn = makePillButton("✋ टोको", "#D97706").apply {
                      setOnClickListener {
                          triggerImmediateInterruptAndListen(openVoice = true)
                      }
                  }

                  ttsToggleBtn = makePillButton("🔊", "#334155").apply {
                      setOnClickListener {
                          isVoiceEnabled = !isVoiceEnabled
                          ttsToggleBtn.text = if (isVoiceEnabled) "🔊" else "🔇"
                          if (!isVoiceEnabled) tts?.stop()
                      }
                  }

                  stopBtn = makePillButton("⏹", "#DC2626").apply {
                      setOnClickListener { stopAgent("⏹ आपने AI को पूरी तरह रोक दिया।") }
                  }

                  minBtn = makePillButton("➖", "#475569").apply {
                      setOnClickListener {
                          isMinimized = !isMinimized
                          inputRow.visibility = if (isMinimized) View.GONE else View.VISIBLE
                          minBtn.text = if (isMinimized) "➕" else "➖"
                          if (isMinimized) setTouchPassThrough(true)
                      }
                  }

                  topRow.addView(dragBtn)
                  topRow.addView(statusTv)
                  topRow.addView(interruptBtn)
                  topRow.addView(ttsToggleBtn)
                  topRow.addView(stopBtn)
                  topRow.addView(minBtn)

                  // NEXT STEP & BUTTON PREVIEW LINE
                  planPreviewTv = TextView(this).apply {
                      text = "🎯 अगला कदम: आपके आदेश का इंतज़ार है..."
                      setTextColor(Color.parseColor("#93C5FD"))
                      textSize = 10.5f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(4, 3, 4, 2)
                  }

                  inputRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 6, 0, 0)
                  }

                  cmdInput = EditText(this).apply {
                      hint = "काम या बीच का सुधार लिखें..."
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      textSize = 12.5f
                      setSingleLine(true)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(18, 9, 18, 9)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = 18f
                      }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener { _, event ->
                          if (event.action == MotionEvent.ACTION_DOWN) {
                              // Agar AI chal raha hai aur user box mein touch kare, toh turant pause karke suno!
                              if (isRunning) {
                                  tts?.stop()
                                  agentJob?.cancel()
                                  isRunning = false
                                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                                  statusTv.text = "✋ AI रुका है: अपना सुधार लिखकर ▶ दबाएँ"
                              }
                              setTouchPassThrough(false)
                          }
                          false
                      }
                  }

                  micBtn = makePillButton("🎤", "#2563EB").apply {
                      setOnClickListener {
                          // Agar AI chal raha hai aur user Mic dabaye -> Live Interrupt Mode!
                          val interruptNow = isRunning || currentGoal.isNotBlank() && history.isNotEmpty()
                          tts?.stop()
                          agentJob?.cancel()
                          isRunning = false
                          val vIntent = Intent(this@AgentService, VoiceActivity::class.java).apply {
                              putExtra("INTERRUPT_MODE", interruptNow)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          }
                          startActivity(vIntent)
                      }
                  }

                  actionBtn = makePillButton("▶", "#16A34A").apply {
                      setOnClickListener {
                          val q = cmdInput.text.toString().trim()
                          if (q.isNotEmpty()) {
                              tts?.stop()
                              agentJob?.cancel()
                              if (currentGoal.isNotBlank() && history.isNotEmpty() && q != currentGoal) {
                                  liveUserCorrection = q
                                  history.add("USER_TYPED_CORRECTION: \"$q\"")
                                  startGeniusAgent(isResumeWithCorrection = true)
                              } else {
                                  currentGoal = q
                                  liveUserCorrection = ""
                                  startGeniusAgent(isResumeWithCorrection = false)
                              }
                          }
                      }
                  }

                  inputRow.addView(cmdInput)
                  inputRow.addView(micBtn)
                  inputRow.addView(actionBtn)

                  floatingLayout.addView(topRow)
                  floatingLayout.addView(planPreviewTv)
                  floatingLayout.addView(inputRow)

                  windowManager.addView(floatingLayout, params)
              }

              private fun setTouchPassThrough(passThrough: Boolean) {
                  params.flags = if (passThrough) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                  }
                  try { windowManager.updateViewLayout(floatingLayout, params) } catch (_: Exception) {}
              }

              private fun setWindowGhostMode(ghost: Boolean) {
                  params.flags = if (ghost) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  }
                  floatingLayout.alpha = if (ghost) 0.18f else 1.0f
                  try { windowManager.updateViewLayout(floatingLayout, params) } catch (_: Exception) {}
              }

              private fun autoCollapseBar(collapse: Boolean) {
                  isMinimized = collapse
                  inputRow.visibility = if (collapse) View.GONE else View.VISIBLE
                  minBtn.text = if (collapse) "➕" else "➖"
                  setTouchPassThrough(true)
              }

              private fun getPersonalVaultSummary(): String {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val name = prefs.getString("vaultName", "") ?: ""
                  val contact = prefs.getString("vaultContact", "") ?: ""
                  val upi = prefs.getString("vaultUpi", "") ?: ""
                  val skills = prefs.getString("vaultSkills", "") ?: ""
                  val mem = prefs.getString("userMemory", "") ?: ""
                  return "Name: $name | Contact: $contact | UPI_ID: $upi | Skills: $skills | ExtraRules: $mem"
              }

              // SMART CHECK: Kya is command ke liye Google Search Research zaroori hai?
              private fun needsDeepWebResearch(cmd: String): Boolean {
                  val lower = cmd.lowercase()
                  val researchTriggers = listOf(
                      "episode", "एपिसोड", "latest", "naya", "नया", "last", "aakhiri",
                      "kamao", "कमाओ", "earning", "paisa", "पैसा", "challenge", "चैलेंज",
                      "price", "rate", "news", "khabar", "kaun", "kab", "research", "रिसर्च"
                  )
                  return researchTriggers.any { lower.contains(it) }
              }

              // GENIUS AUTONOMOUS ENGINE (Fast-Track + Deep Self-Critique + Live Interrupt Support)
              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  agentJob?.cancel()
                  isRunning = true
                  if (!isResumeWithCorrection) {
                      history.clear()
                      failedTargets.clear()
                      researchedContext = ""
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()
                      val stepQueue = mutableListOf<JSONObject>()

                      // Sirf tabhi Phase 1 Research karo jab command mein waqai web research ki zaroorat ho!
                      if (!isResumeWithCorrection && needsDeepWebResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "🔍 ज़रूरी जानकारी Google से निकाल रहा हूँ..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val masterPlan = researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, currentPkg)
                          if (!isRunning) return@launch

                          researchedContext = masterPlan.optString("researched_info", "")
                          val speakMsg = masterPlan.optString("speak", "")
                          if (speakMsg.isNotEmpty()) speakOut(speakMsg)

                          val initialSteps = masterPlan.optJSONArray("steps")
                          if (initialSteps != null) {
                              for (i in 0 until initialSteps.length()) {
                                  stepQueue.add(initialSteps.getJSONObject(i))
                              }
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("ठीक है, आपकी बात के हिसाब से रास्ता बदल रहा हूँ")
                      } else {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "⚡ Genius Fast-Track: सीधे स्क्रीन देखकर काम शुरू..."
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastScreenHash = ""

                      while (isRunning) {
                          while (stepQueue.isNotEmpty() && isRunning) {
                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")

                              if (act == "done") {
                                  val doneMsg = step.optString("message", "काम पूरा हो गया!")
                                  speakOut(doneMsg)
                                  vibratePhone()
                                  stopAgent("✅ $doneMsg")
                                  return@launch
                              }
                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "भाई, यह काम आप पूरा करके ▶ दबाएँ")
                                  val whyCant = step.optString("capability_note", "")
                                  val fullAlert = if (whyCant.isNotEmpty()) "$askMsg ($whyCant)" else askMsg
                                  speakOut(fullAlert)
                                  vibratePhone()
                                  pauseForUser("🤝 $fullAlert")
                                  return@launch
                              }

                              val ok = executeLocalStepWithVerification(step)
                              if (!ok) {
                                  stepQueue.clear()
                                  break
                              }
                          }

                          if (!isRunning) break

                          aiConsultCount++
                          if (aiConsultCount > 22) {
                              stopAgent("✅ इस चरण का काम पूरा हो गया!")
                              break
                          }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "🧠 Genius Brain: स्क्रीन और अगला बटन सोच रहा हूँ..."
                          delay(450)

                          val screenSnapshot = readScreenElements()
                          val currentHash = screenSnapshot.hashCode().toString()
                          if (currentHash == lastScreenHash) {
                              stuckCount++
                          } else {
                              stuckCount = 0
                              lastScreenHash = currentHash
                          }

                          val needVision = stuckCount >= 1 || screenSnapshot.lines().size < 6
                          val screenshotB64 = if (needVision) captureScreenBase64() else null

                          val nextDecision = thinkLikeGeniusHuman(
                              goal = currentGoal,
                              userCorrection = liveUserCorrection,
                              researchedInfo = researchedContext,
                              vaultSummary = vaultSummary,
                              installedApps = installedApps,
                              screen = screenSnapshot,
                              screenshotB64 = screenshotB64,
                              stuckCount = stuckCount
                          )
                          if (!isRunning) break

                          // Clear one-time correction after AI has absorbed it
                          if (liveUserCorrection.isNotEmpty()) {
                              liveUserCorrection = ""
                          }

                          val chosenBtnInfo = nextDecision.optString("chosen_button_info", "")
                          val nextStepPlan = nextDecision.optString("next_step_plan", "")
                          val capabilityNote = nextDecision.optString("capability_note", "")

                          if (chosenBtnInfo.isNotEmpty() || nextStepPlan.isNotEmpty()) {
                              planPreviewTv.text = "🎯 बटन: $chosenBtnInfo | आगे: $nextStepPlan"
                          }

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ 5 सेकंड इंतज़ार..."
                              delay(5000)
                              continue
                          } else if (topAct == "done") {
                              val m = nextDecision.optString("message", "काम पूरा हो गया!")
                              speakOut(m)
                              vibratePhone()
                              stopAgent("✅ $m")
                              break
                          } else if (topAct == "ask_user") {
                              val m = nextDecision.optString("message", "यहाँ आपकी मदद चाहिए")
                              val fullMsg = if (capabilityNote.isNotEmpty()) "$m — $capabilityNote" else m
                              speakOut(fullMsg)
                              vibratePhone()
                              pauseForUser("🤝 $fullMsg")
                              break
                          }

                          val batchSpeak = nextDecision.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) {
                                  stepQueue.add(arr.getJSONObject(i))
                              }
                          } else if (topAct.isNotEmpty()) {
                              stepQueue.add(nextDecision)
                          } else {
                              stopAgent("✅ काम पूरा हो गया!")
                              break
                          }
                      }
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val nextHint = step.optString("next_step", "")
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  if (nextHint.isNotEmpty()) {
                      planPreviewTv.text = "🎯 इसके बाद: $nextHint"
                  }
                  history.add("$action(#$targetId '$target' $reason)")
                  if (history.size > 16) history.removeAt(0)

                  when (action) {
                      "open_app" -> {
                          val appName = step.optString("app_name", target)
                          val opened = openAppByName(appName)
                          delay(2200)
                          return opened
                      }
                      "direct_intent" -> {
                          val intentType = step.optString("intent_type", "")
                          val data = step.optString("data", text)
                          val ok = fireDirectIntent(intentType, data)
                          delay(2300)
                          return ok
                      }
                      "write_content" -> {
                          copyToClipboard(text)
                          val pressEnter = step.optBoolean("press_enter", false)
                          val ok = performSmartType(targetId, x, y, text, pressEnter)
                          delay(1500)
                          return ok
                      }
                      "scroll_down" -> {
                          val times = step.optInt("times", 1).coerceIn(1, 6)
                          for (i in 1..times) {
                              if (!isRunning) break
                              performSwipe("up")
                              delay(1100)
                          }
                          return true
                      }
                      "scroll_up" -> {
                          performSwipe("down")
                          delay(1100)
                          return true
                      }
                      "click" -> {
                          val beforePkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          if (targetId > 0 || (x > 0 && y > 0)) {
                              performSmartClick(targetId, x, y)
                              delay(1500)
                              val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                              if (beforePkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                                  failedTargets.add("#$targetId($x,$y)")
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  delay(1000)
                                  return false
                              }
                              return true
                          }
                          if (target.isNotEmpty()) {
                              val coords = waitForKeywordOnScreen(target, 2500L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(1500)
                                  return true
                              }
                          }
                          return false
                      }
                      "click_best_video" -> {
                          delay(1200)
                          val matchKw = step.optString("match_keywords", target)
                          val pos = findNonAdVideoResult(matchKw)
                          if (pos != null) {
                              performTap(pos.first.toFloat(), pos.second.toFloat())
                              delay(1800)
                              return true
                          }
                          performSwipe("up")
                          delay(1200)
                          val pos2 = findNonAdVideoResult(matchKw)
                          if (pos2 != null) {
                              performTap(pos2.first.toFloat(), pos2.second.toFloat())
                              delay(1800)
                              return true
                          }
                          return false
                      }
                      "type" -> {
                          val pressEnter = step.optBoolean("press_enter", true)
                          if (target.isNotEmpty() && targetId <= 0 && x <= 0) {
                              val coords = waitForKeywordOnScreen(target, 2200L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(650)
                              }
                          }
                          val ok = performSmartType(targetId, x, y, text, pressEnter)
                          delay(1800)
                          return ok
                      }
                      "system_control" -> {
                          val cmd = step.optString("command", target)
                          executeSystemControl(cmd)
                          delay(1000)
                          return true
                      }
                      "back" -> {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(1000)
                          return true
                      }
                      "home" -> {
                          performGlobalAction(GLOBAL_ACTION_HOME)
                          delay(1000)
                          return true
                      }
                      "wait" -> {
                          val sec = step.optInt("seconds", 2).coerceIn(1, 10)
                          delay(sec * 1000L)
                          return true
                      }
                  }
                  return false
              }

