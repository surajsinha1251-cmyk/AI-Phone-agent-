              private fun createMovableFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (e: Exception) {} }
                  val dm = resources.displayMetrics
                  val isAlpha = packageName.contains("alpha")
                  val badge = if (isAlpha) "🔱 Yantra-A" else "🔱 Yantra-B"
                  val initialY = if (isAlpha) (dm.heightPixels * 0.68).toInt() else (dm.heightPixels * 0.16).toInt()

                  params = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.96).toInt(), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START ; x = (dm.widthPixels * 0.02).toInt() ; y = initialY }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL ; setPadding(14, 10, 14, 10)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#EE0F172A")) ; cornerRadius = 26f
                          setStroke(2, Color.parseColor(if (isAlpha) "#38BDF8" else "#A855F7"))
                      }
                  }
                  floatingLayout = container

                  topRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL ; gravity = Gravity.CENTER_VERTICAL }
                  val dragBtn = makePillButton("✥", "#1E293B")
                  var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
                  val dragListener = View.OnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> { initX = params.x ; initY = params.y ; touchX = ev.rawX ; touchY = ev.rawY ; true }
                          MotionEvent.ACTION_MOVE -> {
                              val curDm = resources.displayMetrics
                              params.x = (initX + (ev.rawX - touchX).toInt()).coerceIn(0, curDm.widthPixels - 120)
                              params.y = (initY + (ev.rawY - touchY).toInt()).coerceIn(20, curDm.heightPixels - 160)
                              try { windowManager.updateViewLayout(container, params) } catch (e: Exception) {}
                              true
                          }
                          else -> false
                      }
                  }
                  dragBtn.setOnTouchListener(dragListener)

                  statusTv = TextView(this).apply {
                      text = "$badge (${YantraBrain.BRAIN_VERSION}) Ready!"
                      setTextColor(Color.parseColor("#4ADE80")) ; textSize = 11.2f ; maxLines = 2
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener(dragListener)
                  }

                  wakeToggleBtn = makePillButton("👂", if (isWakeWordEnabled) "#16A34A" else "#475569").apply {
                      setOnClickListener {
                          isWakeWordEnabled = !isWakeWordEnabled
                          background = GradientDrawable().apply { setColor(Color.parseColor(if (isWakeWordEnabled) "#16A34A" else "#475569")) ; cornerRadius = 18f }
                          if (isWakeWordEnabled) startHeyYantraWakeLoop() else stopHeyYantraWakeLoop()
                      }
                  }

                  val selfEvolveBtn = makePillButton("🧬", "#9333EA").apply {
                      setOnClickListener { runSelfDiagnosticAndImprove(true, cmdInput.text.toString().trim()) }
                  }
                  val vaultOpenBtn = makePillButton("⚙️", "#334155").apply {
                      setOnClickListener { startActivity(Intent(this@AgentService, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                  }
                  val stopBtn = makePillButton("⏹", "#DC2626").apply { setOnClickListener { stopAgent("⏹ Stopped") } }
                  minBtn = makePillButton("➖", "#475569").apply { setOnClickListener { autoCollapseBar(!isMinimized) } }

                  topRow.addView(dragBtn) ; topRow.addView(statusTv) ; topRow.addView(wakeToggleBtn) ; topRow.addView(selfEvolveBtn) ; topRow.addView(vaultOpenBtn) ; topRow.addView(stopBtn) ; topRow.addView(minBtn)

                  planPreviewTv = TextView(this).apply {
                      text = "🎯 v33.1 Fixed: 2048-Token Engine + Google Search + Single-Shot YouTube"
                      setTextColor(Color.parseColor("#93C5FD")) ; textSize = 10.5f ; setPadding(6, 4, 6, 2)
                  }

                  inputRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL ; gravity = Gravity.CENTER_VERTICAL ; setPadding(0, 6, 0, 0) }
                  cmdInput = EditText(this).apply {
                      hint = "यहाँ लिखें या 'Hey Yantra' बोलें..."
                      setHintTextColor(Color.LTGRAY) ; setTextColor(Color.WHITE) ; textSize = 12.5f ; setSingleLine(true)
                      setPadding(18, 9, 18, 9)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")) ; cornerRadius = 16f }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener { _, ev -> if (ev.action == MotionEvent.ACTION_DOWN) setTouchPassThrough(false) ; false }
                  }

                  val clearBtn = makePillButton("✕", "#475569").apply { setOnClickListener { cmdInput.setText("") } }
                  val micBtn = makePillButton("🎤", "#2563EB").apply {
                      setOnClickListener {
                          startActivity(Intent(this@AgentService, VoiceActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP))
                      }
                  }
                  val actionBtn = makePillButton("▶", "#16A34A").apply {
                      setOnClickListener {
                          val q = stripWakeWordPrefix(cmdInput.text.toString().trim())
                          if (q.isNotEmpty()) { currentGoal = q ; startGeniusAgent(false) }
                      }
                  }

                  inputRow.addView(cmdInput) ; inputRow.addView(clearBtn) ; inputRow.addView(micBtn) ; inputRow.addView(actionBtn)
                  container.addView(topRow) ; container.addView(planPreviewTv) ; container.addView(inputRow)
                  windowManager.addView(container, params)
                  if (!isAlpha) autoCollapseBar(true)
              }

              private fun setTouchPassThrough(passThrough: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (passThrough) WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  else WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  try { windowManager.updateViewLayout(view, params) } catch (e: Exception) {}
              }

              private fun setWindowGhostMode(ghost: Boolean) {
                  val view = floatingLayout ?: return
                  view.alpha = if (ghost) 0.0f else 1.0f
                  try { windowManager.updateViewLayout(view, params) } catch (e: Exception) {}
              }

              private fun autoCollapseBar(collapse: Boolean) {
                  val view = floatingLayout ?: return
                  isMinimized = collapse
                  inputRow.visibility = if (collapse) View.GONE else View.VISIBLE
                  planPreviewTv.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  minBtn.text = if (collapse) "➕" else "➖"
                  setTouchPassThrough(true)
                  try { windowManager.updateViewLayout(view, params) } catch (e: Exception) {}
              }

              fun getRedmiPhoneStatus(speakHindi: Boolean = false): String {
                  return try {
                      val stat = StatFs(Environment.getDataDirectory().path)
                      val totalGb = (stat.totalBytes / (1024.0 * 1024.0 * 1024.0)).toInt()
                      val freeGb = String.format(Locale.US, "%.1f", stat.availableBytes / (1024.0 * 1024.0 * 1024.0))
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      if (speakHindi) "Redmi Note 10S mein $bat percent battery aur $freeGb GB free storage hai."
                      else "Redmi Note 10S | Battery: $bat% | Storage: $freeGb/$totalGb GB free"
                  } catch (e: Exception) { "Redmi Note 10S" }
              }

              private fun extractOpenTarget(rawCmd: String): String {
                  var s = stripWakeWordPrefix(rawCmd).lowercase().trim()
                  for (w in listOf("please", "bhai", "open karo", "open", "kholo", "खोलो", "chalu karo", "start", "app", "को", "ko")) {
                      s = s.replace(w, " ")
                  }
                  return s.replace("\\s+".toRegex(), " ").trim()
              }

              private suspend fun waitForUiReady(previousPkg: String = "", maxWaitMs: Long = 450L) {
                  val start = System.currentTimeMillis()
                  delay(50)
                  while (System.currentTimeMillis() - start < maxWaitMs && isRunning) {
                      val root = rootInActiveWindow
                      if (root != null && previousPkg.isNotEmpty() && root.packageName?.toString() != previousPkg) return
                      delay(35)
                  }
              }

              private suspend fun askGoogleSearchDirect(question: String): String = withContext(Dispatchers.IO) {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val keys = (prefs.getString("apiKey", "") ?: "").split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  if (keys.isEmpty()) return@withContext "Pehle Settings mein API Key save karein."

                  val models = listOf("gemini-2.5-flash-lite", "gemini-flash-lite-latest", "gemini-2.5-flash")
                  for (k in keys) {
                      for (m in models) {
                          for (useSearch in listOf(true, false)) {
                              var conn: HttpURLConnection? = null
                              try {
                                  val cleanEndpoint = safeUrl("$proto$googleApiHost/v1beta/models/$m:generateContent?key=$k")
                                  conn = URL(cleanEndpoint).openConnection() as HttpURLConnection
                                  conn.requestMethod = "POST"
                                  conn.setRequestProperty("Content-Type", "application/json")
                                  conn.connectTimeout = 5000 ; conn.readTimeout = 9000 ; conn.doOutput = true
                                  val body = JSONObject().apply {
                                      put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", "User Question: \"$question\". Give a direct, accurate 1-2 sentence answer in Hindi/Hinglish with exact names/facts.")))))
                                      if (useSearch) put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                                      put("generationConfig", JSONObject().put("temperature", 0.1).put("maxOutputTokens", 1024))
                                  }
                                  conn.outputStream.use { it.write(body.toString().toByteArray()) }
                                  if (conn.responseCode == 200) {
                                      val res = conn.inputStream.bufferedReader().readText()
                                      val parts = JSONObject(res).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts")
                                      val sb = StringBuilder()
                                      for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text", ""))
                                      val ans = sb.toString().replace("*", "").replace("#", "").trim()
                                      if (ans.isNotEmpty()) return@withContext ans
                                  }
                              } catch (e: Exception) {} finally { try { conn?.disconnect() } catch (e: Exception) {} }
                          }
                      }
                  }
                  return@withContext ""
              }

              private fun findFirstOrganicYouTubeVideo(root: AccessibilityNodeInfo?): Pair<Pair<Int, Int>, String>? {
                  if (root == null) return null
                  val dm = resources.displayMetrics
                  val adWords = listOf("sponsored", "विज्ञापन", "ad ·", "ad:", "visit site", "install", "shop now")
                  var bestPos: Pair<Int, Int>? = null
                  var bestTitle = ""

                  fun scan(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || bestPos != null) return
                      val r = Rect() ; node.getBoundsInScreen(r)
                      val txt = "${node.text ?: ""} ${node.contentDescription ?: ""}".trim()
                      val lower = txt.lowercase()
                      if (r.centerY() in 230..(dm.heightPixels - 160) && r.width() > 210 && r.height() > 65 && txt.length > 12) {
                          val isAd = adWords.any { lower.contains(it) }
                          val isChip = lower == "all" || lower == "shorts" || lower == "videos" || lower.startsWith("filter")
                          if (!isAd && !isChip && (node.isClickable || node.parent?.isClickable == true)) {
                              if (lower.contains("views") || lower.contains("ago") || lower.contains("minutes") || lower.contains("बार देखा") || txt.length > 22) {
                                  bestPos = Pair(r.centerX(), r.centerY())
                                  bestTitle = txt.lines().firstOrNull()?.take(75) ?: txt.take(75)
                                  return
                              }
                          }
                      }
                      for (i in 0 until node.childCount) scan(node.getChild(i))
                  }
                  scan(root)
                  return if (bestPos != null) Pair(bestPos!!, bestTitle) else null
              }

              private fun tryOfflineInstantReflex(goal: String): Boolean {
                  val g = stripWakeWordPrefix(goal).trim().lowercase()
                  if (g.isEmpty()) return false

                  if (g.contains("self improvement") || g.contains("self test") || g.contains("feature test") || g.contains("sabhi feature") || g.contains("सेल्फ इंप्रूवमेंट")) {
                      runSelfDiagnosticAndImprove(true, g) ; return true
                  }
                  if (g.contains("github paste") || g.contains("code paste karo")) {
                      pasteCodeToGitHubAndOpenActions() ; return true
                  }

                  if (YantraBrain.handleCustomReflex(g, this)) return true

                  val qWords = listOf("kon sa", "kaun sa", "कौन सा", "kya hai", "kya h", "क्या है", "batao", "बताओ", "sabse naya", "सबसे नया", "naya episode", "latest episode", "kisne", "kab", "price kya", "mausam")
                  val actWords = listOf("chalao", "chala do", "चलाओ", "play", "kholo", "खोलो", "open", "send", "bhejo")
                  if (qWords.any { g.contains(it) } && actWords.none { g.contains(it) }) {
                      agentJob?.cancel() ; isRunning = true ; autoCollapseBar(false)
                      agentJob = scope.launch {
                          statusTv.text = "🔍 Google Search se sahi jawab nikal raha hoon..."
                          speakOut("Ek second, abhi pata karke batata hoon")
                          val ans = askGoogleSearchDirect(goal)
                          val finalMsg = ans.ifEmpty { "Abhi jankari nahi mil payi, kripya dobara puchein." }
                          speakOut(finalMsg)
                          stopAgent("🧠 $finalMsg")
                      }
                      return true
                  }

                  if ((g.contains("youtube") || g.contains("यूट्यूब") || g.contains("song") || g.contains("गाना") || g.contains("episode") || g.contains("video")) &&
                      (g.contains("chala") || g.contains("चला") || g.contains("play") || g.contains("search") || g.contains("लगाओ"))) {
                      val q = g.replace("youtube par", "").replace("यूट्यूब पर", "").replace("youtube", "").replace("यूट्यूब", "")
                          .replace("chalao", "").replace("chala do", "").replace("चलाओ", "").replace("play karo", "").replace("play", "")
                          .replace("search karo", "").replace("लगाओ", "").trim()
                      if (q.length >= 2) {
                          agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                          agentJob = scope.launch {
                              statusTv.text = "▶️ YouTube par '$q' chala raha hoon..."
                              speakOut("YouTube par $q chala raha hoon")
                              fireDirectIntent("youtube_search", q)
                              delay(2600)
                              var hit = findFirstOrganicYouTubeVideo(rootInActiveWindow)
                              if (hit == null) {
                                  performSwipe("up") ; delay(700)
                                  hit = findFirstOrganicYouTubeVideo(rootInActiveWindow)
                              }
                              if (hit != null) {
                                  performTap(hit.first.first.toFloat(), hit.first.second.toFloat())
                                  delay(400)
                                  speakOut("Chala diya hai: ${hit.second}")
                                  stopAgent("▶️ Playing: ${hit.second}")
                              } else {
                                  stopAgent("▶️ YouTube Search: '$q'")
                              }
                          }
                          return true
                      }
                  }

                  val isSimpleOpen = !g.contains("search") && !g.contains("bhejo") && !g.contains("message") && !g.contains("par ")
                  val cleanTarget = extractOpenTarget(g)
                  if (isSimpleOpen && cleanTarget.isNotEmpty() && (g.contains("open") || g.contains("khol") || g.contains("खोल") || appCacheMap.containsKey(cleanTarget))) {
                      if (openAppByName(cleanTarget)) {
                          speakOut("$cleanTarget khol diya hai") ; stopAgent("🚀 '$cleanTarget' (<0.01s) khul gaya!") ; return true
                      }
                  }
                  return false
              }

              private fun findPackageInstant(appName: String): String? {
                  val clean = appName.trim().lowercase()
                  if (clean.isEmpty()) return null
                  synchronized(appCacheMap) {
                      appCacheMap[clean]?.let { return it }
                      for ((label, pkg) in appCacheMap) if (label.contains(clean) || clean.contains(label)) return pkg
                  }
                  return null
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  if (!isResumeWithCorrection && tryOfflineInstantReflex(currentGoal)) return
                  agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                  history.clear() ; executedSignatures.clear() ; failedTargets.clear() ; collectedNotes = ""

                  agentJob = scope.launch {
                      var aiConsultCount = 0
                      var emptyReplyRetries = 0
                      val stepQueue = mutableListOf<JSONObject>()

                      while (isRunning && aiConsultCount < 25) {
                          while (stepQueue.isNotEmpty() && isRunning) {
                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")
                              if (act == "done") {
                                  val msg = step.optString("message", collectedNotes.ifEmpty { "Kaam poora ho gaya!" })
                                  speakOut(msg) ; stopAgent("✅ $msg") ; return@launch
                              }
                              if (!executeLocalStep(step)) { stepQueue.clear() ; break }
                          }
                          if (!isRunning) break

                          val dialogPos = waitForKeywordOnScreen("while using the app|allow|अनुमति दें|continue|skip|not now|got it", 220L)
                          if (dialogPos != null && !executedSignatures.contains("dlg_${dialogPos.first}_${dialogPos.second}")) {
                              executedSignatures.add("dlg_${dialogPos.first}_${dialogPos.second}")
                              performTap(dialogPos.first.toFloat(), dialogPos.second.toFloat())
                              delay(500)
                          }

                          aiConsultCount++
                          statusTv.text = "⚡ Yantra ($lastWorkingModel) Step #$aiConsultCount..."
                          delay(120)

                          val (screenSnapshot, _) = readScreenElementsWithSignature()
                          val dm = resources.displayMetrics
                          val prompt = YantraBrain.buildActionPrompt(
                              dm.widthPixels, dm.heightPixels, getRedmiPhoneStatus(false),
                              SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date()),
                              currentGoal, liveUserCorrection, researchedContext, collectedNotes,
                              installedAiAppsList.joinToString(", "), cachedAppNamesSummary,
                              "", latestNotificationText, history.joinToString(" -> ").ifEmpty { "None" },
                              failedTargets.joinToString(","), emptyReplyRetries, screenSnapshot
                          )
                          val nextDecision = callGeminiAPI(prompt, false, null, "FAST_ACTION", 2048)
                          if (!isRunning) break

                          val note = nextDecision.optString("save_note", "").trim()
                          if (note.isNotEmpty()) collectedNotes = if (collectedNotes.isEmpty()) note else "$collectedNotes | $note"

                          val speakTxt = nextDecision.optString("speak", "").trim()
                          if (speakTxt.isNotEmpty()) planPreviewTv.text = "🗣️ $speakTxt"

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "done") {
                              val m = nextDecision.optString("message", speakTxt.ifEmpty { collectedNotes.ifEmpty { "Kaam poora ho gaya!" } })
                              speakOut(m) ; stopAgent("✅ $m") ; break
                          }

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              emptyReplyRetries = 0
                              for (i in 0 until arr.length()) stepQueue.add(arr.getJSONObject(i))
                          } else if (topAct.isNotEmpty() && topAct != "wait") {
                              emptyReplyRetries = 0
                              stepQueue.add(nextDecision)
                          } else {
                              emptyReplyRetries++
                              if (emptyReplyRetries >= 3) {
                                  val fallbackAns = askGoogleSearchDirect(currentGoal)
                                  if (fallbackAns.isNotEmpty()) {
                                      speakOut(fallbackAns)
                                      stopAgent("🧠 $fallbackAns")
                                  } else {
                                      stopAgent("⚠️ Screen par aage ka rasta nahi mila, kripya dobara bolein.")
                                  }
                                  break
                              }
                              delay(450)
                          }
                      }
                  }
              }

              private suspend fun executeLocalStep(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val target = step.optString("target", step.optString("app_name", ""))
                  val text = step.optString("text", step.optString("data", ""))
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  val sig = "$action:${target.lowercase()}:${text.lowercase()}"
                  if ((action == "type" || action == "direct_intent" || action == "open_app") && executedSignatures.contains(sig)) {
                      history.add("SKIPPED_REPEAT($sig)")
                      performSwipe("up") ; delay(350)
                      return true
                  }
                  executedSignatures.add(sig)
                  history.add("$action(${target.ifEmpty { text }})")
                  if (history.size > 10) history.removeAt(0)

                  when (action) {
                      "open_app" -> {
                          val ok = openAppByName(step.optString("app_name", target))
                          if (ok) delay(1200) else failedTargets.add(target)
                          return ok
                      }
                      "open_setting" -> return openRedmiSetting(step.optString("setting_name", target))
                      "direct_intent" -> {
                          val iType = step.optString("intent_type", target).ifEmpty { "web_search" }
                          val ok = fireDirectIntent(iType, text.ifEmpty { target })
                          if (ok) delay(1500)
                          return ok
                      }
                      "scroll_down" -> { performSwipe("up") ; delay(320) ; return true }
                      "scroll_up" -> { performSwipe("down") ; delay(320) ; return true }
                      "click" -> {
                          if (targetId > 0 || (x > 0 && y > 0)) { performSmartClick(targetId, x, y) ; delay(500) ; return true }
                          waitForKeywordOnScreen(target, 900L)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(500) ; return true }
                          failedTargets.add(target)
                          return false
                      }
                      "type" -> {
                          val ok = performSmartType(targetId, x, y, text, step.optBoolean("press_enter", true))
                          if (ok) delay(1000) else failedTargets.add("type:$text")
                          return ok
                      }
                      "system_control" -> return executeSystemControl(step.optString("command", target))
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK) ; delay(400) ; return true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME) ; delay(400) ; return true }
                  }
                  return false
              }

              private suspend fun waitForKeywordOnScreen(keywordsPipe: String, timeoutMs: Long): Pair<Int, Int>? {
                  val keys = keywordsPipe.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (keys.isEmpty()) return null
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < timeoutMs && isRunning) {
                      rootInActiveWindow?.let { searchKeywordInTree(it, keys)?.let { pos -> return pos } }
                      delay(65)
                  }
                  return null
              }

              private fun searchKeywordInTree(node: AccessibilityNodeInfo?, keys: List<String>): Pair<Int, Int>? {
                  if (node == null || !node.isVisibleToUser) return null
                  val r = Rect() ; node.getBoundsInScreen(r)
                  if (r.width() > 10 && r.height() > 10 && r.centerY() > 80) {
                      val all = "${node.text ?: ""} ${node.contentDescription ?: ""} ${node.viewIdResourceName ?: ""}".lowercase()
                      for (k in keys) if (all.contains(k)) return Pair(r.centerX(), r.centerY())
                  }
                  for (i in 0 until node.childCount) searchKeywordInTree(node.getChild(i), keys)?.let { return it }
                  return null
              }

              fun openRedmiSetting(settingName: String): Boolean {
                  return try {
                      val s = settingName.lowercase()
                      val action = when {
                          s.contains("wifi") -> Settings.ACTION_WIFI_SETTINGS
                          s.contains("bluetooth") -> Settings.ACTION_BLUETOOTH_SETTINGS
                          s.contains("storage") -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                          s.contains("display") -> Settings.ACTION_DISPLAY_SETTINGS
                          else -> Settings.ACTION_SETTINGS
                      }
                      startActivity(Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) ; true
                  } catch (e: Exception) { false }
              }

              fun fireDirectIntent(intentType: String, data: String): Boolean {
                  return try {
                      val cleanData = safeUrl(data)
                      val intent = when (intentType.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply { setPackage("com.google.android.youtube") ; putExtra("query", cleanData) }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("$proto$googleWebHost/search?q=${Uri.encode(cleanData)}"))
                          "open_url" -> Intent(Intent.ACTION_VIEW, Uri.parse(if (cleanData.startsWith("http")) cleanData else "$proto$cleanData"))
                          else -> null
                      }
                      if (intent != null) { intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) ; startActivity(intent) ; true } else false
                  } catch (e: Exception) { false }
              }

              private suspend fun callGeminiAPI(
                  prompt: String, useGoogleSearch: Boolean, base64Image: String?, taskCategory: String, maxTokensOverride: Int = 2048
              ): JSONObject = withContext(Dispatchers.IO) {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val keyList = (prefs.getString("apiKey", "") ?: "").split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  if (keyList.isEmpty()) return@withContext JSONObject().put("action", "done").put("message", "Save API Key in ⚙️")

                  val now = System.currentTimeMillis()
                  val models = mutableListOf<String>()
                  if ((rateLimitedUntilMap[lastWorkingModel] ?: 0L) < now) models.add(lastWorkingModel)
                  for (m in fastActionModels) if (!models.contains(m) && (rateLimitedUntilMap[m] ?: 0L) < now) models.add(m)
                  if (models.isEmpty()) models.addAll(fastActionModels)

                  for (keyAttempt in keyList.indices) {
                      val activeKey = keyList[(currentApiKeyIndex + keyAttempt) % keyList.size]
                      for (modelName in models) {
                          var conn: HttpURLConnection? = null
                          try {
                              val cleanEndpoint = safeUrl("$proto$googleApiHost/v1beta/models/$modelName:generateContent?key=$activeKey")
                              conn = URL(cleanEndpoint).openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("Content-Type", "application/json")
                              conn.connectTimeout = 4500 ; conn.readTimeout = 9000 ; conn.doOutput = true

                              val genCfg = JSONObject().apply {
                                  put("responseMimeType", "application/json")
                                  put("temperature", 0.1)
                                  put("maxOutputTokens", maxTokensOverride.coerceAtLeast(1024))
                              }
                              val body = JSONObject().apply {
                                  put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                                  put("generationConfig", genCfg)
                              }
                              conn.outputStream.use { it.write(body.toString().toByteArray()) }
                              if (conn.responseCode == 200) {
                                  val resText = conn.inputStream.bufferedReader().readText()
                                  val text = JSONObject(resText).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).optString("text", "{}")
                                  val s = text.indexOf('{') ; val e = text.lastIndexOf('}')
                                  if (s != -1 && e > s) {
                                      val parsed = JSONObject(text.substring(s, e + 1))
                                      if (parsed.has("steps") || parsed.has("action")) {
                                          lastWorkingModel = modelName
                                          prefs.edit().putString("lastFastModel", modelName).apply()
                                          saveBrainLog("OK [$modelName | $taskCategory]")
                                          return@withContext parsed
                                      }
                                  }
                              } else if (conn.responseCode == 429) {
                                  rateLimitedUntilMap[modelName] = System.currentTimeMillis() + 60_000L
                              }
                          } catch (e: Exception) {} finally { try { conn?.disconnect() } catch (e: Exception) {} }
                      }
                  }
                  return@withContext JSONObject().put("action", "wait")
              }

              private suspend fun performSmartClick(id: Int, x: Int, y: Int) {
                  nodeMap[id]?.let { n ->
                      val r = Rect() ; n.getBoundsInScreen(r)
                      if (r.centerX() > 0 && r.centerY() > 0) { performTap(r.centerX().toFloat(), r.centerY().toFloat()) ; return }
                  }
                  if (x > 0 && y > 0) performTap(x.toFloat(), y.toFloat())
              }

              private suspend fun performSmartType(id: Int, x: Int, y: Int, text: String, pressEnter: Boolean): Boolean {
                  var targetNode: AccessibilityNodeInfo? = nodeMap[id]
                  val startWait = System.currentTimeMillis()
                  while (targetNode == null && System.currentTimeMillis() - startWait < 800L && isRunning) {
                      rootInActiveWindow?.let { targetNode = findEditableNode(it) }
                      if (targetNode == null) delay(50)
                  }
                  val node = targetNode ?: return false
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                  var typed = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                  if (!typed) { copyToClipboard(text) ; typed = node.performAction(AccessibilityNodeInfo.ACTION_PASTE) }
                  if (pressEnter) {
                      delay(130)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  }
                  return typed
              }

              private fun findEditableNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var focused: AccessibilityNodeInfo? = null ; var any: AccessibilityNodeInfo? = null
                  fun search(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      if (node.isEditable) {
                          if (node.isFocused) { focused = node ; return }
                          if (any == null) any = node
                      }
                      for (i in 0 until node.childCount) { search(node.getChild(i)) ; if (focused != null) return }
                  }
                  search(root)
                  return focused ?: any
              }

              private fun readScreenElementsWithSignature(): Pair<String, String> {
                  nodeMap.clear()
                  val root = rootInActiveWindow ?: return Pair("Empty", "empty")
                  val dm = resources.displayMetrics
                  val list = mutableListOf<String>()
                  var nextId = 1
                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || nextId > 110) return
                      val rect = Rect() ; node.getBoundsInScreen(rect)
                      val text = (node.text ?: node.contentDescription ?: "").toString().trim()
                      if (text.isNotEmpty() || node.isEditable || node.isClickable) {
                          val cx = rect.centerX() ; val cy = rect.centerY()
                          if (cx in 5..(dm.widthPixels - 5) && cy in 75..(dm.heightPixels - 15)) {
                              val id = nextId++
                              nodeMap[id] = node
                              list.add("#$id '${text.take(75)}' at ($cx,$cy)")
                          }
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }
                  traverse(root)
                  return Pair(list.joinToString("\n"), "${list.size}")
              }

              fun stopAgent(finalText: String) {
                  isRunning = false ; agentJob?.cancel() ; nodeMap.clear()
                  setWindowGhostMode(false) ; statusTv.text = finalText ; autoCollapseBar(false)
                  if (isWakeWordEnabled && !isManualMicOpen) scope.launch { delay(300) ; startHeyYantraWakeLoop() }
              }

              private suspend fun performTap(x: Float, y: Float) {
                  vibrateTick(12) ; setWindowGhostMode(true) ; delay(25)
                  val path = Path().apply { moveTo(x, y) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 48)).build(), null, null)
                  delay(55) ; setWindowGhostMode(false)
              }

              private suspend fun performSwipe(direction: String) {
                  setWindowGhostMode(true) ; delay(25)
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f ; val topY = dm.heightPixels * 0.22f ; val botY = dm.heightPixels * 0.76f
                  val path = Path().apply {
                      if (direction == "down") { moveTo(cx, topY) ; lineTo(cx, botY) }
                      else { moveTo(cx, botY) ; lineTo(cx, topY) }
                  }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 190)).build(), null, null)
                  delay(70) ; setWindowGhostMode(false)
              }

              fun executeSystemControl(cmd: String): Boolean {
                  return try {
                      val c = cmd.lowercase()
                      val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      when {
                          c.contains("torch_on") -> { cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, true) } ; true }
                          c.contains("torch_off") -> { cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, false) } ; true }
                          else -> false
                      }
                  } catch (e: Exception) { false }
              }

              private fun copyToClipboard(text: String) {
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("AIClip", text))
              }

              fun openAppByName(appName: String): Boolean {
                  val clean = extractOpenTarget(appName)
                  val pkg = findPackageInstant(clean) ?: return false
                  packageManager.getLaunchIntentForPackage(pkg)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      startActivity(it) ; return true
                  }
                  return false
              }

              private fun vibrateTick(ms: Long) {
                  try { (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }

              override fun onInterrupt() {}
              override fun onDestroy() {
                  if (instance == this) instance = null
                  stopHeyYantraWakeLoop() ; agentJob?.cancel()
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (e: Exception) {} }
                  tts?.shutdown() ; super.onDestroy()
              }
          }
          EOF

          # Auto-clean any Markdown links [text](http...) injected by mobile copy-paste across all generated files!
          find app -type f -exec sed -i -E 's/\[([^]]+)\]\(https?:\/\/[^)]+\)/\1/g' {} +
          sed -i -E 's/\[([^]]+)\]\(https?:\/\/[^)]+\)/\1/g' build.gradle settings.gradle gradle.properties

      - name: Install Gradle 8.5 & Build Both Twin APKs (Zero-Dot Archive Path)
        run: |
          P="https"
          G_HOST="services"
          G_DOM="gradle"
          G_TLD="org"
          Z_EXT="zip"
          curl -f -sL "$P://$G_HOST.$G_DOM.$G_TLD/distributions/gradle-8.5-bin.$Z_EXT" -o /tmp/gradle_pkg
          unzip -q /tmp/gradle_pkg
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace || {
            cp /tmp/default_brain.kt app/src/main/java/com/ai/phoneagent/YantraBrain.kt
            ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace
          }

      - name: Sync Verified YantraBrain.kt to Repo
        run: |
          git config user.name "Yantra-Auto-Modular"
          git config user.email "yantra-bot@localhost"
          git add yantra.keystore app/src/main/java/com/ai/phoneagent/YantraBrain.kt
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified modular YantraBrain.kt v33.1 [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Upload Yantra Alpha APK (Master Developer App)
        uses: actions/upload-artifact@v4
        with:
          name: Yantra-Alpha-APK
          path: app/build/outputs/apk/alpha/debug/app-alpha-debug.apk

      - name: Upload Yantra Beta APK (Twin Tester App)
        uses: actions/upload-artifact@v4
        with:
          name: Yantra-Beta-APK
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
