name: Build AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "AIPhoneAgent"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.phoneagent"
                  minSdk 26
                  targetSdk 34
                  versionCode 10
                  versionName "10.0-FINAL"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="AI Phone Commander"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VoiceActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".AgentService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestEnhancedWebAccessibility|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0F172A")) }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(42, 50, 42, 50)
                  }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#38BDF8") {
                      layout.addView(TextView(this).apply {
                          text = txt
                          textSize = size
                          setTextColor(Color.parseColor(color))
                          setPadding(0, 16, 0, 8)
                      })
                  }

                  fun makeInput(hintTxt: String, key: String): EditText {
                      return EditText(this).apply {
                          hint = hintTxt
                          setHintTextColor(Color.GRAY)
                          setTextColor(Color.WHITE)
                          setText(prefs.getString(key, ""))
                          layout.addView(this)
                      }
                  }

                  fun addBtn(txt: String, onClick: () -> Unit) {
                      layout.addView(Button(this).apply {
                          text = txt
                          setOnClickListener { onClick() }
                      })
                  }

                  addLabel("👑 AI Phone Commander 10.0 (FINAL)\n(All 90 Fixes + Self-Learning Brain)", 20f, "#38BDF8")
                  val apiInput = makeInput("Gemini API Keys (Multiple keys comma ',' se jodein)", "apiKey")
                  addBtn("💾 Save Gemini API Key(s)") {
                      val cleaned = apiInput.text.toString().replace("\\s".toRegex(), "")
                      prefs.edit().putString("apiKey", cleaned).apply()
                      Toast.makeText(this, "API Key(s) Saved!", Toast.LENGTH_SHORT).show()
                  }

                  addBtn("🎤 1. Enable Voice Mic Permission") {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                      } else Toast.makeText(this, "Mic ON hai!", Toast.LENGTH_SHORT).show()
                  }

                  addBtn("🪟 2. Enable Floating Window Permission") {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else Toast.makeText(this, "Floating ON hai!", Toast.LENGTH_SHORT).show()
                  }

                  addBtn("🔋 3. Disable Battery Restriction (Never Kill AI)") {
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                              startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                          } else Toast.makeText(this, "Battery Unrestricted ON hai!", Toast.LENGTH_SHORT).show()
                      } catch (_: Exception) {}
                  }

                  addBtn("🤖 4. Enable Accessibility Service (Main Haath)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  addLabel("🔐 Personal Data Vault (Auto Form & UPI Fill):", 15f, "#4ADE80")
                  val vName = makeInput("Full Name (Aapka Naam)", "vaultName")
                  val vContact = makeInput("Phone & Email", "vaultContact")
                  val vUpi = makeInput("UPI ID (name@upi)", "vaultUpi")
                  val vSkills = makeInput("Skills / Work (Video Editing, Writing, etc.)", "vaultSkills")
                  val vDocs = makeInput("Address / Docs / Rules", "userMemory")

                  addBtn("🔐 Save Personal Vault") {
                      prefs.edit()
                          .putString("vaultName", vName.text.toString().trim())
                          .putString("vaultContact", vContact.text.toString().trim())
                          .putString("vaultUpi", vUpi.text.toString().trim())
                          .putString("vaultSkills", vSkills.text.toString().trim())
                          .putString("userMemory", vDocs.text.toString().trim())
                          .apply()
                      Toast.makeText(this, "Vault Saved!", Toast.LENGTH_SHORT).show()
                  }

                  val backupRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  backupRow.addView(Button(this).apply {
                      text = "📤 Copy Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          val obj = JSONObject().apply {
                              listOf("apiKey", "vaultName", "vaultContact", "vaultUpi", "vaultSkills", "userMemory", "activeMission", "learnedPaths").forEach {
                                  put(it, prefs.getString(it, ""))
                              }
                          }
                          val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cb.setPrimaryClip(ClipData.newPlainText("AIBackup", obj.toString()))
                          Toast.makeText(this@MainActivity, "Backup Copied!", Toast.LENGTH_LONG).show()
                      }
                  })
                  backupRow.addView(Button(this).apply {
                      text = "📥 Restore Backup"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          try {
                              val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val txt = cb.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                              val obj = JSONObject(txt)
                              val ed = prefs.edit()
                              listOf("apiKey", "vaultName", "vaultContact", "vaultUpi", "vaultSkills", "userMemory", "activeMission", "learnedPaths").forEach {
                                  ed.putString(it, obj.optString(it, ""))
                              }
                              ed.apply()
                              recreate()
                              Toast.makeText(this@MainActivity, "Backup Restored!", Toast.LENGTH_SHORT).show()
                          } catch (_: Exception) {
                              Toast.makeText(this@MainActivity, "Valid Backup JSON copy karein!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  })
                  layout.addView(backupRow)

                  addLabel("🧠 Active Mission, Learned Paths & Brain Logs:", 14f, "#FBBF24")
                  layout.addView(TextView(this).apply {
                      val m = prefs.getString("activeMission", "None")
                      val lp = prefs.getString("learnedPaths", "None")
                      val l = prefs.getString("brainLogs", "No logs yet.")
                      text = "🎯 Mission: $m\n⚡ Learned: $lp\n\n📜 Logs:\n$l"
                      setTextColor(Color.LTGRAY)
                      textSize = 11.5f
                  })

                  scroll.addView(layout)
                  setContentView(scroll)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/VoiceActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.view.WindowManager
          import android.widget.Toast

          class VoiceActivity : Activity() {
              private var isInterruptMode = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL)
                  isInterruptMode = intent.getBooleanExtra("INTERRUPT_MODE", false)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 201)
                  } else launchVoice()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 201 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      launchVoice()
                  } else {
                      Toast.makeText(this, "Mic permission zaroori hai!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              private fun launchVoice() {
                  try {
                      val promptText = if (isInterruptMode) "✋ AI ruk gaya hai! Bataiye ab kya karna hai?" else "👑 Boliye, kya kaam ya challenge karna hai?"
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf("en-IN", "hi-IN"))
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_PROMPT, promptText)
                      }
                      startActivityForResult(intent, 200)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Google Voice app nahi mila!", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val spoken = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()?.trim() ?: ""
                      if (spoken.isNotEmpty()) {
                          AgentService.instance?.onVoiceCommandReceived(spoken, isInterruptMode)
                      }
                  }
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/AgentService.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.HardwareBuffer
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.text.TextUtils
          import android.util.Base64
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.accessibility.AccessibilityWindowInfo
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AgentService : AccessibilityService() {

              companion object {
                  var instance: AgentService? = null
              }

              private lateinit var windowManager: WindowManager
              private var floatingLayout: LinearLayout? = null
              private lateinit var topRow: LinearLayout
              private lateinit var planPreviewTv: TextView
              private lateinit var inputRow: LinearLayout
              private lateinit var dragBtn: TextView
              private lateinit var statusTv: TextView
              private lateinit var cmdInput: EditText
              private lateinit var clearInputBtn: TextView
              private lateinit var interruptBtn: TextView
              private lateinit var pauseResumeBtn: TextView
              private lateinit var missionBtn: TextView
              private lateinit var vaultOpenBtn: TextView
              private lateinit var micBtn: TextView
              private lateinit var actionBtn: TextView
              private lateinit var ttsToggleBtn: TextView
              private lateinit var stopBtn: TextView
              private lateinit var minBtn: TextView
              private lateinit var params: WindowManager.LayoutParams

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var agentJob: Job? = null
              private var isRunning = false
              private var isPaused = false
              private var isMinimized = false
              private var isVoiceEnabled = true
              private var currentGoal = ""
              private var liveUserCorrection = ""
              private var researchedContext = ""
              private var latestNotificationText = ""
              private var lastScreenshotTime = 0L

              private val history = mutableListOf<String>()
              private val recentActionSignatures = mutableListOf<String>()
              private val failedTargets = mutableSetOf<String>()
              private val nodeMap = mutableMapOf<Int, AccessibilityNodeInfo>()
              private var tts: TextToSpeech? = null

              private val modelList = listOf(
                  "gemini-2.5-flash",
                  "gemini-2.5-flash-lite",
                  "gemini-3.5-flash-lite",
                  "gemini-3-flash-preview",
                  "gemini-2.5-pro",
                  "gemini-2.0-flash",
                  "gemini-1.5-flash"
              )
              private val deadModels = mutableSetOf<String>()
              private var currentModelIndex = 0
              private var currentApiKeyIndex = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try { saveBrainLog("CRASH_GUARD: ${e.message}") } catch (_: Exception) {}
                      defaultHandler?.uncaughtException(t, e)
                  }
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("hi", "IN"))
                          tts?.setSpeechRate(1.18f)
                          tts?.setPitch(1.02f)
                      }
                  }
                  createMovableFloatingBar()
              }

              private fun speakOut(text: String) {
                  if (!isVoiceEnabled || text.isBlank()) return
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  if (am.isMusicActive && !text.contains("रोक") && !text.contains("मदद")) return
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
              }

              // Hardware Volume-Down Button se bina screen chhue "Toko" Interrupt
              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN && isRunning) {
                      vibrateTick(120)
                      triggerImmediateInterruptAndListen(openVoice = true)
                      return true
                  }
                  return super.onKeyEvent(event)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val view = floatingLayout ?: return
                  val dm = resources.displayMetrics
                  params.width = if (isMinimized && !isRunning) WindowManager.LayoutParams.WRAP_CONTENT else (dm.widthPixels * 0.96).toInt()
                  params.x = params.x.coerceIn(0, dm.widthPixels - 120)
                  params.y = params.y.coerceIn(20, dm.heightPixels - 160)
                  try { windowManager.updateViewLayout(view, params) } catch (_: Exception) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: ""
                      val txt = event.text.joinToString(" ").trim()
                      if (txt.isNotEmpty() && pkg != packageName) {
                          latestNotificationText = "[$pkg] $txt"
                      }
                  }
              }

              fun onVoiceCommandReceived(spoken: String, wasInterrupted: Boolean) {
                  scope.launch {
                      tts?.stop()
                      agentJob?.cancel()
                      isRunning = false
                      isPaused = false
                      cmdInput.setText(spoken)
                      if (wasInterrupted && currentGoal.isNotBlank()) {
                          liveUserCorrection = spoken
                          history.add("USER_INTERRUPTED: \"$spoken\"")
                          statusTv.setTextColor(Color.parseColor("#FBBF24"))
                          statusTv.text = "✋ Sudhar: '$spoken'"
                          startGeniusAgent(isResumeWithCorrection = true)
                      } else {
                          currentGoal = spoken
                          liveUserCorrection = ""
                          startGeniusAgent(isResumeWithCorrection = false)
                      }
                  }
              }

              private fun triggerImmediateInterruptAndListen(openVoice: Boolean) {
                  tts?.stop()
                  agentJob?.cancel()
                  isRunning = false
                  isPaused = false
                  setWindowGhostMode(false)
                  autoCollapseBar(false)
                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                  statusTv.text = "✋ AI ruk gaya! Bolein ya likhein kya sudhar karna hai..."
                  planPreviewTv.text = "💡 Vol-Down ya ✋ se roka gaya (Purana kaam yaad hai)"
                  setTouchPassThrough(false)
                  if (openVoice) {
                      startActivity(Intent(this, VoiceActivity::class.java).apply {
                          putExtra("INTERRUPT_MODE", true)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                  } else cmdInput.requestFocus()
              }

              private fun makePillButton(label: String, bgColor: String): TextView {
                  return TextView(this).apply {
                      text = label
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(14, 8, 14, 8)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(bgColor))
                          cornerRadius = 18f
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(4, 0, 0, 0) }
                  }
              }

              private fun createMovableFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (_: Exception) {} }

                  val dm = resources.displayMetrics
                  params = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.96).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (dm.widthPixels * 0.02).toInt()
                      y = (dm.heightPixels * 0.70).toInt()
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(12, 8, 12, 8)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#EE0F172A"))
                          cornerRadius = 26f
                          setStroke(2, Color.parseColor("#38BDF8"))
                      }
                  }
                  floatingLayout = container

                  topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  dragBtn = makePillButton("✥", "#1E293B")
                  var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
                  val dragListener = View.OnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x; initY = params.y; touchX = ev.rawX; touchY = ev.rawY; true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val curDm = resources.displayMetrics
                              params.x = (initX + (ev.rawX - touchX).toInt()).coerceIn(0, curDm.widthPixels - 120)
                              params.y = (initY + (ev.rawY - touchY).toInt()).coerceIn(20, curDm.heightPixels - 160)
                              try { windowManager.updateViewLayout(container, params) } catch (_: Exception) {}
                              true
                          }
                          else -> false
                      }
                  }
                  dragBtn.setOnTouchListener(dragListener)

                  statusTv = TextView(this).apply {
                      text = "👑 AI 10.0: Bolein/Likhein (Vol-Down ya ✋ se Tokein)"
                      setTextColor(Color.parseColor("#4ADE80"))
                      textSize = 11f
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener(dragListener)
                  }

                  interruptBtn = makePillButton("✋", "#D97706").apply {
                      setOnClickListener { triggerImmediateInterruptAndListen(openVoice = true) }
                  }
                  pauseResumeBtn = makePillButton("⏸", "#0284C7").apply {
                      setOnClickListener {
                          if (!isRunning) return@setOnClickListener
                          isPaused = !isPaused
                          text = if (isPaused) "▶" else "⏸"
                          statusTv.text = if (isPaused) "⏸ AI Paused (▶ se Resume karein)" else "⚡ Resumed..."
                      }
                  }
                  missionBtn = makePillButton("🎯", "#7C3AED").apply {
                      setOnClickListener {
