                  val testModels = listOf("gemini-2.5-flash-lite", "gemini-flash-lite-latest", "gemini-2.5-flash")
                  for (k in keys) {
                      var keyWorked = false
                      for (mName in testModels) {
                          if (keyWorked) break
                          var conn: HttpURLConnection? = null
                          try {
                              val cleanEndpoint = safeUrl("$proto$googleApiHost/v1beta/models/$mName:generateContent?key=$k")
                              conn = URL(cleanEndpoint).openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("Content-Type", "application/json")
                              conn.connectTimeout = 5000 ; conn.readTimeout = 5000 ; conn.doOutput = true
                              conn.outputStream.use { it.write("""{"contents":[{"parts":[{"text":"hi"}]}]}""".toByteArray()) }
