              private fun getRedmiPhoneStatus(speakHindi: Boolean = false): String {
                  return try {
                      val stat = StatFs(Environment.getDataDirectory().path)
                      val totalGb = (stat.totalBytes / (1024.0 * 1024.0 * 1024.0)).toInt()
                      val freeGb = String.format(Locale.US, "%.1f", stat.availableBytes / (1024.0 * 1024.0 * 1024.0))
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(mem)
                      val totalRam = String.format(Locale.US, "%.1f", mem.totalMem / (1024.0 * 1024.0 * 1024.0))
                      val freeRam = String.format(Locale.US, "%.1f", mem.availMem / (1024.0 * 1024.0 * 1024.0))
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val bat = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      val curVol = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
                      val maxVol = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      val dm = resources.displayMetrics
                      if (speakHindi) {
                          "Aapke Redmi Note 10S mein $bat percent battery hai, $totalGb GB mein se $freeGb GB storage khali hai, aur $totalRam GB mein se $freeRam GB RAM free hai."
                      } else {
                          "Device: Xiaomi Redmi Note 10S (${Build.MODEL}, ${dm.widthPixels}x${dm.heightPixels}) | Battery: $bat% | Storage: $freeGb/$totalGb GB free | RAM: $freeRam/$totalRam GB free | MediaVol: $curVol/$maxVol"
                      }
                  } catch (e: Exception) { "Xiaomi Redmi Note 10S" }
              }

              private fun tryOfflineInstantReflex(goal: String): Boolean {
                  val g = goal.trim().lowercase()
                  val hasMultiStep = g.contains(" और ") || g.contains(" and ") || g.contains(" फिर ") || g.contains(" ke baad ") || g.contains(" phir ")
                  if (hasMultiStep) return false

                  if (g.contains("torch") || g.contains("toch") || g.contains("torc") || g.contains("टॉर्च") || g.contains("flash") || g.contains("फ्लैश") || g.contains("light")) {
                      if (g.contains("off") || g.contains("of") || g.contains("band") || g.contains("बंद") || g.contains("buja")) {
                          executeSystemControl("torch_off") ; speakOut("Torch band kar di hai") ; stopAgent("🔦 Torch OFF!") ; return true
                      } else if (g.contains("on") || g.contains("jala") || g.contains("जला") || g.contains("chalu") || g.contains("चालू") || g.contains("khol")) {
                          executeSystemControl("torch_on") ; speakOut("Torch chalu kar di hai") ; stopAgent("🔦 Torch ON!") ; return true
                      }
                  }

                  val isHardwareQuery = listOf(
                      "storage", "stronge", "storge", "storeg", "स्टोरेज",
                      "kitni ram", "ram kitn", "कितनी रैम", "रैम कित",
                      "battery", "betery", "batry", "बैटरी", "phone status", "kundali"
                  ).any { g.contains(it) }
                  if (isHardwareQuery && !g.contains("setting")) {
                      val report = getRedmiPhoneStatus(true)
                      speakOut(report) ; stopAgent("📲 $report") ; return true
                  }

                  if (g.contains("scroll") || g.contains("स्क्रॉल") || g.contains("scrol") || g.contains("swipe") || g.contains("स्वाइप") || g == "niche karo" || g == "upar karo" || g == "नीचे करो" || g == "ऊपर करो") {
                      if (g.contains("lagataar") || g.contains("लगातार") || g.contains("loop") || g.contains("reels") || g.contains("shorts") || g.contains("रील्स")) {
                          agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                          agentJob = scope.launch {
                              for (i in 1..150) {
                                  if (!isRunning) break
                                  statusTv.text = "🔄 Lagataar Scroll (#$i) — rokne ke liye ✋ ya ⏹ dabayein"
                                  performSwipe("up") ; delay(4000L)
                              }
                              stopAgent("✅ Scroll poora hua!")
                          }
                          return true
                      }
                      val dir = when {
                          g.contains("up") || g.contains("upar") || g.contains("ऊपर") -> "down"
                          g.contains("left") || g.contains("baaye") || g.contains("बाएं") -> "left"
                          g.contains("right") || g.contains("daaye") || g.contains("दाएं") -> "right"
                          else -> "up"
                      }
                      scope.launch { performSwipe(dir) ; stopAgent("✅ Screen Scroll Kar Diya!") }
                      return true
                  }

                  // Direct YouTube Play without needing API
                  if ((g.contains("youtube") || g.contains("यूट्यूब")) && !needsDeepWebResearch(g) &&
                      (g.contains("chala") || g.contains("चला") || g.contains("play") || g.contains("search") || g.contains("सर्च") || g.contains("song") || g.contains("गाना"))) {
                      val query = g.replace("youtube", "").replace("यूट्यूब", "")
                          .replace("par", "").replace("per", "").replace("pe", "").replace("पर", "")
                          .replace("chalao", "").replace("chala do", "").replace("chala", "").replace("चलाओ", "")
                          .replace("search karo", "").replace("search", "").replace("play", "").trim()
                      if (query.length >= 2) {
                          agentJob?.cancel() ; isRunning = true ; autoCollapseBar(true)
                          agentJob = scope.launch {
                              statusTv.text = "▶️ YouTube par '$query' chala raha hoon..."
                              speakOut("YouTube par $query chala raha hoon")
                              fireDirectIntent("youtube_search", query)
                              delay(2800)
                              val pos = findNonAdVideoResult(query) ?: run { performSwipe("up") ; delay(1200) ; findNonAdVideoResult(query) }
                              if (pos != null) {
                                  performTap(pos.first.toFloat(), pos.second.toFloat())
                                  delay(1500)
                                  stopAgent("✅ '$query' (Non-Ad Video) Play Kar Diya!")
                              } else {
                                  stopAgent("✅ YouTube par '$query' khol diya!")
                              }
                          }
                          return true
                      }
                  }

                  when {
                      g == "back" || g == "go back" || g.contains("पीछे जाओ") || g.contains("बैक करो") -> { performGlobalAction(GLOBAL_ACTION_BACK) ; stopAgent("🔙 Back!") ; return true }
                      g == "home" || g == "go home" || g.contains("होम स्क्रीन") -> { performGlobalAction(GLOBAL_ACTION_HOME) ; stopAgent("🏠 Home!") ; return true }
                      g.contains("control center") || g.contains("कंट्रोल सेंटर") -> { executeSystemControl("miui_control_center") ; stopAgent("🎛️ MIUI Control Center!") ; return true }
                      g.contains("notification") || g.contains("नोटिफिकेशन") -> { executeSystemControl("notification") ; stopAgent("🔔 Notifications!") ; return true }
                      g.contains("आवाज़ बढ़ा") || g.contains("volume up") || g.contains("aawaz badha") -> { executeSystemControl("volume_up") ; executeSystemControl("volume_up") ; stopAgent("🔊 Volume Up!") ; return true }
                      g.contains("आवाज़ कम") || g.contains("volume down") || g.contains("aawaz kam") -> { executeSystemControl("volume_down") ; executeSystemControl("volume_down") ; stopAgent("🔉 Volume Down!") ; return true }
                      g.contains("hotspot") || g.contains("hotpot") || g.contains("हॉटस्पॉट") -> { openRedmiSetting("hotspot") ; speakOut("Hotspot setting khol di hai") ; stopAgent("📡 Hotspot Settings!") ; return true }
                      g.contains("wifi") || g.contains("wi-fi") || g.contains("वाईफाई") -> { openRedmiSetting("wifi") ; speakOut("Wi-Fi setting khol di hai") ; stopAgent("📶 Wi-Fi Settings!") ; return true }
                      g.contains("bluetooth") || g.contains("blutooth") || g.contains("ब्लूटूथ") -> { openRedmiSetting("bluetooth") ; speakOut("Bluetooth setting khol di hai") ; stopAgent("🔵 Bluetooth Settings!") ; return true }
                      g.contains("about phone") || g.contains("अबाउट फोन") -> { openRedmiSetting("about") ; speakOut("About phone khol diya hai") ; stopAgent("📱 About Phone!") ; return true }
                      g.contains("setting") || g.contains("seting") || g.contains("सेटिंग") -> { openRedmiSetting("settings") ; speakOut("Settings khol di hai") ; stopAgent("⚙️ Settings Opened!") ; return true }
                  }

                  if (g.endsWith("kholo") || g.endsWith("खोलो") || g.startsWith("open ")) {
                      val candidateApp = g.removePrefix("open ").removeSuffix("kholo").removeSuffix("खोलो").trim()
                      if (candidateApp.length >= 2 && openAppByName(candidateApp)) {
                          speakOut("$candidateApp khol diya hai")
                          stopAgent("📲 '$candidateApp' khul gaya!")
                          return true
                      }
                  }
                  return false
              }

              // SMART ON-DEVICE SCREEN MATCHER (Used ONLY if API key is leaked/missing so app still clicks visible screen buttons!)
              private suspend fun tryLocalScreenClickOrType(goal: String): Boolean {
                  readScreenElementsWithSignature()
                  val g = goal.trim().lowercase()
                  val cleanWords = g.replace("par click karo", "").replace("click karo", "").replace("dabayein", "")
                      .replace("dabao", "").replace("kholo", "").replace("खोलो", "").replace("दबाओ", "")
                      .split(" ", ",").map { it.trim() }.filter { it.length >= 2 }

                  for ((id, node) in nodeMap) {
                      val label = "${node.text ?: ""} ${node.contentDescription ?: ""}".lowercase()
                      if (label.isNotEmpty() && cleanWords.any { label.contains(it) }) {
                          val r = Rect() ; node.getBoundsInScreen(r)
                          performSmartClick(id, r.centerX(), r.centerY())
                          delay(1000)
                          return true
                      }
                  }
                  return false
              }

              private fun needsDeepWebResearch(cmd: String): Boolean {
                  val lower = cmd.lowercase()
                  return listOf("episode", "एपिसोड", "latest", "naya", "नया", "last", "aakhiri", "kamao", "कमाओ", "earning", "paisa", "पैसा", "challenge", "चैलेंज", "price", "rate", "news", "khabar", "research", "रिसर्च").any { lower.contains(it) }
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  if (!isResumeWithCorrection && tryOfflineInstantReflex(currentGoal)) return
                  agentJob?.cancel() ; isRunning = true
                  if (!isResumeWithCorrection) {
                      history.clear()
                      recentActionSignatures.clear()
                      failedTargets.clear()
                      researchedContext = ""
                  }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()
                      val redmiStatus = getRedmiPhoneStatus(false)
                      val stepQueue = mutableListOf<JSONObject>()

                      if (!isResumeWithCorrection && needsDeepWebResearch(currentGoal)) {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "🔍 Live Google Search se jankari nikaal raha hoon..."
                          val currentPkg = rootInActiveWindow?.packageName?.toString() ?: "home"
                          val masterPlan = researchAndPlanWithAI(currentGoal, vaultSummary, installedApps, currentPkg)
                          if (!isRunning) return@launch
                          researchedContext = masterPlan.optString("researched_info", "")
                          val missionPlan = masterPlan.optString("save_mission_plan", "")
                          if (missionPlan.isNotBlank()) {
                              getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                                  .edit().putString("activeMission", missionPlan).apply()
                          }
                          val speakMsg = masterPlan.optString("speak", "")
                          if (speakMsg.isNotEmpty()) speakOut(speakMsg)
                          val initialSteps = masterPlan.optJSONArray("steps")
                          if (initialSteps != null) {
                              for (i in 0 until initialSteps.length()) stepQueue.add(initialSteps.getJSONObject(i))
                          }
                      } else if (isResumeWithCorrection) {
                          speakOut("Theek hai, aapki baat maankar rasta badal raha hoon")
                      } else {
                          statusTv.setTextColor(Color.parseColor("#38BDF8"))
                          statusTv.text = "⚡ Redmi 10S Smart Flash-Live Brain shuru..."
                      }

                      var aiConsultCount = 0
                      var stuckCount = 0
                      var lastScreenSig = ""

                      while (isRunning) {
                          while (stepQueue.isNotEmpty() && isRunning) {
                              val step = stepQueue.removeAt(0)
                              val act = step.optString("action", "")
                              if (act == "done") {
                                  val doneMsg = step.optString("message", "Kaam poora ho gaya!")
                                  val pkgNow = rootInActiveWindow?.packageName?.toString()?.substringAfterLast(".") ?: "app"
                                  saveLearnedPath(currentGoal, pkgNow)
                                  speakOut(doneMsg) ; vibrateTick(280) ; stopAgent("✅ $doneMsg")
                                  return@launch
                              }
                              if (act == "ask_user") {
                                  val askMsg = step.optString("message", "Bhai, yeh hissa aap poora karke ▶ dabayein")
                                  val whyCant = step.optString("capability_note", "")
                                  val fullAlert = if (whyCant.isNotEmpty()) "$askMsg ($whyCant)" else askMsg
                                  speakOut(fullAlert) ; vibrateTick(320) ; pauseForUser("🤝 $fullAlert")
                                  return@launch
                              }
                              val ok = executeLocalStepWithVerification(step)
                              if (!ok || act == "click" || act == "type" || act == "open_app" || act == "direct_intent" || act == "open_setting") {
                                  stepQueue.clear()
                                  break
                              }
                          }
                          if (!isRunning) break

                          aiConsultCount++
                          if (aiConsultCount > 35) { stopAgent("✅ Is charan ka kaam poora ho gaya!") ; break }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "🧠 Brain ($lastWorkingModel): Screen aur agla button soch raha hoon..."
                          delay(400)

                          val (screenSnapshot, structSig) = readScreenElementsWithSignature()
                          if (structSig == lastScreenSig) stuckCount++ else { stuckCount = 0 ; lastScreenSig = structSig }

                          val needVision = stuckCount >= 1 || screenSnapshot.lines().size < 6
                          val screenshotB64 = if (needVision) captureScreenBase64() else null

                          val nextDecision = thinkLikeGeniusHuman(currentGoal, liveUserCorrection, researchedContext, vaultSummary, redmiStatus, installedApps, screenSnapshot, screenshotB64, stuckCount)
                          if (!isRunning) break
                          if (liveUserCorrection.isNotEmpty()) liveUserCorrection = ""

                          val chosenBtnInfo = nextDecision.optString("chosen_button_info", "")
                          val nextStepPlan = nextDecision.optString("next_step_plan", "")
                          val capabilityNote = nextDecision.optString("capability_note", "")
                          if (chosenBtnInfo.isNotEmpty() || nextStepPlan.isNotEmpty()) {
                              planPreviewTv.text = "🎯 [$lastWorkingModel] Button: $chosenBtnInfo | Aage: $nextStepPlan"
                          }

                          val topAct = nextDecision.optString("action", "")
                          if (topAct == "rate_limit") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ Flash models busy hain, 4 second intezaar..."
                              delay(4000) ; continue
                          } else if (topAct == "done") {
                              val m = nextDecision.optString("message", "Kaam poora ho gaya!")
                              val pkgNow = rootInActiveWindow?.packageName?.toString()?.substringAfterLast(".") ?: "app"
                              saveLearnedPath(currentGoal, pkgNow)
                              speakOut(m) ; vibrateTick(280) ; stopAgent("✅ $m") ; break
                          } else if (topAct == "ask_user") {
                              // If API key is leaked/error, first try clicking matching button on screen directly!
                              val m = nextDecision.optString("message", "Yahan aapki madad chahiye")
                              if (m.contains("Key", true) && tryLocalScreenClickOrType(currentGoal)) {
                                  stopAgent("✅ Local Screen Brain ne button click kar diya! (Lambi soch ke liye ⚙️ mein nayi API Key daalein)")
                                  break
                              }
                              val fullMsg = if (capabilityNote.isNotEmpty()) "$m — $capabilityNote" else m
                              speakOut(fullMsg) ; vibrateTick(320) ; pauseForUser("🤝 $fullMsg") ; break
                          }

                          val batchSpeak = nextDecision.optString("speak", "")
                          if (batchSpeak.isNotEmpty()) speakOut(batchSpeak)

                          val arr = nextDecision.optJSONArray("steps")
                          if (arr != null && arr.length() > 0) {
                              for (i in 0 until arr.length()) stepQueue.add(arr.getJSONObject(i))
                          } else if (topAct.isNotEmpty()) {
                              stepQueue.add(nextDecision)
                          } else {
                              stopAgent("✅ Kaam poora ho gaya!") ; break
                          }
                      }
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val nextHint = step.optString("next_step", "")
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val targetId = step.optInt("id", -1)
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  val lowerTarget = "$target $reason".lowercase()
                  val goalLower = currentGoal.lowercase()
                  if ((lowerTarget.contains("delete") || lowerTarget.contains("uninstall") || lowerTarget.contains("format")) &&
                      !goalLower.contains("delete") && !goalLower.contains("डिलीट") && !goalLower.contains("हटाओ") && !goalLower.contains("uninstall")) {
                      pauseForUser("🛡️ Safety Lock: '$reason' khatarnaak button hai. Agar dabana hai toh khud dabakar ▶ karein.")
                      return false
                  }

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  if (nextHint.isNotEmpty()) planPreviewTv.text = "🎯 Iske baad: $nextHint"

                  val pkgNow = rootInActiveWindow?.packageName?.toString()?.substringAfterLast(".") ?: "app"
                  val sig = "[$pkgNow]$action(#$targetId '$target')"
                  recentActionSignatures.add(sig)
                  history.add("[$pkgNow]$action(#$targetId '$target' $reason)")
                  if (history.size > 16) history.removeAt(0)

                  when (action) {
                      "open_app" -> { val opened = openAppByName(step.optString("app_name", target)) ; delay(2100) ; return opened }
                      "open_setting" -> { val ok = openRedmiSetting(step.optString("setting_name", target)) ; delay(2000) ; return ok }
                      "direct_intent" -> {
                          val intentType = step.optString("intent_type", "")
                          val data = step.optString("data", text)
                          val ok = fireDirectIntent(intentType, data)
                          delay(2300)
                          if (ok && intentType.lowercase() == "youtube_search" &&
                              (goalLower.contains("chala") || goalLower.contains("चला") || goalLower.contains("play") || goalLower.contains("song") || goalLower.contains("गाना") || goalLower.contains("video") || goalLower.contains("episode") || goalLower.contains("एपिसोड"))) {
                              delay(1600)
                              val pos = findNonAdVideoResult(data) ?: run { performSwipe("up") ; delay(1200) ; findNonAdVideoResult(data) }
                              if (pos != null) {
                                  performTap(pos.first.toFloat(), pos.second.toFloat())
                                  delay(1800)
                                  stopAgent("✅ Ad chhodkar asli video chala diya!")
                              }
                          }
                          return ok
                      }
                      "write_content" -> { copyToClipboard(text) ; val ok = performSmartType(targetId, x, y, text, step.optBoolean("press_enter", false)) ; delay(1400) ; return ok }
                      "scroll_loop" -> {
                          val dir = step.optString("direction", "up")
                          val sec = step.optInt("interval_sec", 4).coerceIn(2, 15)
                          for (i in 1..step.optInt("count", 150)) {
                              if (!isRunning) break
                              statusTv.text = "🔄 Lagataar Scroll (#$i) — rokne ke liye ✋ ya ⏹ dabayein"
                              performSwipe(dir) ; delay(sec * 1000L)
                          }
                          return true
                      }
                      "scroll_down" -> { for (i in 1..step.optInt("times", 1).coerceIn(1, 5)) { if (!isRunning) break ; performSwipe("up") ; delay(1000) } ; return true }
                      "scroll_up" -> { performSwipe("down") ; delay(1000) ; return true }
                      "swipe_left" -> { performSwipe("left") ; delay(900) ; return true }
                      "swipe_right" -> { performSwipe("right") ; delay(900) ; return true }
                      "double_tap" -> { val c = getCoordsForTarget(targetId, x, y) ; performDoubleTap(c.first.toFloat(), c.second.toFloat()) ; delay(1200) ; return true }
                      "long_press" -> { val c = getCoordsForTarget(targetId, x, y) ; performLongPress(c.first.toFloat(), c.second.toFloat()) ; delay(1200) ; return true }
                      "click" -> {
                          val beforePkg = rootInActiveWindow?.packageName?.toString() ?: ""
                          val clickedNode = nodeMap[targetId]
                          if (beforePkg == "com.google.android.youtube" && clickedNode != null && isAdElement(clickedNode)) {
                              performSwipe("up") ; delay(1100)
                              findNonAdVideoResult(currentGoal)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(1600) ; return true }
                              return false
                          }
                          if (targetId > 0 || (x > 0 && y > 0)) {
                              performSmartClick(targetId, x, y) ; delay(1500)
                              val afterPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                              if (beforePkg == "com.google.android.youtube" && afterPkg.contains("chrome")) {
                                  failedTargets.add("#$targetId($x,$y)")
                                  performGlobalAction(GLOBAL_ACTION_BACK) ; delay(1000) ; return false
                              }
                              return true
                          }
                          if (target.isNotEmpty()) {
                              waitForKeywordOnScreen(target, 2400L)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(1500) ; return true }
                          }
                          return false
                      }
                      "click_best_video" -> {
                          delay(1200)
                          val matchKw = step.optString("match_keywords", target)
                          val pos = findNonAdVideoResult(matchKw) ?: run { performSwipe("up") ; delay(1200) ; findNonAdVideoResult(matchKw) }
                          if (pos != null) { performTap(pos.first.toFloat(), pos.second.toFloat()) ; delay(1800) ; return true }
                          return false
                      }
                      "type" -> {
                          val pressEnter = step.optBoolean("press_enter", true)
                          if (target.isNotEmpty() && targetId <= 0 && x <= 0) {
                              waitForKeywordOnScreen(target, 2200L)?.let { performTap(it.first.toFloat(), it.second.toFloat()) ; delay(650) }
                          }
                          val ok = performSmartType(targetId, x, y, text, pressEnter) ; delay(1700) ; return ok
                      }
                      "system_control" -> { executeSystemControl(step.optString("command", target)) ; delay(900) ; return true }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK) ; delay(1000) ; return true }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME) ; delay(1000) ; return true }
                      "wait" -> { delay(step.optInt("seconds", 2).coerceIn(1, 10) * 1000L) ; return true }
                  }
                  return false
              }

