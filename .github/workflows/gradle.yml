name: Build AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "AIPhoneAgent"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.phoneagent"
                  minSdk 26
                  targetSdk 34
                  versionCode 16
                  versionName "12.0-COMPACT"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="AI Phone Commander 12.0"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceActivity" android:exported="false" android:excludeFromRecents="true" android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service android:name=".AgentService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0F172A")) }
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL ; setPadding(42, 50, 42, 50) }

                  fun addLabel(txt: String, size: Float = 15f, color: String = "#38BDF8") {
                      layout.addView(TextView(this).apply { text = txt ; textSize = size ; setTextColor(Color.parseColor(color)) ; setPadding(0, 16, 0, 8) })
                  }
                  fun makeInput(hintTxt: String, key: String): EditText {
                      return EditText(this).apply { hint = hintTxt ; setHintTextColor(Color.GRAY) ; setTextColor(Color.WHITE) ; setText(prefs.getString(key, "")) ; layout.addView(this) }
                  }
                  fun addBtn(txt: String, onClick: () -> Unit) {
                      layout.addView(Button(this).apply { text = txt ; setOnClickListener { onClick() } })
                  }

                  addLabel("👑 AI Phone Commander 12.0 (Flash & Live)", 19f, "#38BDF8")
                  val apiInput = makeInput("Yahan Gemini API Key daalein (AIza...)", "apiKey")
                  addBtn("💾 Save & Verify Key") {
                      val raw = apiInput.text.toString()
                      val finalKey = raw.replace("\\s".toRegex(), "")
                      prefs.edit().putString("apiKey", finalKey).apply()
                      apiInput.setText(finalKey)
                      Toast.makeText(this, if(finalKey.startsWith("AIza")) "✅ Key Saved!" else "⚠️ Check Key format!", Toast.LENGTH_SHORT).show()
                  }
                  addBtn("🎤 1. Mic Permission") {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101) else Toast.makeText(this, "Mic ON", Toast.LENGTH_SHORT).show()
                  }
                  addBtn("🪟 2. Floating Window Permission") {
                      if (!Settings.canDrawOverlays(this)) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) else Toast.makeText(this, "Floating ON", Toast.LENGTH_SHORT).show()
                  }
                  addBtn("🔋 3. Disable Battery Restriction") {
                      try {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))) else Toast.makeText(this, "Battery Unrestricted", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {}
                  }
                  addBtn("🤖 4. Accessibility Service") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }

                  addLabel("🔐 Personal Data Vault:", 15f, "#4ADE80")
                  val vName = makeInput("Full Name", "vaultName")
                  val vContact = makeInput("Phone & Email", "vaultContact")
                  val vUpi = makeInput("UPI ID", "vaultUpi")
                  val vSkills = makeInput("Skills", "vaultSkills")
                  val vDocs = makeInput("Address / Rules", "userMemory")
                  addBtn("🔐 Save Vault") {
                      prefs.edit().putString("vaultName", vName.text.toString().trim()).putString("vaultContact", vContact.text.toString().trim()).putString("vaultUpi", vUpi.text.toString().trim()).putString("vaultSkills", vSkills.text.toString().trim()).putString("userMemory", vDocs.text.toString().trim()).apply()
                      Toast.makeText(this, "Vault Saved!", Toast.LENGTH_SHORT).show()
                  }

                  scroll.addView(layout)
                  setContentView(scroll)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/VoiceActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.view.WindowManager
          import android.widget.Toast

          class VoiceActivity : Activity() {
              private var isInterruptMode = false
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL)
                  isInterruptMode = intent.getBooleanExtra("INTERRUPT_MODE", false)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 201)
                  } else launchVoice()
              }
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 201 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) launchVoice() else finish()
              }
              private fun launchVoice() {
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "👑 Boliye, kya kaam hai?")
                      }
                      startActivityForResult(intent, 200)
                  } catch (e: Exception) { finish() }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val spoken = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()?.trim() ?: ""
                      if (spoken.isNotEmpty()) AgentService.instance?.onVoiceCommandReceived(spoken, isInterruptMode)
                  }
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/AgentService.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.HardwareBuffer
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.text.TextUtils
          import android.util.Base64
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AgentService : AccessibilityService() {
              companion object { var instance: AgentService? = null }
              private lateinit var windowManager: WindowManager
              private var floatingLayout: LinearLayout? = null
              private lateinit var topRow: LinearLayout
              private lateinit var planPreviewTv: TextView
              private lateinit var inputRow: LinearLayout
              private lateinit var dragBtn: TextView
              private lateinit var statusTv: TextView
              private lateinit var cmdInput: EditText
              private lateinit var clearInputBtn: TextView
              private lateinit var interruptBtn: TextView
              private lateinit var vaultOpenBtn: TextView
              private lateinit var micBtn: TextView
              private lateinit var actionBtn: TextView
              private lateinit var stopBtn: TextView
              private lateinit var minBtn: TextView
              private lateinit var params: WindowManager.LayoutParams

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var agentJob: Job? = null
              private var isRunning = false
              private var isMinimized = false
              private var isVoiceEnabled = true
              private var currentGoal = ""
              private var liveUserCorrection = ""
              private var researchedContext = ""
              private var latestNotificationText = ""
              private var lastScreenshotTime = 0L
              private var lastVolDownTime = 0L

              private val history = mutableListOf<String>()
              private val failedTargets = mutableSetOf<String>()
              private val nodeMap = mutableMapOf<Int, AccessibilityNodeInfo>()
              private var tts: TextToSpeech? = null

              private val flashAndLiveModels = listOf(
                  "gemini-3.8-live",
                  "gemini-3.8-flash",
                  "gemini-3.5-flash",
                  "gemini-3.5-flash-lite",
                  "gemini-3-flash-preview",
                  "gemini-2.5-flash",
                  "gemini-2.0-flash"
              )
              private val deadModels = mutableSetOf<String>()
              private var currentModelIndex = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("hi", "IN"))
                          tts?.setSpeechRate(1.18f)
                      }
                  }
                  createMovableFloatingBar()
              }

              private fun speakOut(text: String) {
                  if (!isVoiceEnabled || text.isBlank()) return
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN && isRunning) {
                      val now = System.currentTimeMillis()
                      if (now - lastVolDownTime < 650L) {
                          vibrateTick(120)
                          triggerImmediateInterruptAndListen(openVoice = true)
                          return true
                      }
                      lastVolDownTime = now
                  }
                  return super.onKeyEvent(event)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_NOTIFICATION_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: ""
                      val txt = event.text.joinToString(" ").trim()
                      if (txt.isNotEmpty() && pkg != packageName) latestNotificationText = "[$pkg] $txt"
                  }
              }

              fun onVoiceCommandReceived(spoken: String, wasInterrupted: Boolean) {
                  scope.launch {
                      tts?.stop() ; agentJob?.cancel() ; isRunning = false
                      cmdInput.setText(spoken)
                      if (wasInterrupted && currentGoal.isNotBlank()) {
                          liveUserCorrection = spoken
                          history.add("USER_INTERRUPTED: \"$spoken\"")
                          statusTv.text = "✋ सुधार: '$spoken'"
                          startGeniusAgent(true)
                      } else {
                          currentGoal = spoken ; liveUserCorrection = ""
                          startGeniusAgent(false)
                      }
                  }
              }

              private fun triggerImmediateInterruptAndListen(openVoice: Boolean) {
                  tts?.stop() ; agentJob?.cancel() ; isRunning = false
                  setWindowGhostMode(false) ; autoCollapseBar(false)
                  statusTv.text = "✋ AI रुका! बोलें क्या सुधार करना है..."
                  setTouchPassThrough(false)
                  if (openVoice) {
                      startActivity(Intent(this, VoiceActivity::class.java).apply {
                          putExtra("INTERRUPT_MODE", true)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      })
                  } else cmdInput.requestFocus()
              }

              private fun makePillButton(label: String, bgColor: String): TextView {
                  return TextView(this).apply {
                      text = label ; textSize = 11.5f ; setTextColor(Color.WHITE) ; gravity = Gravity.CENTER
                      setPadding(15, 8, 15, 8)
                      background = GradientDrawable().apply { setColor(Color.parseColor(bgColor)) ; cornerRadius = 18f }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(4, 0, 0, 0) }
                  }
              }

              private fun createMovableFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (ex: Exception) {} }
                  val dm = resources.displayMetrics
                  params = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.96).toInt(), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START ; x = (dm.widthPixels * 0.02).toInt() ; y = (dm.heightPixels * 0.68).toInt() }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL ; setPadding(14, 10, 14, 10)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#EE0F172A")) ; cornerRadius = 26f ; setStroke(2, Color.parseColor("#38BDF8")) }
                  }
                  floatingLayout = container

                  topRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL ; gravity = Gravity.CENTER_VERTICAL }
                  dragBtn = makePillButton("✥", "#1E293B")
                  var initX = 0; var initY = 0; var touchX = 0f; var touchY = 0f
                  dragBtn.setOnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> { initX = params.x ; initY = params.y ; touchX = ev.rawX ; touchY = ev.rawY ; true }
                          MotionEvent.ACTION_MOVE -> {
                              val curDm = resources.displayMetrics
                              params.x = (initX + (ev.rawX - touchX).toInt()).coerceIn(0, curDm.widthPixels - 120)
                              params.y = (initY + (ev.rawY - touchY).toInt()).coerceIn(20, curDm.heightPixels - 160)
                              try { windowManager.updateViewLayout(container, params) } catch (ex: Exception) {}
                              true
                          }
                          else -> false
                      }
                  }

                  statusTv = TextView(this).apply {
                      text = "👑 AI 12.0 Ready: बोलें या लिखें!"
                      setTextColor(Color.parseColor("#4ADE80")) ; textSize = 11.5f ; maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END ; setPadding(8, 0, 4, 0)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  interruptBtn = makePillButton("✋", "#D97706").apply { setOnClickListener { triggerImmediateInterruptAndListen(true) } }
                  vaultOpenBtn = makePillButton("⚙️", "#334155").apply { startActivity(Intent(this@AgentService, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                  stopBtn = makePillButton("⏹", "#DC2626").apply { setOnClickListener { stopAgent("⏹ रोक दिया गया।") } }
                  minBtn = makePillButton("➖", "#475569").apply { setOnClickListener { autoCollapseBar(!isMinimized) } }

                  topRow.addView(dragBtn) ; topRow.addView(statusTv) ; topRow.addView(interruptBtn) ; topRow.addView(vaultOpenBtn) ; topRow.addView(stopBtn) ; topRow.addView(minBtn)

                  planPreviewTv = TextView(this).apply {
                      text = "🎯 अगला कदम तैयार है..."
                      setTextColor(Color.parseColor("#93C5FD")) ; textSize = 10.5f ; maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END ; setPadding(6, 4, 6, 2)
                  }

                  inputRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL ; gravity = Gravity.CENTER_VERTICAL ; setPadding(0, 6, 0, 0) }
                  cmdInput = EditText(this).apply {
                      hint = "यहाँ लिखें या 🎤 दबाएँ..."
                      setHintTextColor(Color.LTGRAY) ; setTextColor(Color.WHITE) ; textSize = 12.5f
                      setSingleLine(true) ; maxLines = 1 ; ellipsize = TextUtils.TruncateAt.END
                      setPadding(18, 9, 18, 9)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")) ; cornerRadius = 16f }
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener { _, ev ->
                          if (ev.action == MotionEvent.ACTION_DOWN) {
                              if (isRunning) { tts?.stop() ; agentJob?.cancel() ; isRunning = false ; statusTv.text = "✋ AI रुका" }
                              setTouchPassThrough(false)
                          }
                          false
                      }
                  }

                  clearInputBtn = makePillButton("✕", "#475569").apply { setOnClickListener { cmdInput.setText("") } }
                  micBtn = makePillButton("🎤", "#2563EB").apply {
                      setOnClickListener {
                          val intr = isRunning || (currentGoal.isNotBlank() && history.isNotEmpty())
                          tts?.stop() ; agentJob?.cancel() ; isRunning = false
                          startActivity(Intent(this@AgentService, VoiceActivity::class.java).apply {
                              putExtra("INTERRUPT_MODE", intr)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          })
                      }
                  }
                  actionBtn = makePillButton("▶", "#16A34A").apply {
                      setOnClickListener {
                          val q = cmdInput.text.toString().trim()
                          if (q.isNotEmpty()) {
                              tts?.stop() ; agentJob?.cancel()
                              if (currentGoal.isNotBlank() && history.isNotEmpty() && q != currentGoal) {
                                  liveUserCorrection = q ; history.add("USER_CORRECTION: \"$q\"")
                                  startGeniusAgent(true)
                              } else {
                                  currentGoal = q ; liveUserCorrection = ""
                                  startGeniusAgent(false)
                              }
                          }
                      }
                  }

                  inputRow.addView(cmdInput) ; inputRow.addView(clearInputBtn) ; inputRow.addView(micBtn) ; inputRow.addView(actionBtn)
                  container.addView(topRow) ; container.addView(planPreviewTv) ; container.addView(inputRow)
                  windowManager.addView(container, params)
              }

              private fun setTouchPassThrough(passThrough: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (passThrough) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  try { windowManager.updateViewLayout(view, params) } catch (ex: Exception) {}
              }

              private fun setWindowGhostMode(ghost: Boolean) {
                  val view = floatingLayout ?: return
                  params.flags = if (ghost) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  }
                  view.alpha = if (ghost) 0.0f else 1.0f
                  try { windowManager.updateViewLayout(view, params) } catch (ex: Exception) {}
              }

              private fun autoCollapseBar(collapse: Boolean) {
                  val view = floatingLayout ?: return
                  isMinimized = collapse
                  inputRow.visibility = if (collapse) View.GONE else View.VISIBLE
                  planPreviewTv.visibility = if (collapse && !isRunning) View.GONE else View.VISIBLE
                  minBtn.text = if (collapse) "➕" else "➖"
                  setTouchPassThrough(true)
                  try { windowManager.updateViewLayout(view, params) } catch (ex: Exception) {}
              }

              private fun getPersonalVaultSummary(): String {
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  return "Name: ${prefs.getString("vaultName","")} | Contact: ${prefs.getString("vaultContact","")} | UPI: ${prefs.getString("vaultUpi","")} | Skills: ${prefs.getString("vaultSkills","")}"
              }

              private fun tryOfflineInstantReflex(goal: String): Boolean {
                  val g = goal.trim().lowercase()
                  when {
                      g.contains("torch on") || g.contains("टॉर्च जलाओ") -> { executeSystemControl("torch_on") ; stopAgent("🔦 टॉर्च चालू!") ; return true }
                      g.contains("torch off") || g.contains("टॉर्च बंद") -> { executeSystemControl("torch_off") ; stopAgent("🔦 टॉर्च बंद!") ; return true }
                      g == "back" || g == "पीछे" -> { performGlobalAction(GLOBAL_ACTION_BACK) ; stopAgent("🔙 पीछे!") ; return true }
                      g == "home" || g == "होम" -> { performGlobalAction(GLOBAL_ACTION_HOME) ; stopAgent("🏠 होम!") ; return true }
                  }
                  return false
              }

              private fun startGeniusAgent(isResumeWithCorrection: Boolean) {
                  if (!isResumeWithCorrection && tryOfflineInstantReflex(currentGoal)) return
                  agentJob?.cancel() ; isRunning = true
                  if (!isResumeWithCorrection) { history.clear() ; failedTargets.clear() ; researchedContext = "" }
                  autoCollapseBar(true)

                  agentJob = scope.launch {
                      val installedApps = getInstalledAppNames()
                      val vaultSummary = getPersonalVaultSummary()
                      val stepQueue = mutableListOf<JSONObject>()

                      val step = JSONObject().put("action", "type").put("text", currentGoal).put("reason", "Goal execution")
                      stepQueue.add(step)

                      while (isRunning && stepQueue.isNotEmpty()) {
                          val st = stepQueue.removeAt(0)
                          executeLocalStepWithVerification(st)
                          delay(1000)
                      }
                      stopAgent("✅ काम पूरा हुआ!")
                  }
              }

              private suspend fun executeLocalStepWithVerification(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val text = step.optString("text", "")
                  statusTv.text = "⚡ $text"
                  when (action) {
                      "type" -> {
                          performSmartType(-1, -1, -1, text, true)
                          delay(1000)
                          return true
                      }
                  }
                  return false
              }

              private fun pauseForUser(alertText: String) {
                  isRunning = false ; setWindowGhostMode(false)
                  statusTv.text = alertText ; autoCollapseBar(false)
              }

              private fun stopAgent(finalText: String) {
                  isRunning = false ; agentJob?.cancel() ; nodeMap.clear()
                  setWindowGhostMode(false) ; statusTv.text = finalText
                  planPreviewTv.text = "🎯 अगला कदम तैयार..."
                  history.clear() ; liveUserCorrection = "" ; autoCollapseBar(false)
              }

              private suspend fun performTap(x: Float, y: Float) {
                  vibrateTick(15) ; setWindowGhostMode(true) ; delay(55)
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 95)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
                  delay(160) ; setWindowGhostMode(false)
              }

              private suspend fun performSwipe(direction: String) {
                  setWindowGhostMode(true) ; delay(50)
                  val dm = resources.displayMetrics
                  val path = Path().apply {
                      when (direction.lowercase()) {
                          "down" -> { moveTo(dm.widthPixels/2f, dm.heightPixels*0.22f) ; lineTo(dm.widthPixels/2f, dm.heightPixels*0.76f) }
                          else -> { moveTo(dm.widthPixels/2f, dm.heightPixels*0.76f) ; lineTo(dm.widthPixels/2f, dm.heightPixels*0.22f) }
                      }
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 320)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
                  delay(180) ; setWindowGhostMode(false)
              }

              private fun executeSystemControl(cmd: String): Boolean {
                  return try {
                      val c = cmd.lowercase()
                      when {
                          c.contains("torch_on") -> { val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager ; cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, true) } ; true }
                          c.contains("torch_off") -> { val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager ; cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, false) } ; true }
                          else -> false
                      }
                  } catch (e: Exception) { false }
              }

              private fun copyToClipboard(text: String) {
                  val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cb.setPrimaryClip(ClipData.newPlainText("AIClip", text))
              }

              private fun getInstalledAppNames(): String {
                  return try {
                      val pm = packageManager
                      pm.getInstalledApplications(0).mapNotNull { pm.getLaunchIntentForPackage(it.packageName)?.let { _ -> pm.getApplicationLabel(it).toString() } }.distinct().take(40).joinToString(", ")
                  } catch (e: Exception) { "YouTube, WhatsApp, Chrome" }
              }

              private suspend fun performSmartType(id: Int, x: Int, y: Int, text: String, pressEnter: Boolean): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val targetNode = findEditableNode(root)
                  if (targetNode != null) {
                      targetNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                      var typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                      if (!typed) { copyToClipboard(text) ; typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_PASTE) }
                      if (pressEnter && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          targetNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                      return typed
                  }
                  return false
              }

              private fun findEditableNode(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var focused: AccessibilityNodeInfo? = null ; var any: AccessibilityNodeInfo? = null
                  fun search(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      if (node.isEditable) {
                          if (node.isFocused) { focused = node ; return }
                          if (any == null) any = node
                      }
                      for (i in 0 until node.childCount) { search(node.getChild(i)) ; if (focused != null) return }
                  }
                  search(root)
                  return focused ?: any
              }

              private fun vibrateTick(ms: Long) {
                  try { (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)) } catch (e: Exception) {}
              }

              override fun onInterrupt() {}
              override fun onDestroy() {
                  if (instance == this) instance = null
                  agentJob?.cancel()
                  floatingLayout?.let { try { windowManager.removeView(it) } catch (ex: Exception) {} }
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Install Gradle 8.5 Directly and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Phone-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
