name: Build AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Clean Android Project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ai/phoneagent
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "AIPhoneAgent"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ai.phoneagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ai.phoneagent"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="AI Phone Commander"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AgentService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="60" />
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/MainActivity.kt
          package com.ai.phoneagent

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0F172A"))
                  }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 70, 50, 50)
                  }
                  val title = TextView(this).apply {
                      text = "🤖 AI Phone Commander 3.0\n(Human Brain Edition)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#818CF8"))
                      setPadding(0, 0, 0, 30)
                  }
                  val apiInput = EditText(this).apply {
                      hint = "Yahan Gemini API Key daalein (AIza...)"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setText(prefs.getString("apiKey", ""))
                  }
                  val saveBtn = Button(this).apply {
                      text = "💾 Save Gemini API Key"
                      setOnClickListener {
                          prefs.edit().putString("apiKey", apiInput.text.toString().trim()).apply()
                          Toast.makeText(this@MainActivity, "API Key Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val micPermBtn = Button(this).apply {
                      text = "🎤 Enable Voice Mic Permission"
                      setOnClickListener {
                          if (this@MainActivity.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              this@MainActivity.requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                          } else {
                              Toast.makeText(this@MainActivity, "Mic Permission Pehle se ON hai!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  val overlayBtn = Button(this).apply {
                      text = "1️⃣ Enable Floating Window Permission"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              Toast.makeText(this@MainActivity, "Floating Permission Pehle se ON hai!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  val accBtn = Button(this).apply {
                      text = "2️⃣ Enable Accessibility Service (Main Haath)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  val memInput = EditText(this).apply {
                      hint = "AI Memory (Jaise: Mera naam Suraj hai...)"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setText(prefs.getString("userMemory", ""))
                  }
                  val saveMemBtn = Button(this).apply {
                      text = "🧠 Save Personal Memory"
                      setOnClickListener {
                          prefs.edit().putString("userMemory", memInput.text.toString().trim()).apply()
                          Toast.makeText(this@MainActivity, "Memory Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val infoText = TextView(this).apply {
                      text = "\n🚀 3.0 All-in-One Human Features:\n• Instant 0.25s Reflex Polling (5x Speed)\n• Direct App & Web Shortcuts (Jugaad)\n• Live Screenshot Vision (Asli Aankhein)\n• Full Gestures (Swipe, Double Tap, Long Press)\n• Clipboard Copy-Paste & Personal Memory\n• 🎤 Voice Mic + 🔊 Bolne wala AI\n• Torch, Volume & Notification Control"
                      setTextColor(Color.LTGRAY)
                      textSize = 13f
                  }
                  layout.addView(title)
                  layout.addView(apiInput)
                  layout.addView(saveBtn)
                  layout.addView(micPermBtn)
                  layout.addView(overlayBtn)
                  layout.addView(accBtn)
                  layout.addView(memInput)
                  layout.addView(saveMemBtn)
                  layout.addView(infoText)
                  scroll.addView(layout)
                  setContentView(scroll)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ai/phoneagent/AgentService.kt
          package com.ai.phoneagent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.ColorSpace
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.HardwareBuffer
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.util.Base64
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class AgentService : AccessibilityService() {
              private lateinit var windowManager: WindowManager
              private lateinit var floatingLayout: LinearLayout
              private lateinit var statusTv: TextView
              private lateinit var cmdInput: EditText
              private lateinit var micBtn: Button
              private lateinit var actionBtn: Button
              private lateinit var ttsToggleBtn: Button
              private lateinit var stopBtn: Button
              private lateinit var params: WindowManager.LayoutParams

              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var isRunning = false
              private var isVoiceEnabled = true
              private var currentGoal = ""
              private val history = mutableListOf<String>()
              private val stepQueue = mutableListOf<JSONObject>()

              private var tts: TextToSpeech? = null
              private var speechRecognizer: SpeechRecognizer? = null

              private val modelList = listOf(
                  "gemini-3.8-flash",
                  "gemini-3.7-flash",
                  "gemini-3.6-flash",
                  "gemini-3.5-flash",
                  "gemini-3.5-flash-lite",
                  "gemini-3-flash-preview",
                  "gemini-3.1-flash-lite",
                  "gemini-2.5-pro",
                  "gemini-2.5-flash",
                  "gemini-2.5-flash-lite",
                  "gemini-2.0-flash",
                  "gemini-1.5-pro",
                  "gemini-1.5-flash"
              )
              private var currentModelIndex = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  initVoiceEngine()
                  createFloatingBar()
              }

              private fun initVoiceEngine() {
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("hi", "IN"))
                      }
                  }
              }

              private fun speakOut(text: String) {
                  if (isVoiceEnabled && text.isNotBlank()) {
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AgentTTS")
                  }
              }

              private fun createFloatingBar() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP }

                  floatingLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#EE0F172A"))
                      setPadding(20, 20, 20, 20)
                  }
                  statusTv = TextView(this).apply {
                      text = "🧠 Human AI 3.0 Ready: Bolkar (🎤) ya likhkar kaam batayein!"
                      setTextColor(Color.parseColor("#4ADE80"))
                      textSize = 12.5f
                  }
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  cmdInput = EditText(this).apply {
                      hint = "Kuch bhi likho ya 🎤 dabao..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnTouchListener { _, event ->
                          if (event.action == MotionEvent.ACTION_DOWN) {
                              setTouchPassThrough(false)
                          }
                          false
                      }
                      setOnClickListener {
                          setTouchPassThrough(false)
                      }
                  }
                  micBtn = Button(this).apply {
                      text = "🎤"
                      setOnClickListener { startVoiceListening() }
                  }
                  actionBtn = Button(this).apply {
                      text = "▶"
                      setOnClickListener {
                          val q = cmdInput.text.toString().trim()
                          if (q.isNotEmpty()) {
                              currentGoal = q
                              startAutonomousAgent()
                          }
                      }
                  }
                  ttsToggleBtn = Button(this).apply {
                      text = "🔊"
                      setOnClickListener {
                          isVoiceEnabled = !isVoiceEnabled
                          ttsToggleBtn.text = if (isVoiceEnabled) "🔊" else "🔇"
                          if (!isVoiceEnabled) tts?.stop()
                      }
                  }
                  stopBtn = Button(this).apply {
                      text = "⏹"
                      setOnClickListener { stopAgent("⏹ Aapne AI ko rok diya.") }
                  }
                  row.addView(cmdInput)
                  row.addView(micBtn)
                  row.addView(actionBtn)
                  row.addView(ttsToggleBtn)
                  row.addView(stopBtn)
                  floatingLayout.addView(statusTv)
                  floatingLayout.addView(row)
                  windowManager.addView(floatingLayout, params)
              }

              private fun startVoiceListening() {
                  try {
                      if (speechRecognizer == null) {
                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      }
                      speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              statusTv.setTextColor(Color.parseColor("#38BDF8"))
                              statusTv.text = "🎤 Boliye, main sun raha hoon..."
                          }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onError(error: Int) {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⚠️ Mic sun nahi paya (App mein Mic Permission check karein)"
                          }
                          override fun onResults(results: Bundle?) {
                              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              val spoken = matches?.firstOrNull() ?: ""
                              if (spoken.isNotEmpty()) {
                                  cmdInput.setText(spoken)
                                  currentGoal = spoken
                                  startAutonomousAgent()
                              }
                          }
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                      speechRecognizer?.startListening(intent)
                  } catch (e: Exception) {
                      statusTv.text = "⚠️ Voice error: ${e.message}"
                  }
              }

              private fun setTouchPassThrough(passThrough: Boolean) {
                  params.flags = if (passThrough) WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE else WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                  windowManager.updateViewLayout(floatingLayout, params)
              }

              private fun startAutonomousAgent() {
                  if (isRunning) return
                  isRunning = true
                  actionBtn.text = "⏳"
                  stepQueue.clear()
                  setTouchPassThrough(true)

                  scope.launch {
                      statusTv.setTextColor(Color.parseColor("#38BDF8"))
                      statusTv.text = "🧠 Master Plan aur Direct Shortcut bana raha hoon..."
                      speakOut("Main kaam shuru kar raha hoon")

                      val installedApps = getInstalledAppNames()
                      val initialScreen = readScreenElements()
                      val masterPlan = createMasterPlanWithAI(currentGoal, installedApps, initialScreen)

                      if (!isRunning) return@launch

                      saveMemoryIfAny(masterPlan.optString("remember", ""))

                      if (masterPlan.optString("action") == "ask_user") {
                          val msg = masterPlan.optString("message")
                          speakOut(msg)
                          pauseForUser("⚠️ $msg")
                          return@launch
                      }

                      val speakMsg = masterPlan.optString("speak", "")
                      if (speakMsg.isNotEmpty()) speakOut(speakMsg)

                      val understoodGoal = masterPlan.optString("understood_goal", currentGoal)
                      currentGoal = understoodGoal
                      val planArray = masterPlan.optJSONArray("steps")
                      if (planArray != null) {
                          for (i in 0 until planArray.length()) {
                              stepQueue.add(planArray.getJSONObject(i))
                          }
                      }

                      var consecutiveFailures = 0

                      while (isRunning) {
                          if (stepQueue.isNotEmpty()) {
                              val step = stepQueue.removeAt(0)
                              val stepSuccess = executeStepFast(step)
                              if (!isRunning) break

                              if (!stepSuccess) {
                                  stepQueue.clear()
                                  statusTv.setTextColor(Color.parseColor("#FBBF24"))
                                  statusTv.text = "👀 Screen badli: Screenshot aur dimaag se naya rasta nikal raha hoon..."
                              } else {
                                  consecutiveFailures = 0
                                  continue
                              }
                          }

                          statusTv.setTextColor(Color.parseColor("#60A5FA"))
                          statusTv.text = "👀 Live Screen & Vision check kar raha hoon..."
                          val liveScreen = readScreenElements()
                          val needScreenshot = consecutiveFailures > 0 || liveScreen.lines().size < 5
                          val screenshotB64 = if (needScreenshot) captureScreenBase64() else null

                          val recoveryPlan = solveObstacleWithAI(currentGoal, liveScreen, screenshotB64)
                          if (!isRunning) break

                          saveMemoryIfAny(recoveryPlan.optString("remember", ""))
                          val stepSpeak = recoveryPlan.optString("speak", "")
                          if (stepSpeak.isNotEmpty()) speakOut(stepSpeak)

                          val topAction = recoveryPlan.optString("action", "")
                          if (topAction == "all_limits_exhausted") {
                              statusTv.setTextColor(Color.parseColor("#FBBF24"))
                              statusTv.text = "⏳ Models switch ho rahe hain, 6 sec wait..."
                              delay(6000)
                              continue
                          } else if (topAction == "done") {
                              val doneMsg = recoveryPlan.optString("message", "Kaam poora ho gaya!")
                              speakOut(doneMsg)
                              vibratePhone()
                              stopAgent("✅ $doneMsg")
                              break
                          } else if (topAction == "ask_user") {
                              val askMsg = recoveryPlan.optString("message", "Yahan aapki madad chahiye")
                              speakOut(askMsg)
                              vibratePhone()
                              pauseForUser("⚠️ AI Ruka Hai: $askMsg\n(Solve karke ▶ dabayein)")
                              break
                          }

                          val nextSteps = recoveryPlan.optJSONArray("steps")
                          if (nextSteps != null && nextSteps.length() > 0) {
                              for (i in 0 until nextSteps.length()) {
                                  stepQueue.add(nextSteps.getJSONObject(i))
                              }
                          } else if (topAction.isNotEmpty()) {
                              stepQueue.add(recoveryPlan)
                          } else {
                              consecutiveFailures++
                              if (consecutiveFailures >= 3) {
                                  speakOut("Kaam poora ho gaya")
                                  stopAgent("✅ Kaam poora ho gaya!")
                                  break
                              }
                          }
                      }
                  }
              }

              private suspend fun executeStepFast(step: JSONObject): Boolean {
                  val action = step.optString("action", "")
                  val reason = step.optString("reason", action)
                  val target = step.optString("target", "")
                  val text = step.optString("text", "")
                  val x = step.optInt("x", -1)
                  val y = step.optInt("y", -1)

                  statusTv.setTextColor(Color.parseColor("#A7F3D0"))
                  statusTv.text = "⚡ $reason"
                  history.add("$action($target $text)")
                  if (history.size > 14) history.removeAt(0)

                  when (action) {
                      "shortcut" -> {
                          val sType = step.optString("shortcut_type", "")
                          val data = step.optString("data", text)
                          val ok = runDirectShortcut(sType, data)
                          delay(1500)
                          return ok
                      }
                      "open_app" -> {
                          val appName = step.optString("app_name", target)
                          val opened = openAppByName(appName)
                          if (opened) waitForScreenChange(2200)
                          return opened
                      }
                      "click" -> {
                          if (target.isNotEmpty()) {
                              val coords = waitForElementCoords(target, 3200L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(500)
                                  return true
                              }
                          }
                          if (x > 0 && y > 0) {
                              performTap(x.toFloat(), y.toFloat())
                              delay(500)
                              return true
                          }
                          return false
                      }
                      "double_tap" -> {
                          val coords = if (target.isNotEmpty()) waitForElementCoords(target, 2500L) else null
                          val tx = coords?.first ?: if (x > 0) x else 540
                          val ty = coords?.second ?: if (y > 0) y else 960
                          performDoubleTap(tx.toFloat(), ty.toFloat())
                          delay(500)
                          return true
                      }
                      "long_press" -> {
                          val coords = if (target.isNotEmpty()) waitForElementCoords(target, 2500L) else null
                          val tx = coords?.first ?: if (x > 0) x else 540
                          val ty = coords?.second ?: if (y > 0) y else 960
                          performLongPress(tx.toFloat(), ty.toFloat())
                          delay(600)
                          return true
                      }
                      "type", "type_and_enter" -> {
                          val pressEnter = (action == "type_and_enter")
                          var typed = typeTextAndSubmit(text, pressEnter)
                          if (!typed && target.isNotEmpty()) {
                              val coords = waitForElementCoords(target, 2800L)
                              if (coords != null) {
                                  performTap(coords.first.toFloat(), coords.second.toFloat())
                                  delay(550)
                                  typed = typeTextAndSubmit(text, pressEnter)
                              }
                          }
                          if (!typed && x > 0 && y > 0) {
                              performTap(x.toFloat(), y.toFloat())
                              delay(550)
                              typed = typeTextAndSubmit(text, pressEnter)
                          }
                          delay(if (pressEnter) 1200L else 500L)
                          return typed
                      }
                      "click_first_result" -> {
                          delay(900)
                          val resCoords = findFirstMainResultOnScreen()
                          if (resCoords != null) {
                              performTap(resCoords.first.toFloat(), resCoords.second.toFloat())
                              delay(900)
                              return true
                          }
                          return false
                      }
                      "swipe", "scroll_down", "scroll_up" -> {
                          val dir = when (action) {
                              "scroll_down" -> "up"
                              "scroll_up" -> "down"
                              else -> step.optString("direction", "up")
                          }
                          performSwipe(dir)
                          delay(700)
                          return true
                      }
                      "copy" -> {
                          copyToClipboard(text)
                          return true
                      }
                      "paste" -> {
                          return pasteFromClipboard()
                      }
                      "system_control" -> {
                          val cmd = step.optString("command", target)
                          return executeSystemControl(cmd)
                      }
                      "back" -> {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          delay(600)
                          return true
                      }
                      "home" -> {
                          performGlobalAction(GLOBAL_ACTION_HOME)
                          delay(600)
                          return true
                      }
                      "wait" -> {
                          delay(1500)
                          return true
                      }
                      "done" -> {
                          val msg = step.optString("message", "Kaam poora ho gaya!")
                          speakOut(msg)
                          vibratePhone()
                          stopAgent("✅ $msg")
                          return true
                      }
                  }
                  return false
              }

              private suspend fun waitForElementCoords(keywordsPipe: String, timeoutMs: Long): Pair<Int, Int>? {
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < timeoutMs && isRunning) {
                      val found = findElementCoordsOnScreen(keywordsPipe)
                      if (found != null) return found
                      delay(250)
                  }
                  return null
              }

              private suspend fun waitForScreenChange(maxWaitMs: Long) {
                  val initialPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                  val start = System.currentTimeMillis()
                  while (System.currentTimeMillis() - start < maxWaitMs && isRunning) {
                      delay(250)
                      val nowPkg = rootInActiveWindow?.packageName?.toString() ?: ""
                      if (nowPkg.isNotEmpty() && nowPkg != initialPkg) {
                          delay(350)
                          return
                      }
                  }
              }

              private fun runDirectShortcut(shortcutType: String, data: String): Boolean {
                  return try {
                      val intent = when (shortcutType.lowercase()) {
                          "youtube_search" -> Intent(Intent.ACTION_SEARCH).apply {
                              setPackage("com.google.android.youtube")
                              putExtra("query", data)
                          }
                          "web_search" -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=${Uri.encode(data)}"))
                          "open_url" -> {
                              val url = if (data.startsWith("http")) data else "https://$data"
                              Intent(Intent.ACTION_VIEW, Uri.parse(url))
                          }
                          "dial" -> Intent(Intent.ACTION_DIAL, Uri.parse("tel:$data"))
                          "whatsapp_text" -> Intent(Intent.ACTION_SEND).apply {
                              setType("text/plain")
                              setPackage("com.whatsapp")
                              putExtra(Intent.EXTRA_TEXT, data)
                          }
                          "settings_wifi" -> Intent(Settings.ACTION_WIFI_SETTINGS)
                          "settings_bluetooth" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                          else -> null
                      }
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                          true
                      } else false
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun executeSystemControl(cmd: String): Boolean {
                  return try {
                      val c = cmd.lowercase()
                      when {
                          c.contains("torch_on") || c.contains("flash_on") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, true) }
                              true
                          }
                          c.contains("torch_off") || c.contains("flash_off") -> {
                              val cam = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cam.cameraIdList.firstOrNull()?.let { cam.setTorchMode(it, false) }
                              true
                          }
                          c.contains("volume_up") -> {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              am.adjustVolume(AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                              true
                          }
                          c.contains("volume_down") -> {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              am.adjustVolume(AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                              true
                          }
                          c.contains("mute") -> {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              am.adjustVolume(AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI)
                              true
                          }
                          c.contains("notification") -> performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)
                          c.contains("quick_settings") -> performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)
                          c.contains("recents") -> performGlobalAction(GLOBAL_ACTION_RECENTS)
                          else -> false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private suspend fun captureScreenBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val deferred = CompletableDeferred<String?>()
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(screenshot: AccessibilityService.ScreenshotResult) {
                              try {
                                  val buffer: HardwareBuffer = screenshot.hardwareBuffer
                                  val cs: ColorSpace = screenshot.colorSpace
                                  val bmp = Bitmap.wrapHardwareBuffer(buffer, cs)
                                  val soft = bmp?.copy(Bitmap.Config.ARGB_8888, false)
                                  buffer.close()
                                  bmp?.recycle()
                                  if (soft != null) {
                                      val scaled = Bitmap.createScaledBitmap(soft, 480, 960, true)
                                      soft.recycle()
                                      val out = ByteArrayOutputStream()
                                      scaled.compress(Bitmap.CompressFormat.JPEG, 60, out)
                                      scaled.recycle()
                                      val b64 = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                                      deferred.complete(b64)
                                  } else {
                                      deferred.complete(null)
                                  }
                              } catch (e: Exception) {
                                  deferred.complete(null)
                              }
                          }
                          override fun onFailure(errorCode: Int) {
                              deferred.complete(null)
                          }
                      })
                  } catch (e: Exception) {
                      return null
                  }
                  return withTimeoutOrNull(3000L) { deferred.await() }
              }

              private fun copyToClipboard(text: String) {
                  val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cb.setPrimaryClip(ClipData.newPlainText("AIClip", text))
              }

              private fun pasteFromClipboard(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  fun findAndPaste(node: AccessibilityNodeInfo?): Boolean {
                      if (node == null) return false
                      if (node.isEditable || node.isFocused) {
                          if (node.performAction(AccessibilityNodeInfo.ACTION_PASTE)) return true
                      }
                      for (i in 0 until node.childCount) {
                          if (findAndPaste(node.getChild(i))) return true
                      }
                      return false
                  }
                  return findAndPaste(root)
              }

              private fun saveMemoryIfAny(fact: String) {
                  if (fact.isBlank()) return
                  val prefs = getSharedPreferences("AgentPrefs", Context.MODE_PRIVATE)
                  val old = prefs.getString("userMemory", "") ?: ""
                  if (!old.contains(fact, ignoreCase = true)) {
                      val updated = if (old.isEmpty()) fact else "$old | $fact"
                      prefs.edit().putString("userMemory", updated.takeLast(600)).apply()
                  }
              }

              private fun findElementCoordsOnScreen(keywordsPipe: String): Pair<Int, Int>? {
                  val root = rootInActiveWindow ?: return null
                  val keywords = keywordsPipe.split("|", ",").map { it.trim().lowercase() }.filter { it.isNotEmpty() }
                  if (keywords.isEmpty()) return null

                  var bestMatch: Pair<Int, Int>? = null

                  fun searchNode(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser || bestMatch != null) return
                      val rect = Rect()
                      node.getBoundsInScreen(rect)
                      if (rect.width() > 10 && rect.height() > 10 && rect.centerX() > 0 && rect.centerY() > 110) {
                          val text = (node.text ?: "").toString().lowercase()
                          val desc = (node.contentDescription ?: "").toString().lowercase()
                          val viewId = (node.viewIdResourceName ?: "").substringAfterLast("/").lowercase()
                          val combined = "$text $desc $viewId"

                          for (kw in keywords) {
                              if (combined.contains(kw)) {
                                  bestMatch = Pair(rect.centerX(), rect.centerY())
                                  return
                              }
                          }
                      }
                      for (i in 0 until node.childCount) {
                          searchNode(node.getChild(i))
                      }
                  }
                  searchNode(root)
                  return bestMatch
              }

              private fun findFirstMainResultOnScreen(): Pair<Int, Int>? {
                  val root = rootInActiveWindow ?: return null
                  val candidates = mutableListOf<Pair<Int, Int>>()

                  fun collect(node: AccessibilityNodeInfo?) {
                      if (node == null || !node.isVisibleToUser) return
                      val rect = Rect()
                      node.getBoundsInScreen(rect)
                      val text = (node.text ?: node.contentDescription ?: "").toString().trim()
                      if (rect.centerY() in 360..1650 && rect.width() > 140 && rect.height() > 55 && text.length > 4) {
                          if (node.isClickable || node.parent?.isClickable == true) {
                              candidates.add(Pair(rect.centerX(), rect.centerY()))
                          }
                      }
                      for (i in 0 until node.childCount) {
                          collect(node.getChild(i))
                      }
                  }
                  collect(root)
                  return candidates.minByOrNull { it.second } ?: Pair(540, 650)
              }

              private suspend fun createMasterPlanWithAI(rawCommand: String, installedApps: String, screen: String): JSONObject = withContext(Dispatchers.IO) {
